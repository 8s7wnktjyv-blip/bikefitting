# Prüft die Beispiel-E-Rechnungen (tests/xrechnung/*.xml) mit dem offiziellen KoSIT-Validator (XRechnung).
# Läuft bei Änderungen an index.html oder den Beispieldateien und von Hand. Kostenlos (öffentliches Repo).
name: E-Rechnung prüfen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/xrechnung/**'
      - '.github/workflows/erechnung.yml'

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validator und XRechnung-Konfiguration holen
        run: |
          set -e
          curl -fsSL -o kv.zip https://github.com/itplr-kosit/validator/releases/download/v1.5.0/validator-1.5.0-distribution.zip
          curl -fsSL -o xr.zip https://github.com/itplr-kosit/validator-configuration-xrechnung/releases/download/release-2024-06-20/validator-configuration-xrechnung_3.0.2_2024-06-20.zip
          mkdir -p kv xr && unzip -q kv.zip -d kv && unzip -q xr.zip -d xr
          ls kv xr
      - name: Prüfen
        run: |
          set -e
          JAR=$(ls kv/validationtool-*-standalone.jar | head -1)
          mkdir -p bericht
          java -jar "$JAR" -s xr/scenarios.xml -r xr -o bericht -h tests/xrechnung/*.xml | tee pruefung.txt
          echo "---"
          if grep -Eq "Rejected|REJECT|invalid" pruefung.txt; then echo "::error::Mindestens eine E-Rechnung wurde abgelehnt – Bericht ansehen"; exit 1; fi
          echo "Alle E-Rechnungen angenommen."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e-rechnung-pruefbericht
          path: bericht/
          retention-days: 30
