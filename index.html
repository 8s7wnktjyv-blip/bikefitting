<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FitFrame</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: freundliche Werkbank – helle Karten auf warmem Grund, 5 Hauptbereiche, Fitting als geführter Ablauf in Schritten */
:root{
  --bg:#f6f5f2; --surface:#ffffff; --surface-2:#f2f0eb; --line:#e7e3dc; --fg:#1c1f22; --muted:#5c626a; --faint:#8b9097;
  --accent:#e8620f; --accent-ink:#ffffff; --accent-strong:#b54a08; --accent-soft:#fdf0e6; --accent-line:#f5c7a4;
  --ok:#1a8754; --ok-soft:#e5f4ec; --warn:#9a6a05; --warn-soft:#fcf3dc; --bad:#c23b3b; --bad-soft:#fbe8e8; --info:#2665a8; --info-soft:#e6eef9;
  --il-bg:#f4f2ee; --il-grid:rgba(28,31,34,.045); --il-frame:#4a5058; --il-tire:#2b2f34; --il-body:#2c3136; --il-soft:#d8d3ca;
  --glass:rgba(255,255,255,.88); --shadow:0 1px 2px rgba(28,31,34,.04),0 6px 20px rgba(28,31,34,.06); --shadow-lg:0 12px 40px rgba(28,31,34,.14);
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px; --side:248px; --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111214; --surface:#1a1c1f; --surface-2:#232629; --line:#2e3236; --fg:#eeece8; --muted:#a6abb2; --faint:#757b83;
  --accent:#ff7d2e; --accent-ink:#1a0c02; --accent-strong:#ff9d5c; --accent-soft:rgba(255,125,46,.13); --accent-line:rgba(255,125,46,.42);
  --ok:#4fca93; --ok-soft:rgba(79,202,147,.13); --warn:#ebc14d; --warn-soft:rgba(235,193,77,.13); --bad:#f27777; --bad-soft:rgba(242,119,119,.13); --info:#70b3f0; --info-soft:rgba(112,179,240,.13);
  --il-bg:#1d2023; --il-grid:rgba(255,255,255,.04); --il-frame:#9aa1aa; --il-tire:#cfd3d8; --il-body:#e6e4df; --il-soft:#3a3f45;
  --glass:rgba(26,28,31,.9); --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-lg:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111214; --surface:#1a1c1f; --surface-2:#232629; --line:#2e3236; --fg:#eeece8; --muted:#a6abb2; --faint:#757b83;
  --accent:#ff7d2e; --accent-ink:#1a0c02; --accent-strong:#ff9d5c; --accent-soft:rgba(255,125,46,.13); --accent-line:rgba(255,125,46,.42);
  --ok:#4fca93; --ok-soft:rgba(79,202,147,.13); --warn:#ebc14d; --warn-soft:rgba(235,193,77,.13); --bad:#f27777; --bad-soft:rgba(242,119,119,.13); --info:#70b3f0; --info-soft:rgba(112,179,240,.13);
  --il-bg:#1d2023; --il-grid:rgba(255,255,255,.04); --il-frame:#9aa1aa; --il-tire:#cfd3d8; --il-body:#e6e4df; --il-soft:#3a3f45;
  --glass:rgba(26,28,31,.9); --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-lg:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-strong)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;line-height:1.15}
h2{font-size:20px;line-height:1.25}
h3{font-size:16px;font-weight:650}
p{margin:0}
.label{font-size:12px;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .faint{color:var(--faint)}

.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:20px 14px 24px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:20px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand svg{flex:none}
.brand b{font-size:21px;font-weight:800;letter-spacing:.02em}
.brand small{display:block;font-size:11.5px;color:var(--muted);margin-top:-2px}
.navgroup{display:flex;flex-direction:column;gap:3px}
.navgroup .label{padding:0 10px 4px}
.navbtn{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:9px 10px;color:var(--muted);cursor:pointer;font-size:14.5px;font-weight:500}
.navbtn:hover{background:var(--surface-2);color:var(--fg)}
.navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--fg);font-weight:650}
.navbtn[aria-current="page"] svg{color:var(--accent)}
.navbtn svg{width:19px;height:19px;flex:none}
.navbtn.small{font-size:13.5px;padding:6px 10px}
.navbtn.small svg{width:16px;height:16px}
.navbtn .cnt{margin-left:auto;font-size:12px;font-weight:600;color:var(--accent-strong);background:var(--accent-soft);border-radius:99px;padding:0 8px}
.demo-note{margin-top:auto;font-size:12px;color:var(--faint);border-top:1px solid var(--line);padding:12px 8px 0;display:flex;flex-direction:column;gap:8px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.topbar .crumb{font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .spacer{flex:1}
.savepill{font-size:12px;font-weight:600;border-radius:99px;padding:4px 10px;white-space:nowrap;border:0;cursor:pointer;background:var(--surface-2);color:var(--muted)}.savepill.ok{color:var(--ok,#2f8f5b)}.savepill.bad{background:#fbe3e1;color:#b3261e}
.demo-pill{font-size:12px;font-weight:600;color:var(--accent-strong);background:var(--accent-soft);border-radius:99px;padding:4px 10px;white-space:nowrap}
.content{padding-block:24px 48px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;max-width:1180px;width:100%}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.pagehead p{color:var(--muted);max-width:62ch;margin-top:6px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;box-shadow:var(--shadow)}
.panel-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-b{padding:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g-main{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.g2,.g3{grid-template-columns:minmax(0,1fr)}.li{flex-wrap:wrap}.li .grow{flex:1 0 calc(100% - 110px)}}

.kpi{padding:16px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-size:30px;font-weight:750;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .s{font-size:13px;color:var(--muted)}

/* Startkacheln */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;cursor:pointer;box-shadow:var(--shadow);min-width:0}
.tile:hover{border-color:var(--accent-line)}
.tile .ti{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-strong)}
.tile .ti svg{width:22px;height:22px}
.tile b{font-size:16px;font-weight:650}
.tile span{font-size:13px;color:var(--muted)}
.tile.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile.main .ti{background:rgba(255,255,255,.22);color:var(--accent-ink)}
.tile.main span{color:var(--accent-ink);opacity:.85}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-size:14px;font-weight:600;white-space:nowrap;min-height:40px}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:none;border-color:transparent}
.btn.sm{padding:5px 11px;font-size:13px;min-height:32px;border-radius:8px}
.btn.danger{color:var(--bad)}
.btn svg{width:16px;height:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.input,select.input,textarea.input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0;font-size:16px;min-height:42px}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{min-height:80px;resize:vertical}
.form{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.form .wide{grid-column:1/-1}
.search{max-width:340px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{background:none;border:0;padding:6px 13px;cursor:pointer;color:var(--muted);font-size:13.5px;font-weight:600;border-radius:8px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

/* Schritte */
.steps{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.step{display:flex;align-items:center;gap:8px;background:none;border:1px solid transparent;border-radius:99px;padding:6px 12px 6px 6px;cursor:pointer;color:var(--muted);white-space:nowrap;font-weight:600;font-size:14px}
.step i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-size:13px;color:var(--muted)}
.step.done i{background:var(--ok-soft);color:var(--ok)}
.step[aria-current="step"]{background:var(--accent-soft);color:var(--fg);border-color:var(--accent-line)}
.step[aria-current="step"] i{background:var(--accent);color:var(--accent-ink)}
.stepnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding:12px 0;margin-top:4px;position:sticky;bottom:0;background:var(--surface);z-index:5}
#view section.panel{scroll-margin-top:140px}
.stepbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 61px);z-index:15;background:var(--surface);border-radius:var(--r) var(--r) 0 0}
@media (max-width:860px){.stepnav{bottom:calc(66px + env(safe-area-inset-bottom,0px))}.stepbar{top:calc(env(safe-area-inset-top,0px) + 61px)}}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
.up{color:var(--accent-strong)} .down{color:var(--info)}
@media (max-width:640px){
  table.rcard thead{display:none}
  table.rcard,table.rcard tbody,table.rcard tr,table.rcard td{display:block;width:100%}
  table.rcard tr{border:1px solid var(--line);border-radius:12px;margin:0 0 10px;padding:6px 12px;background:var(--surface)}
  table.rcard td{border:0;padding:6px 0;display:flex;justify-content:space-between;gap:12px;text-align:right}
  table.rcard td::before{content:attr(data-l);color:var(--muted);font-size:13px;text-align:left;flex:none;max-width:45%}
  table.rcard td:first-child{text-align:left;font-weight:600;display:block}
  table.rcard td:first-child::before{display:none}
  table.rcard td:empty{display:none}
  .tw:has(table.rcard){padding:10px}
}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap;line-height:1.45}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.nodot::before{display:none}
.c-ok{color:var(--ok);background:var(--ok-soft)}
.c-warn{color:var(--warn);background:var(--warn-soft)}
.c-bad{color:var(--bad);background:var(--bad-soft)}
.c-info{color:var(--info);background:var(--info-soft)}
.c-acc{color:var(--accent-strong);background:var(--accent-soft)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--faint);background:none;border:0;padding:2px 4px;cursor:help;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%}
.st-i::before{background:var(--ok)} .st-s::before{background:var(--info)} .st-k::before{background:var(--faint)} .st-x::before{background:var(--warn)}
.src{font-size:12px;color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:640px){#today .li,.list .li.appt{flex-wrap:wrap}#today .li .grow{flex:1 0 calc(100% - 120px)}#today .li .avatar{display:none}#today .li .sub{white-space:normal}}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.camcard{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:14px;border:1px dashed var(--accent-line);background:var(--accent-soft)}
.camcard .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--surface);color:var(--accent-strong);flex:none}
.camcard .ico svg{width:22px;height:22px}
.camcard b{display:block;font-size:15.5px}
.sesshead{display:flex;align-items:center;gap:12px}
.sesshead h1{font-size:22px}
.sesshead p{color:var(--muted);font-size:14px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stepnav{flex-wrap:nowrap!important;align-items:center}
.step{padding:5px 10px 5px 5px;font-size:13.5px}
.step i{width:24px;height:24px}
.steps{justify-content:space-between}
@media (max-width:480px){.step:not([aria-current]) .lbl{display:none}.step:not([aria-current]){padding:4px}.hide-sm{display:none}.step{gap:5px;padding:4px 8px 4px 4px;font-size:12.5px}.step i{width:22px;height:22px;font-size:12px}.steps{gap:2px}.panel-h.stepbar{padding:8px 6px!important}}
.wiz .illus{max-width:340px}
.wiz .illus svg{max-height:170px}
.cmp{display:flex;flex-direction:column}
.cmp .li{padding:10px 0;gap:10px}
.cmp .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.wiz{display:flex;flex-direction:column;gap:16px}
.effects{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.effects li{display:flex;flex-direction:column;gap:1px;font-size:14px;padding-left:12px;border-left:3px solid var(--line)}
.effects li.comp{border-left-color:var(--accent)}
.effects li span{color:var(--muted);font-size:13.5px}
.checks .li{flex-wrap:wrap;justify-content:space-between}.checks .li .grow{flex-basis:100%;order:3}
.effbox{background:var(--surface-2);border-radius:12px;padding:12px 14px}
.plan-steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:12px}
.tgt{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;margin-top:4px;color:var(--muted)}
.tgt b{color:var(--fg)} .tgt b.ok{color:var(--ok,#2f8f5b)} .tgt b.part,.tgt .part{color:var(--warn)}
.hoodcard{display:flex;gap:12px;padding:14px;border-radius:14px;background:var(--accent-soft)}
.hoodcard .hc-ico{width:38px;height:38px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.hc-big{font-size:28px;font-weight:700;line-height:1.1;margin:4px 0 2px;font-variant-numeric:tabular-nums}.hc-big span{font-size:14px;font-weight:500;color:var(--muted)}
.glance{display:flex;flex-direction:column;gap:8px}
.gl{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface-2);border-left:5px solid var(--line)}
.gl .dot{width:12px;height:12px;border-radius:50%;background:var(--faint);flex:none}
.gl.ok{border-left-color:var(--ok,#2f8f5b)}.gl.ok .dot{background:var(--ok,#2f8f5b)}
.gl.warn{border-left-color:var(--warn)}.gl.warn .dot{background:var(--warn)}
.gl.bad{border-left-color:var(--bad,#c4423a)}.gl.bad .dot{background:var(--bad,#c4423a)}
.gl .t{font-weight:600}.gl .gv{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.gl .gv b{font-size:18px}
.gl .sub{font-size:12.5px;color:var(--muted)}
.gstart{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px;border-radius:16px;background:var(--accent-soft)}
.gstart>div:first-child{display:flex;flex-direction:column;gap:2px}
.gcard{display:flex;flex-direction:column;gap:14px;animation:ffUp .35s ease both}
.gc-head{display:flex;gap:14px;align-items:center}.gc-ill{width:110px;flex:none}.gc-ill svg{width:100%;height:auto}
.gcard h2{font-size:24px;margin-top:2px}
.gc-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gn{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;background:var(--surface-2);border-top:4px solid var(--line)}
.gn span{font-size:12.5px;color:var(--muted)}.gn b{font-size:24px;font-variant-numeric:tabular-nums}.gn i{font-style:normal;font-size:12.5px;color:var(--muted)}
.gn.ok{border-top-color:var(--ok,#2f8f5b)}.gn.warn{border-top-color:var(--warn)}.gn.bad{border-top-color:var(--bad,#c4423a)}.gn.tgt{border-top-color:var(--info)}
.gc-sec h4{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:4px}
.gc-sec ul,.gc-sec ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.gc-sec.err li{color:var(--muted)}.gc-sec.err h4{color:var(--warn)}
.torque{margin-top:8px;font-size:14px;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.gc-act{display:flex;flex-direction:column;gap:8px}.gc-act>.btn{width:100%;justify-content:center}

@keyframes ffIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ffNext{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes ffPrev{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes ffPop{0%{transform:scale(.85)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes ffUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes ffSlide{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes ffFade{from{opacity:0}to{opacity:1}}
@keyframes ffDraw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:no-preference){
  .anim-in{animation:ffIn .26s var(--ease)}
  .anim-next{animation:ffNext .28s var(--ease)}
  .anim-prev{animation:ffPrev .28s var(--ease)}
  .anim-next .illus .il-h,.anim-prev .illus .il-h{stroke-dasharray:420;stroke-dashoffset:420;animation:ffDraw .8s .15s var(--ease) forwards}
  .anim-next .illus .il-head,.anim-prev .illus .il-head{opacity:0;animation:ffFade .3s .7s forwards}
  .toast{animation:ffUp .22s var(--ease)}
  .drawer{animation:ffSlide .26s var(--ease)}
  .scrim{animation:ffFade .2s}
  .chipbtn.pop{animation:ffPop .26s var(--ease)}
  .btn,.chipbtn,.tile,.step,.navbtn,.li.click{transition:transform .12s,background-color .15s,border-color .15s,box-shadow .2s,color .15s}
  .btn:active,.chipbtn:active{transform:scale(.97)}
  .tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
  .wiz-bar i{transition:width .45s var(--ease)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== Design „Atelier“: warmes Papier, Graphit, Kupfer – ruhig, edel, freundlich ===== */
:root{
  --sel:#262b31; --sel-ink:#ffffff; --mat:#262b31; --mat-2:#3a4047; --laser:#d9622c;
  --bg:#f5f3ef; --surface:#ffffff; --surface-2:#f2efea; --line:#e6e1d9; --fg:#1d2126; --muted:#585e66; --faint:#878d94;
  --accent:#d9622c; --accent-ink:#ffffff; --accent-strong:#b24c1d; --accent-soft:#fcefe7; --accent-line:#f1c6ad;
  --ok:#2f8f63; --ok-soft:#e5f3eb; --warn:#a8780e; --warn-soft:#fbf2d9; --bad:#c8402f; --bad-soft:#fae6e2; --info:#4a6f8a; --info-soft:#e8eff4;
  --il-bg:#f2efea; --il-frame:#4a5058; --il-tire:#22272c; --il-body:#2c3238; --il-soft:#dcd6cc;
  --f-head:"Archivo","Figtree",system-ui,sans-serif;
  --shadow:0 1px 2px rgba(29,33,38,.04),0 10px 30px -18px rgba(29,33,38,.22); --r:14px;
  --hero-glow:radial-gradient(120% 140% at 100% 0%,#fbe7da 0%,rgba(251,231,218,0) 55%);
}

  --sel:#f1f3f4; --sel-ink:#262b31; --mat:#f1f3f4; --mat-2:#c9cfd3;
  --bg:#3d4348; --surface:#484f55; --surface-2:#535a61; --line:#626a71; --fg:#f2f4f5; --muted:#cbd2d5; --faint:#a2abb0; --glass:rgba(72,79,85,.94);
  --accent:#f08a55; --laser:#f08a55; --accent-ink:#2a1206; --accent-strong:#ffa77a; --accent-soft:rgba(240,138,85,.16); --accent-line:rgba(240,138,85,.45);
  --il-bg:#535a61; --il-frame:#c2ccd0; --il-tire:#e6eaec; --il-body:#f2f4f5; --il-soft:#6a737a;
  --hero-glow:radial-gradient(120% 140% at 100% 0%,rgba(240,138,85,.18) 0%,rgba(240,138,85,0) 55%);}}

  --sel:#f1f3f4; --sel-ink:#262b31; --mat:#f1f3f4; --mat-2:#c9cfd3;

const IL = (()=>{

  const ci=(x,y,r,c='b',fill)=>`<circle cx="${x}" cy="${y}" r="${r}" class="il-${c}${fill?' il-fill':''}"/>`;
  const tx=(x,y,t,anchor='middle',c='t')=>`<text x="${x}" y="${y}" text-anchor="${anchor}" class="il-${c}">${t}</text>`;
  const head=(x,y,ang)=>{ const a1=ang+2.6, a2=ang-2.6; return `<path d="M${x},${y} L${x+7*Math.cos(a1)},${y+7*Math.sin(a1)} L${x+7*Math.cos(a2)},${y+7*Math.sin(a2)}Z" class="il-head"/>`; };
  const arw=(x1,y1,x2,y2,both=true)=>{ const a=Math.atan2(y2-y1,x2-x1); return ln(x1,y1,x2,y2,'h',2.4)+head(x2,y2,a)+(both?head(x1,y1,a+Math.PI):''); };
  const arc=(cx,cy,r,a1,a2)=>{ const p=a=>[cx+r*Math.cos(a*Math.PI/180),cy-r*Math.sin(a*Math.PI/180)]; const [x1,y1]=p(a1),[x2,y2]=p(a2); const large=Math.abs(a2-a1)>180?1:0; const sweep=a2>a1?0:1; return `<path d="M${x1},${y1} A${r},${r} 0 ${large} ${sweep} ${x2},${y2}" class="il-h" style="fill:none;stroke-width:2.4"/>`; };
  const dash=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="il-d"/>`;
  const svg=(inner,label,vb='0 0 320 180')=>`<svg viewBox="${vb}" role="img" aria-label="${label}">${inner}</svg>`;

    ln(ST[0],ST[1],120,42,'b',4), `<path d="M${SAD[0]},${SAD[1]} Q115,34 ${SAD[2]},${SAD[3]}" class="il-b" style="stroke-width:6;fill:none"/>`,
    ln(HT[0],HT[1],HT[0]-2,HT[1]-6,opt.spacer?'h':'b',opt.spacer?7:6),

    `<path d="M${BAR[0]-4},${BAR[1]-10} q11,0 11,10 q0,11 -9,13" class="il-b" style="fill:none;stroke-width:4.5"/>`,
    ln(BB[0],BB[1],opt.crankDown?150:132,opt.crankDown?160:150,opt.crank?'h':'b',opt.crank?5.5:5), `<rect x="${(opt.crankDown?150:132)-8}" y="${(opt.crankDown?160:150)-2.5}" width="16" height="5" rx="2" class="il-b" style="fill:var(--il-frame);stroke:none"/>`, ci(BB[0],BB[1],4,'b',1)
  ].join('');
  const rider=(hip,knee,ankle,sh,hand,hi)=>[
    ln(...sh,...hand,'p',6.5), ln(...hip,...sh,hi==='torso'?'h':'p',10), ln(...hip,...knee,hi==='leg'?'h':'p',9), ln(...knee,...ankle,hi==='leg'?'h':'p',8),
    `<path d="M${ankle[0]-4},${ankle[1]} l14,4" class="il-p" style="stroke-width:6"/>`,

  ].join('');

function scanCalc(){
  const c=cust(sess(ui.sess).customerId); const H=Number(c.body.height); const out={};
  const d=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);

    if(F.shL&&F.shR) out.shDiff=Math.round((F.shL[1]-F.shR[1])*mmF);   // + = links tiefer
    if(F.hipL&&F.hipR) out.pelDiff=Math.round((F.hipR[1]-F.hipL[1])*mmF); // + = links höher
    if(F.hipL&&F.anL&&F.hipR&&F.anR){ out.legL=Math.round(d(F.hipL,F.anL)*mmF)/10; out.legR=Math.round(d(F.hipR,F.anR)*mmF)/10; }

}

  const P=scan.pts[scan.view], r=Math.max(6,cv.width/110); ctx.lineWidth=Math.max(3,cv.width/260); ctx.strokeStyle='#ff7d2e'; ctx.font=`600 ${Math.round(r*2.2)}px Figtree, sans-serif`;
  const L=(a,b)=>{ if(P[a]&&P[b]){ ctx.beginPath(); ctx.moveTo(...P[a]); ctx.lineTo(...P[b]); ctx.stroke(); } };
  if(scan.view==='front'){ L('shL','shR'); L('hipL','hipR'); L('hipL','knL'); L('knL','anL'); L('hipR','knR'); L('knR','anR'); L('shL','hipL'); L('shR','hipR'); }
  else { L('sh','hip'); L('hip','kn'); L('kn','an'); L('sh','wr'); }
  if(P.top&&P.floor){ ctx.setLineDash([8,8]); ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.beginPath(); ctx.moveTo(P.top[0],P.top[1]); ctx.lineTo(P.top[0],P.floor[1]); ctx.stroke(); ctx.setLineDash([]); ctx.strokeStyle='#ff7d2e'; }
  SCAN[scan.view].pts.forEach(([k,l])=>{ const p=P[k]; if(!p) return; ctx.fillStyle='#ff7d2e'; ctx.beginPath(); ctx.arc(p[0],p[1],r,0,Math.PI*2); ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle='#fff'; ctx.stroke(); ctx.lineWidth=Math.max(3,cv.width/260); ctx.strokeStyle='#ff7d2e';
    ctx.fillStyle='#fff'; ctx.strokeStyle='rgba(0,0,0,.65)'; ctx.lineWidth=4; ctx.strokeText(l,p[0]+r*1.6,p[1]+r*.6); ctx.fillText(l,p[0]+r*1.6,p[1]+r*.6); ctx.strokeStyle='#ff7d2e'; ctx.lineWidth=Math.max(3,cv.width/260); });
}
function wireScan(){
  const cv=document.getElementById('scanCanvas'); if(!cv) return; drawScan();
  cv.addEventListener('pointerdown',e=>{ const rc=cv.getBoundingClientRect(); const x=(e.clientX-rc.left)*cv.width/rc.width, y=(e.clientY-rc.top)*cv.height/rc.height;
    const P=scan.pts[scan.view]; const next=SCAN[scan.view].pts.find(([k])=>!P[k]); if(!next) return; P[next[0]]=[x,y]; scanDrawer(); });
}

const chkVal=(s,k,side)=> (s.check||{})[k+(side||'')];
function checkFindings(s){
  const out=[]; const v=(k,sd)=>chkVal(s,k,sd); const add=(lvl,cat,title,text)=>out.push({lvl,cat,title,text});
  if(v('pain')==='ja') add('bad','arzt','Schmerzen angegeben','Bei akuten Schmerzen erst ärztlich oder physiotherapeutisch abklären lassen. Das Fitting kann danach folgen.');

  if(L&&R){ const d=Math.round(Math.abs(L-R)*10); const short=L<R?'links':'rechts';
    if(d>=10) add('warn','arzt',`Beinlänge: ${d} mm Unterschied`,`Deutlicher Unterschied, ${short} kürzer. Ursache von Fachleuten abklären lassen. Ausgleich am Rad nur nach Rücksprache.`);
    else if(d>=5) add('warn','ausgleich',`Beinlänge: ${d} mm Unterschied`,`${short[0].toUpperCase()+short.slice(1)} kürzer. Ausgleich prüfen: Unterlegplatte (Shim) unter dem Cleat ${short}. Faustregel: etwa die Hälfte des Unterschieds, dann fahren und nachfragen.`);
    else add('ok','fitting',`Beinlänge: ${d} mm Unterschied`,'Kein Ausgleich nötig.'); }
  if(v('pelvis')&&v('pelvis')!=='gerade') add('info','fitting',`Becken im Stehen: ${v('pelvis')}`,L&&R?'Mit der Beinlänge zusammen betrachten.':'Beinlänge messen, um die Ursache einzugrenzen.');
  if(v('shoulder')&&v('shoulder')!=='gerade') add('info','fitting',`Schultern: ${v('shoulder')}`,'Beim Fitting auf schiefe Haltung am Lenker achten.');
  ['L','R'].forEach(sd=>{ const n=sd==='L'?'links':'rechts';
    if(v('kneeTrack',sd)==='fällt nach innen') add('warn','ausgleich',`Knie ${n} fällt nach innen`,'Fußgewölbe prüfen. Einlage mit Gewölbestütze oder Keil im Schuh erwägen. Nach dem Ausgleich die Kniebeuge wiederholen.');
    if(v('kneeTrack',sd)==='fällt nach außen') add('warn','fitting',`Knie ${n} fällt nach außen`,'Seitliche Cleat-Position und Pedalachsenlänge beim Fitting beobachten.');
    if(v('arch',sd)==='flach') add('warn','ausgleich',`Fußgewölbe ${n} flach`,'Radschuh-Einlage mit Gewölbestütze prüfen.');
    if(v('arch',sd)==='hoch') add('info','ausgleich',`Fußgewölbe ${n} hoch`,'Auf Druckstellen achten, gepolsterte Einlage prüfen.');
    if(v('forefoot',sd)==='Innenkante höher') add('warn','ausgleich',`Vorfuß ${n}: Innenkante höher`,'Keil unter der Innenkante (Varus-Keil) im Schuh oder unter dem Cleat prüfen.');
    if(v('forefoot',sd)==='Außenkante höher') add('info','ausgleich',`Vorfuß ${n}: Außenkante höher`,'Keil unter der Außenkante prüfen. Eher selten, genau beobachten.');
    if(v('hipFlex',sd)==='deutlich eingeschränkt') add('warn','fitting',`Hüfte ${n} deutlich eingeschränkt`,'Hüftwinkel oben nicht zu klein werden lassen: weniger Überhöhung oder kürzere Kurbel prüfen.');
    const a=Number(v('ankle',sd)); if(a&&a<8) add('info','fitting',`Sprunggelenk ${n}: ${a} cm`,'Wenig Beweglichkeit. Cleat eher weiter hinten, Sattel nicht zu hoch.');
  });
  const hm=v('hamstring'); if(hm!==undefined&&hm!==''){ const h=Number(hm); if(h>20) add('warn','fitting',`Rückseite Oberschenkel: ${h} cm`,'Deutlich eingeschränkt. Wenig Überhöhung, Sattel nicht zu hoch. Dehnübungen empfehlen.'); else if(h>10) add('info','fitting',`Rückseite Oberschenkel: ${h} cm`,'Leicht eingeschränkt. Überhöhung moderat halten.'); }

function readiness(f,s){
  const filled=Object.keys(s.check||{}).length;
  if(!filled) return ['c-info','Noch nicht geprüft','Mach zuerst den Körpercheck.'];
  if(f.some(x=>x.cat==='arzt')) return ['c-bad','Erst abklären','Mindestens ein Punkt sollte von Fachleuten angeschaut werden.'];
  const open=f.filter(x=>x.cat==='ausgleich'&&!(s.comp||[]).some(c=>c.t.startsWith(x.title))).length;
  if(open) return ['c-warn','Ausgleich vorbereiten',`${open} Ausgleich${open>1?'e':''} vor dem Fitting einplanen.`];
  return ['c-ok','Bereit fürs Fitting','Keine Punkte, die vorher ausgeglichen werden müssen.'];
}
function fitSuggestions(s,noTargets){

  const kp=(s.after.kneeOverPedal||s.before.kneeOverPedal); if(kp&&Math.abs(kp.value)>15){ const sb=val(s.after.saddleSetback)??val(s.before.saddleSetback); const d=Math.round(Number(kp.value));

  checkFindings(s).filter(f=>f.cat==='fitting'&&f.lvl!=='ok').forEach(f=>add(null,f.title,'Aus dem Körpercheck.',f.text));

  if(h==null||sb==null||r==null||d==null) return null;
  const xs=sb+70; const Hs=Math.sqrt(Math.max(h*h-xs*xs,0));
  const bx=-sb+Math.sqrt(Math.max(r*r-d*d,0)), by=Hs-d;
  return {bx,by,h,sb,r,d};
}
function sizeAdvice(s,g){
  const P=fitPosition(s); if(!P) return null; const mtb=g.type==='MTB';

  });

}

function quality(s){
  const out=[]; { const n=Object.values(s.after).filter(a=>/Eingestellt nach Plan|Berechnet/.test(a.method)).length; if(n) out.push(['info',`${n} Wert${n>1?'e':''} nach Plan eingestellt oder berechnet – zum Abschluss am Rad nachmessen`,'Ergebnis']); }

    REQUIRED.forEach(k=>{ if(!s.before[k]) out.push(['warn',`Ausgangswert fehlt: ${MK[k].label}`,'Ausgangsposition']); });
    if(s.status==='abgeschlossen') REQUIRED.forEach(k=>{ if(!s.after[k]) out.push(['warn',`Endwert fehlt: ${MK[k].label}`,'Anpassungen']); });
  }
  ['before','after'].forEach(side=>Object.values(s[side]).forEach(m=>{
    if(m.source==='geschätzt') out.push(['info',`${MK[m.key].label} (${side==='before'?'vorher':'nachher'}) ist geschätzt, keine reproduzierbare Messung`,m.method]);
    if(m.source==='gemessen' && (m.unc===null||m.unc===undefined) && !/Herstellerangabe/.test(m.method)) out.push(['info',`Messunsicherheit fehlt: ${MK[m.key].label}`,m.method]);
    if(/unkalibriert/.test(m.method)) out.push(['warn',`${MK[m.key].label}: Video nicht kalibriert, Winkel nur als Orientierung`,m.method]);
  }));
  Object.keys(s.after).forEach(k=>{ const b=s.before[k], a=s.after[k]; if(b && a && b.method!==a.method && !/Eingestellt nach Plan|Berechnet/.test(a.method)) out.push(['warn',`${MK[k].label}: Vorher und nachher mit unterschiedlicher Methode gemessen`,`${b.method} → ${a.method}`]); });
  if(s.status!=='geplant'&&!Object.keys(s.check||{}).length) out.push(['warn','Körpercheck nicht durchgeführt','Schritt Körpercheck']);
  checkFindings(s).filter(x=>x.cat==='arzt').forEach(x=>out.push(['bad',`${x.title}: Fachperson hinzuziehen`,'Körpercheck']));
  BODY.forEach(([k,l])=>{ const rg=rangeFor(BODY_RANGE[k],c); const v=c.body[k]; if(rg&&rg.lo!=null&&v!=null&&v!==''&&(v<rg.lo||v>rg.hi)) out.push(['warn',`${l} ${fmtNum(v)} liegt außerhalb von ${fmtNum(rg.lo)}–${fmtNum(rg.hi)} ${rg.unit}: nachmessen`,'Körpermaße']); });
  ['before','after'].forEach(side=>Object.values(s[side]).forEach(m=>{ const rg=measureRange(m.key,c,bike(s.bikeId)); if(rg&&rg.lo!=null&&(m.value<rg.lo||m.value>rg.hi)) out.push(['warn',`${MK[m.key].label} ${fmtNum(m.value)} ${MK[m.key].unit} liegt außerhalb von ${fmtNum(rg.lo)}–${fmtNum(rg.hi)}: nachmessen`,side==='before'?'Ausgangsposition':'Anpassungen']); }));
  Object.entries(s.check||{}).forEach(([k,v])=>{ const base=k.replace(/[LR]$/,''); const rg=rangeFor(CHECK_RANGE[CHECK_RANGE[k]?k:base],c); if(rg&&rg.lo!=null&&typeof v==='number'&&(v<rg.lo||v>rg.hi)) out.push(['warn',`Körpercheck: ${fmtNum(v)} ${rg.unit} liegt außerhalb von ${fmtNum(rg.lo)}–${fmtNum(rg.hi)}: nachmessen`,'Körpercheck']); });
  const body=c.body; const missing=BODY.filter(([k])=>body[k]===null||body[k]===undefined||body[k]==='').map(b=>b[1]);
  if(missing.length) out.push(['info',`Körpermaße unvollständig: ${missing.join(', ')}`,'Kundenprofil']);
  if((c.est||[]).length) out.push(['info',`Körpermaße geschätzt, nicht gemessen: ${c.est.map(k=>BODY.find(b=>b[0]===k)[1]).join(', ')}`,'Kundenprofil']);
  return out;
}
function qScore(s){
  if(s.status==='geplant') return null;
  const q=quality(s); const pen=q.reduce((a,[l])=>a+(l==='bad'?20:l==='warn'?8:2),0);
  return Math.max(0,100-pen);
}

/* ---------- Vorschau: Was sich durch Ziel und Bedürfnisse ungefähr an der Position ändert ---------- */
function goalPreview(s,typeOverride){
  const a=s.anamnesis||{}, b=bike(s.bikeId)||{}, t=typeOverride||b.type||'';
  const goal=(a.goal||'').toLowerCase(), comp=(a.complaints||'').toLowerCase(), cf=a.comfort||'', lim=(a.limits||'').toLowerCase(), tr=a.training||'';
  if(!goal&&!cf&&!comp) return null;
  let sc=0; const why=[];
  if(/aero|triathlon/.test(goal)){ sc+=2; why.push('Ziel Aerodynamik'); }
  if(/rennen/.test(goal)){ sc+=1; why.push('Rennen fahren'); }
  if(/leistung/.test(goal)){ sc+=1; why.push('mehr Leistung'); }
  if(/längere touren/.test(goal)){ sc-=1; why.push('längere Touren'); }
  if(/beschwerden/.test(goal)){ sc-=1; why.push('Beschwerden loswerden'); }
  if(/komfort/i.test(cf)){ sc-=2; why.push('Komfort zuerst'); } else if(/aero|leistung/i.test(cf)){ sc+=2; why.push('Leistung/Aero zuerst'); }
  const upper=/nacken|schulter|hände|handgelenk|rücken/.test(comp), back=/rücken/.test(comp)||/rücken/.test(lim), stiffL=/beweglichkeit/.test(lim);
  if(upper) sc-=1; if(stiffL) sc-=1; if(/unter 2 h/.test(tr)) sc-=1;
  const style=sc>=2?'aero':sc<=-2?'komfort':'mitte';
  const P=fitProfile(s); const e={...s.before,...s.after}; const v=k=>e[k]?Number(e[k].value):null;
  const rows=[]; const add=(k,label,dir,amount,txt)=>rows.push({k,label,dir,amount,txt});
  const dropNow=v('drop');
  if(style==='aero'){
    add('drop','Lenker','tiefer','etwa 10–30 mm',`Flacherer Oberkörper, weniger Luftwiderstand.${upper?' Achtung: Nacken/Rücken/Hände – in kleinen Schritten.':''}`);
    add('reach','Sattel–Lenker','etwas länger','0–20 mm','Gestreckter, damit der Rücken flach wird ohne die Hüfte zuzumachen.');
    if(t==='Triathlon'||/triathlon/.test(goal)) add('saddleSetback','Sattel','weiter vorn','10–30 mm, dann 5–10 mm höher','Öffnet die Hüfte in der Aeroposition. Sattelhöhe danach über den Kniewinkel nachstellen.');
  } else if(style==='komfort'){
    add('drop','Lenker','höher','etwa 10–30 mm','Aufrechter Oberkörper entlastet Nacken, Rücken und Hände.');
    add('reach','Sattel–Lenker','kürzer','etwa 10–20 mm','Weniger Gewicht auf den Händen, Arme leicht gebeugt.');
  } else {
    add('drop','Lenker',upper?'etwas höher':'bleibt etwa',upper?'etwa 5–15 mm':'±10 mm',upper?'Wegen der Beschwerden im Oberkörper etwas aufrechter.':'Ausgewogen: Lenkerhöhe nur anpassen, wenn Winkel oder Beschwerden es verlangen.');
    add('reach','Sattel–Lenker',/nacken|schulter|hände/.test(comp)?'etwas kürzer':'bleibt etwa',/nacken|schulter|hände/.test(comp)?'etwa 5–10 mm':'±10 mm','Arme sollen leicht gebeugt sein.');
  }
  add('saddleHeight','Sattelhöhe','hängt nicht vom Ziel ab','über Kniewinkel','Wird über den gemessenen Kniewinkel eingestellt (Ziel '+P.knee[0]+'–'+P.knee[1]+'°), nicht über den Fahrstil.');
  const angles=`Oberkörper ${P.torso[0]}–${P.torso[1]}° · Hüfte oben ${P.hip[0]}–${P.hip[1]}° · Schulter ${P.shoulder[0]}–${P.shoulder[1]}°`;
  const warn=[];
  if(style==='aero'&&upper) warn.push('Aero-Wunsch und Beschwerden im Oberkörper: erst beschwerdefrei, dann schrittweise tiefer.');
  if(style==='aero'&&(stiffL||back)) warn.push('Eingeschränkte Beweglichkeit oder Rücken: eine tiefe Position wird meist nicht lange gehalten. Lieber moderat.');
  if(style==='aero'&&/unter 2 h/.test(tr)) warn.push('Wenig Training pro Woche: eine sehr gestreckte Position ermüdet schnell.');
  return {style,label:{aero:'Sportlich / Aero',komfort:'Komfortabel / aufrecht',mitte:'Ausgewogen'}[style],why,rows,angles,warn,profile:P.label,dropNow};
}

function bodyTarget(c,type,a,check,crank,frame,styleOverride){

const CK_KEYW={pain:'Schmerzen',legLen:'Beinlänge',pelvis:'Becken',shoulder:'Schultern',kneeTrack:'Knie ',arch:'Fußgewölbe',forefoot:'Vorfuß',hamstring:'Rückseite',hipFlex:'Hüfte',ankle:'Sprunggelenk',sitBone:'Sitzknochen'};
const CK_KB={
  pain:{mean:'Mit akuten Schmerzen lässt sich die richtige Position nicht sicher finden. Der Körper weicht dem Schmerz aus.',todo:['Fitting verschieben oder nur grob einstellen.','Erst ärztlich oder physiotherapeutisch abklären lassen.']},
  legLen:{mean:'Ein kürzeres Bein lässt das Becken auf dem Sattel zur kurzen Seite kippen. Folge: einseitige Belastung von Knie, Hüfte und unterem Rücken, oft Sitzbeschwerden auf einer Seite.',
    todo:['Erst nachmessen: im Liegen vom vorderen Hüftknochen zum Innenknöchel, 2–3 Mal, Mittelwert nehmen.','5–9 mm Unterschied: Unterlegplatte (Shim) unter den Cleat der kürzeren Seite, etwa die Hälfte des Unterschieds (z. B. 3 mm bei 6 mm). Dann fahren und fragen.','Ab 10 mm: erst Fachperson (Orthopädie, Physiotherapie). Ein Teil ist oft „funktional“ (verkipptes Becken) und lässt sich behandeln statt ausgleichen.','Nie den vollen Unterschied auf einmal ausgleichen.']},
  pelvis:{mean:'Ein schiefes Becken im Stehen passt oft zu einem Beinlängenunterschied oder einseitig verspannten Muskeln. Auf dem Rad rutscht man dann zu einer Seite.',todo:['Zusammen mit der Beinlänge betrachten.','Beim Fahren von hinten schauen: Sitzt die Person mittig auf dem Sattel?','Bei deutlicher Schiefstellung: Fachperson.']},
  shoulder:{mean:'Hängt eine Schulter, greift man den Lenker oft ungleich. Folge: Nacken und Hand auf einer Seite belastet.',todo:['Beim Fahren auf gleichmäßigen Griff achten.','Schalthebel beidseitig gleich hoch montieren (Lineal über beide Griffe).']},
  kneeTrack:{mean:'Fällt das Knie bei der Kniebeuge nach innen, macht es das auch beim Treten. Das belastet Knie innen und Kniescheibe. Ursache ist meist der Fuß (flaches Gewölbe, schräger Vorfuß), manchmal schwache Hüftmuskeln.',todo:['Zuerst den Fuß versorgen: Einlage mit Gewölbestütze, ggf. Keil (siehe Fußgewölbe und Vorfuß).','Danach die Kniebeuge wiederholen: Läuft das Knie jetzt gerader?','Beim Fahren von vorn schauen: Knie sollte gerade über dem Fuß auf und ab laufen.','Bleibt es: Cleat etwas nach außen setzen (Fuß näher zur Kurbel) oder Pedalachsen-Verlängerung prüfen.']},
  arch:{mean:'Ein hohes Gewölbe dämpft wenig: Druck konzentriert sich auf Ferse und Vorfuß, Zehen werden schnell taub oder brennen. Ein flaches Gewölbe knickt ein, das Knie fällt nach innen.',todo:['Radschuh-Einlage mit passender Gewölbestütze: hoch → mittlere bis hohe, gepolsterte Stütze; flach → stützende Einlage.','Schuhbreite prüfen: zu enge Schuhe verstärken Taubheit.','Cleat eher etwas weiter nach hinten (entlastet Vorfuß und Zehen).','Passt zu Beschwerden an Füßen und Zehen.']},
  forefoot:{mean:'Steht der Vorfuß schräg, kippt der Fuß auf dem flachen Pedal. Das Knie weicht seitlich aus. Außenkante höher = Fuß kippt nach außen.',todo:['Keil (Wedge) zwischen Cleat und Schuh: Die dicke Seite kommt unter die höher stehende Kante, damit der Spalt zum Pedal gefüllt wird – bei „Außenkante höher“ also außen, bei „Innenkante höher“ innen.','Mit 1 Keil beginnen, Kniespur beim Fahren von vorn prüfen, ggf. 2.','Nur die betroffene Seite versorgen.']},
  hamstring:{mean:'Eine steife Oberschenkelrückseite zieht das Becken nach hinten. Der Rücken muss sich dann stärker krümmen, um den Lenker zu erreichen. Folge: Rücken- und Nackenbeschwerden.',todo:['Wenig Überhöhung wählen (Lenker eher höher).','Sattel nicht zu hoch.','Dehnübungen empfehlen, nach einigen Wochen neu messen.']},
  hipFlex:{mean:'Kann das Knie nicht weit zur Brust, wird der Hüftwinkel oben am Pedal zu eng. Das Becken weicht aus.',todo:['Überhöhung verringern.','Kürzere Kurbel prüfen (öffnet den Hüftwinkel oben).']},
  ankle:{mean:'Ein steifes Sprunggelenk kann den Fuß unten am Pedal wenig strecken. Dann muss der Sattel etwas tiefer sein.',todo:['Cleat eher weiter hinten.','Sattel eher am unteren Ende des Bereichs.']},
  sitBone:{mean:'Die Sattelbreite muss zu den Sitzknochen passen. Zu schmal: Druck auf Weichteile und Damm. Zu breit: Scheuern an den Oberschenkeln.',todo:['Sattelbreite = Sitzknochenabstand + 20–30 mm (sportlich) bzw. + 30–40 mm (aufrecht).','Breite des aktuellen Sattels messen und vergleichen.','Bei Sitzbeschwerden: Testsattel in passender Breite.']}
};
function ckItemFindings(s,it){ const w=CK_KEYW[it.k]; if(!w) return []; return checkFindings(s).filter(x=>x.lvl!=='ok'&&x.title.startsWith(w.trim())||x.lvl!=='ok'&&w==='Knie '&&/^Knie (links|rechts)/.test(x.title)); }
function ckRow(s,c,it,i){
  const d=ckDone(s,c,it); const fs=d?ckItemFindings(s,it):[]; const warn=fs.some(x=>x.lvl==='warn'||x.lvl==='bad'); const info=!warn&&fs.length;
  const state=!d?'open':warn?'warn':info?'info':'done'; const open=ui.ckOpen===it.k;
  const kb=CK_KB[it.k];
  let extra='';
  if(it.k==='sitBone'){ const p=partsAdvice(s); if(p.saddle) extra=`<p class="ckx-hl">Für diese Person: Sattelbreite etwa <b>${p.saddle.lo}–${p.saddle.hi} mm</b>.</p>`; }
  const row=`<div class="li click ckrow ${open?'open':''}" data-act="${fs.length?'ckToggle':'wGo'}" data-k="${it.k}" data-i="${i}"><span class="st-ico ${state}">${state==='done'?ic('check','width="14" height="14"'):state==='warn'?'!':state==='info'?'i':i+1}</span><div class="grow"><div class="t">${esc(it.label)}</div>${fs.length&&!open?`<div class="sub" style="white-space:normal;color:${warn?'var(--warn)':'var(--muted)'}">${esc(fs[0].title)} – antippen für Erklärung</div>`:''}</div><span class="val">${esc(ckSummary(s,c,it)||'offen')}</span>${ic('arrow','width="16" height="16" style="color:var(--faint);flex:none'+(fs.length?(open?';transform:rotate(-90deg)':';transform:rotate(90deg)'):'')+'"')}</div>`;
  if(!open||!fs.length) return row;
  return row+`<div class="ckx">
    ${fs.map(f=>`<div class="ckx-f ${f.lvl}"><b>${esc(f.title)}</b><span>${esc(f.text)}</span></div>`).join('')}
    ${kb?`<div><h4>Was bedeutet das fürs Rad?</h4><p>${esc(kb.mean)}</p></div><div><h4>Was du tun kannst</h4><ol>${kb.todo.map(t=>`<li>${esc(t)}</li>`).join('')}</ol></div>`:''}${extra}
    <div class="row">${fs.filter(f=>f.cat==='ausgleich'||f.cat==='arzt').map(f=>(s.comp||[]).some(cp=>cp.t.startsWith(f.title))?`<span class="chip c-ok nodot">eingeplant</span>`:`<button class="btn sm primary" data-act="addComp" data-id="${s.id}" data-t="${esc(f.title)}">Ausgleich einplanen</button>`).join('')}<button class="btn sm" data-act="wGo" data-i="${i}">Wert ändern</button></div></div>`;
}

/* ---------- Fuß-Auswertung: Einlage, Keil, Unterlegplatte – pro Fuß mit Begründung ---------- */
function footAdvice(s){
  const v=(k,sd)=>chkVal(s,k,sd); const t=(s.anamnesis.complaints||'').toLowerCase();
  const feetPain=/fuß|füße|zeh|brennen|taub/.test(t), kneeIn=/knie innen/.test(t), kneeOut=/knie außen/.test(t);
  const sides={L:'links',R:'rechts'}; const out={feet:{},shim:null,missing:[]};
  ['L','R'].forEach(sd=>{ const n=sides[sd]; const arch=v('arch',sd), ff=v('forefoot',sd), kt=v('kneeTrack',sd);
    if(!arch) out.missing.push(`Fußgewölbe ${n}`); if(!ff) out.missing.push(`Vorfuß ${n}`); if(!kt) out.missing.push(`Kniespur ${n}`);
    const f={insole:null,wedge:null,why:[],check:[]};
    // Einlage
    if(arch==='flach') { f.insole={need:'ja',type:'Stützende Einlage mit mittlerer bis hoher Gewölbestütze',why:'Flaches Gewölbe: Der Fuß knickt beim Treten nach innen ein und zieht das Knie mit.'}; }
    else if(arch==='hoch') { f.insole={need:'ja',type:'Einlage mit hoher Gewölbestütze und Polsterung, ggf. Mittelfuß-Pelotte',why:'Hohes Gewölbe: Der Fuß liegt nur an Ferse und Ballen auf. Druckspitzen machen Zehen taub oder brennen.'}; }
    else if(arch==='normal'&&feetPain) { f.insole={need:'prüfen',type:'Einlage mit mittlerer Stütze und Mittelfuß-Pelotte',why:'Gewölbe normal, aber Beschwerden an Füßen oder Zehen: Eine Pelotte hinter den Ballen verteilt den Druck.'}; }
    else if(arch) f.insole={need:'nein',type:'',why:'Gewölbe normal, keine Fußbeschwerden.'};
    // Keil
    const inward=kt==='fällt nach innen', outward=kt==='fällt nach außen';
    if(ff==='Innenkante höher'){ const n0=inward||kneeIn?2:1; f.wedge={need:'ja',count:n0,side:'innen',why:`Vorfuß steht schräg (Innenkante höher). Der Fuß kippt auf dem flachen Pedal nach innen${inward?', das Knie fällt in der Kniebeuge nach innen':''}.`}; }
    else if(ff==='Außenkante höher'){ const n0=outward||kneeOut?2:1; f.wedge={need:'ja',count:n0,side:'außen',why:`Vorfuß steht schräg (Außenkante höher). Der Fuß kippt auf dem Pedal nach außen${outward?', das Knie fällt nach außen':''}.`}; }
    else if(ff==='neutral'&&inward) f.wedge={need:'erst Einlage',count:0,side:'innen',why:'Vorfuß gerade, aber Knie fällt nach innen: Ursache ist eher das Gewölbe. Erst Einlage, dann Kniebeuge wiederholen. Nur wenn es bleibt: 1 Keil innen testen.'};
    else if(ff==='neutral'&&outward) f.wedge={need:'erst prüfen',count:0,side:'außen',why:'Vorfuß gerade, Knie fällt nach außen: zuerst seitliche Cleat-Position prüfen, dann 1 Keil außen testen.'};
    else if(ff) f.wedge={need:'nein',count:0,side:'',why:'Vorfuß gerade, Kniespur gerade.'};
    if(f.wedge&&f.wedge.need==='ja'&&((f.wedge.side==='außen'&&inward)||(f.wedge.side==='innen'&&outward))){ f.wedge={need:'erst prüfen',count:1,side:f.wedge.side,why:`Widerspruch: Der Vorfuß spricht für einen Keil ${f.wedge.side}, die Kniespur (${inward?'nach innen':'nach außen'}) eher für das Gegenteil. Erst die Einlage, dann die Vorfußstellung in Bauchlage noch einmal prüfen. Danach 1 Keil ${f.wedge.side} testweise einbauen und die Kniespur beim Fahren mit und ohne Keil vergleichen.`}; }
    f.check=['Nach dem Einbau die einbeinige Kniebeuge wiederholen: Läuft das Knie jetzt gerade über den 2. Zeh?','Beim Fahren von vorn filmen: Knie soll gerade auf und ab laufen, nicht pendeln.','Nach 20–30 Minuten fragen: Druckstellen, Taubheit, Brennen?'];
    out.feet[sd]=f; });
  const L=Number(v('legLen','L')), R=Number(v('legLen','R'));
  if(L&&R){ const d=Math.round(Math.abs(L-R)*10); const short=L<R?'links':'rechts';
    if(d>=10) out.shim={need:'Fachperson',side:short,mm:null,why:`${d} mm Unterschied, ${short} kürzer. Erst abklären lassen (anatomisch oder durch das Becken?). Danach ggf. Unterlegplatte unter den Cleat ${short}, höchstens die Hälfte (${Math.round(d/2)} mm), in Schritten.`};
    else if(d>=5) out.shim={need:'ja',side:short,mm:Math.round(d/2),why:`${d} mm Unterschied, ${short} kürzer. Unterlegplatte (Shim) unter den Cleat ${short}: etwa ${Math.round(d/2)} mm.`};
    else out.shim={need:'nein',why:`${d} mm Unterschied – kein Ausgleich nötig.`}; }
  return out;
}
function footHtml(s){
  const a=footAdvice(s); const tag=x=>x==='ja'?'c-warn':x==='nein'?'c-ok':'c-info';
  const foot=(sd,lab)=>{ const f=a.feet[sd]; return `<div class="footcol"><h4>${lab}</h4>
    <div class="fitem"><div class="row" style="gap:6px"><b>Einlage</b>${f.insole?`<span class="chip nodot ${tag(f.insole.need)}">${esc(f.insole.need)}</span>`:'<span class="chip nodot">noch nicht geprüft</span>'}</div>${f.insole&&f.insole.type?`<div>${esc(f.insole.type)}</div>`:''}${f.insole?`<div class="sub">${esc(f.insole.why)}</div>`:''}</div>
    <div class="fitem"><div class="row" style="gap:6px"><b>Keil</b>${f.wedge?`<span class="chip nodot ${tag(f.wedge.need)}">${esc(f.wedge.need)}</span>`:'<span class="chip nodot">noch nicht geprüft</span>'}</div>${f.wedge&&f.wedge.count?`<div>${f.wedge.count} Keil${f.wedge.count>1?'e':''}, <b>dicke Seite ${f.wedge.side}</b></div>`:''}${f.wedge?`<div class="sub">${esc(f.wedge.why)}</div>`:''}</div></div>`; };
  return `<div class="footcard"><div class="row" style="justify-content:space-between"><h3>Füße: Einlage, Keil, Unterlegplatte</h3></div>
  <div class="footgrid">${foot('L','Linker Fuß')}${foot('R','Rechter Fuß')}</div>
  ${a.shim?`<div class="fitem"><div class="row" style="gap:6px"><b>Unterlegplatte (Beinlänge)</b><span class="chip nodot ${a.shim.need==='Fachperson'?'c-bad':tag(a.shim.need)}">${esc(a.shim.need)}</span></div><div class="sub">${esc(a.shim.why)}</div></div>`:''}
  ${a.missing.length?`<p class="faint" style="font-size:12.5px">Für eine vollständige Aussage fehlt im Körpercheck: ${esc(a.missing.join(', '))}.</p>`:''}
  <details class="more"><summary>Reihenfolge und Kontrolle</summary><ol style="margin:6px 0 0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:4px"><li>Erst die Einlage, denn sie ändert oft schon die Kniespur.</li><li>Dann Kniebeuge wiederholen. Erst wenn das Knie noch abweicht: Keil.</li><li>Keile zwischen Cleat und Schuh oder als Keil-Einlage. Ein Keil hat meist 1–1,5°. Mit 1 beginnen, höchstens 3 pro Fuß.</li><li>Unterlegplatte erst zum Schluss, sie hebt den ganzen Fuß an. Danach Sattelhöhe prüfen.</li>${a.feet.L.check.map(c=>`<li>${esc(c)}</li>`).join('')}</ol></details>
  <p class="faint" style="font-size:12.5px">Faustregeln aus der Fitting-Praxis, keine Diagnose. Bei Schmerzen oder starken Fehlstellungen: Orthopädie oder Podologie.</p></div>`;
}

SESSTAB.koerper = (s,c) => {
  const items=CK_ITEMS();
  if(ui.wIdx!=null&&items[ui.wIdx]) return ckWizard(s,c,items,ui.wIdx);
  const f=checkFindings(s).filter(x=>x.lvl!=='ok'), r=readiness(checkFindings(s),s);
  const done=items.filter(it=>ckDone(s,c,it)).length, first=items.findIndex(it=>!ckDone(s,c,it));
  const cls=r[0]==='c-ok'?'ok':r[0]==='c-bad'?'bad':r[0]==='c-warn'?'warn':'';
  return `<div class="stack">
  <p class="onlyline">Prüfe den Körper, bevor du das Rad einstellst. Ein Test pro Bildschirm, je 1–2 Minuten. Nicht jeder Test ist immer nötig.</p>
  <div class="camcard"><span class="ico">${ic('camera')}</span><div style="flex:1;min-width:0"><b>Körper-Scan mit Kamera</b><span class="muted" style="font-size:13.5px">${s.scan?`Gescannt am ${fmtDate(s.scan.date)}`:'Optional · Foto von vorn und von der Seite'}</span></div><button class="btn sm ${s.scan?'':'primary'}" data-act="scanOpen">${s.scan?'Ansehen':'Starten'}</button></div>
  <div class="statusbox ${cls}"><div style="flex:1;min-width:0"><b>${r[1]}</b><span class="muted" style="font-size:14px">${r[2]}</span></div><span class="num" style="font-weight:700">${done}/${items.length}</span></div>
  ${f.length?`<p class="muted" style="font-size:14px">Punkte mit <b>!</b> oder <b>i</b> antippen: Dann siehst du, was los ist, was es fürs Rad bedeutet und was du tun kannst.</p>`:''}
  ${(s.comp||[]).length?`<details class="more"><summary>Ausgleich vor dem Fitting (${s.comp.filter(x=>x.status==='umgesetzt').length}/${s.comp.length} erledigt)</summary>${s.comp.map((cp,i)=>`<label class="li" style="padding:8px 0;cursor:pointer"><input type="checkbox" data-change="compDone" data-id="${s.id}" data-i="${i}" ${cp.status==='umgesetzt'?'checked':''}><span class="grow">${esc(cp.t)}</span></label>`).join('')}</details>`:''}
  ${startBtn(first,done,first>=0?items[first].label:'')}
  <div class="ovl">${items.map((it,i)=>ckRow(s,c,it,i)).join('')}</div>
  ${done>2?footHtml(s):''}
  <details class="more"><summary>Warum zuerst der Körpercheck?</summary><p class="muted" style="margin-top:6px">Das Rad wird an den Körper angepasst. Ist ein Bein kürzer oder steht ein Fuß schräg, gleichst du das zuerst aus. Sonst stellst du das Rad auf eine schiefe Haltung ein. FitFrame stellt keine Diagnosen. Bei Schmerzen oder großen Unterschieden: Fachleute hinzuziehen.</p></details>
  <button class="btn ghost" data-act="openCustomer" data-id="${c.id}" style="align-self:flex-start">Alle Körpermaße bearbeiten</button>
  </div>`;
};
function ckWizard(s,c,items,i){
  const it=items[i]; let fields='', auto=false;
  if(it.k==='grund'){
    fields=[['height','Körpergröße','cm',1],['inseam','Schrittlänge','cm',1],['torso','Rumpflänge (optional)','cm',0],['arm','Armlänge (optional)','cm',0],['shoulder','Schulterbreite (optional, für die Lenkerbreite)','cm',0]].map(([k,l,u,req])=>{ const id='g_'+k, rg=rangeFor(BODY_RANGE[k],c);
      return `<div class="field"><label for="${id}">${l} in ${u}</label><input class="input num" id="${id}" name="${k}" type="number" step="0.5" inputmode="decimal" value="${c.body[k]??''}" ${req?'required':''} ${rangeAttr(rg,id)}>${rangeHint(rg,id,c.body[k])}</div>`; }).join('');
  } else {
    auto=it.type!=='num'&&!it.side;
    const one=sd=>{ const id=`ck_${it.k}${sd||''}`, val=chkVal(s,it.k,sd)??''; const lab=sd?(sd==='L'?'Links':'Rechts'):'';
      if(it.type==='num'){ const rg=rangeFor(CHECK_RANGE[it.k],c); return `<div class="field wside"><label for="${id}">${lab?`<b>${lab}</b> · `:''}Wert${it.unit?` in ${it.unit}`:''}</label><input class="input num" id="${id}" name="${it.k}${sd||''}" type="number" step="${it.step||0.5}" inputmode="decimal" value="${esc(val)}" ${rangeAttr(rg,id)}>${rangeHint(rg,id,val)}</div>`; }
      return `<div class="wside">${lab?`<span class="label">${lab}</span>`:''}<input type="hidden" id="${id}" name="${it.k}${sd||''}" value="${esc(val)}"><div class="bigchips" data-group="${id}">${it.opts.map(o=>`<button type="button" class="chipbtn" data-act="chip" data-t="${id}" data-m="set" data-v="${esc(o)}" aria-pressed="${val===o}">${esc(o)}</button>`).join('')}</div></div>`; };
    fields=it.side?one('L')+one('R'):one('');
  }
  const how=it.steps?`<details class="more" open><summary>So geht's · ${esc(it.tool)}</summary><ol class="how">${it.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></details>`:`<details class="more" open><summary>So geht's · ${esc(it.tool)}</summary><ol class="how"><li>Körpergröße barfuß an der Wand messen.</li><li>Schrittlänge: barfuß an die Wand, ein Buch waagerecht fest in den Schritt drücken.</li><li>Vom Boden bis zur Buchoberkante messen.</li></ol></details>`;
  return wizFrame(i,items.length,esc(it.label),esc(it.why),`${it.k!=='grund'?IL(it.k):''}<form id="wizForm" class="stack" data-form="checkOne" data-id="${s.id}" data-i="${i}" ${auto?'data-auto="1"':''}>${fields}</form>${how}`);
}
function measureTable(s,side){
  const recs=Object.keys(MK).filter(k=>s[side][k]).map(k=>s[side][k]);
  if(!recs.length) return `<div class="empty">Noch keine Werte. Trag sie unten ein oder lass sie aus den Körpermaßen simulieren.</div>`;
  return `<div class="tw"><table><thead><tr><th>Messpunkt</th><th class="r">Wert</th><th>Methode</th><th>Quelle</th><th class="r">± Unsicherheit</th><th></th></tr></thead><tbody>
  ${recs.map(m=>`<tr><td>${MK[m.key].label}<div class="faint" style="font-size:11px">${esc(MK[m.key].def||'')}</div></td><td class="r num">${fmtNum(m.value)} ${MK[m.key].unit}</td><td>${esc(m.method)}</td><td>${srcChip(m.source)}</td><td class="r num">${m.unc!=null?fmtNum(m.unc)+' '+MK[m.key].unit:'<span class="faint">–</span>'}</td><td class="r"><button class="btn sm ghost danger" data-act="delMeasure" data-id="${s.id}" data-side="${side}" data-key="${m.key}" aria-label="Wert entfernen">${ic('x')}</button></td></tr>`).join('')}
  </tbody></table></div>`;
}
function measureForm(s,side,isChange){
  return `<form class="form" data-form="${isChange?'change':'measure'}" data-id="${s.id}" data-side="${side}">
    <div class="field"><label for="m_key_${side}">Messpunkt</label><select class="input" id="m_key_${side}" name="key">${Object.entries(MK).map(([k,m])=>`<option value="${k}" ${ui.prepKey===k?'selected':''}>${m.group}: ${m.label} (${m.unit})</option>`).join('')}</select></div>
    <div class="field"><label for="m_val_${side}">${isChange?'Neuer Wert':'Wert'}</label><input class="input num" id="m_val_${side}" name="value" type="number" step="0.1" inputmode="decimal" required></div>
    <div class="field"><label for="m_meth_${side}">Methode</label><select class="input" id="m_meth_${side}" name="method">${opts(METHODS,'Maßband')}</select></div>
    <div class="field"><label for="m_src_${side}">Quelle</label><select class="input" id="m_src_${side}" name="source">${opts(SOURCES,'gemessen')}</select></div>

  <details class="more" style="margin-top:4px"><summary style="font-size:13px">So stellen Profis die Schalthebel ein</summary><ol style="margin:6px 0 0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:3px"><li>Erst den Lenker drehen: Unterlenker-Enden waagerecht oder leicht Richtung Hinterradachse.</li><li>Dann die Schalthebel: flacher Übergang von Lenkeroberseite zum Hebel, Handgelenk gerade.</li><li>Zu tief: Druck auf Ringfinger und kleinen Finger. Zu hoch: Ellbogen stark gebeugt, Daumen und Zeigefinger werden taub.</li><li>Bremshebel mit dem ersten Fingerglied erreichbar.</li></ol></details></div></div>`; }

/* Teileplan aus den Schritten: was ohne neue Teile geht, was mit neuen Teilen */

    const noParts=x.acts.filter(a=>!a.part).map(a=>a.t).concat(x.alt.filter(a=>!a.part).map(a=>a.t));

function measureChecks(s){ return measureChecks0(s).concat(coordChecks(s)); }
function measureChecks0(s){

  const add=(lvl,title,text,go)=>out.push({lvl,title,text,go});
  const H=Number(c.body.height)||null, I=Number(c.body.inseam)||null;
  if(H&&I){ const q=I/H; if(q<0.40||q>0.52) add('warn','Schrittlänge passt nicht zur Körpergröße',`Schrittlänge ${fmtNum(I)} cm ist ${Math.round(q*100)} % der Körpergröße. Üblich sind 43–49 %. Nachmessen: Buch fest in den Schritt drücken, Boden bis Buchkante.`,'koerper'); }
  if(!c.body.torso||(c.est||[]).includes('torso')||!c.body.arm||(c.est||[]).includes('arm')) add('info','Rumpf- oder Armlänge fehlt','Ohne diese Maße schätzt FitFrame die Länge Sattel–Lenker nur aus der Körpergröße. Eintragen unter Körper → Grundmaße.','koerper');
  const sb=(s.check&&s.check.sitBone)||c.body.sitBone; if(sb){ const x=Number(sb); if(x<30) add('bad','Sitzknochenabstand: Tippfehler?',`${fmtNum(x)} mm ist zu klein. Vermutlich in cm eingegeben: ${fmtNum(x*10)} mm?`,'koerper'); else if(x<80||x>180) add('warn','Sitzknochenabstand ungewöhnlich',`${fmtNum(x)} mm. Üblich sind 90–160 mm.`,'koerper'); }
  const h=v('saddleHeight'); if(h&&I){ const q=h/(I*10); if(q<0.83||q>0.93) add('warn','Sattelhöhe passt nicht zur Schrittlänge',`${fmtNum(h)} mm sind ${Math.round(q*1000)/10} % der Schrittlänge. Üblich sind 85–90 %. Entweder Messfehler (Tretlagermitte bis Satteloberfläche entlang dem Sitzrohr) oder Sattel deutlich zu ${q<0.85?'tief':'hoch'}.`,'ausgang'); }

  const cf=v('cleatFore'); if(cf!=null&&(cf<-3||cf>12)) add('warn','Cleat-Position ungewöhnlich',`${fmtNum(cf)} mm ${cf>0?'hinter':'vor'} dem Großzehengrundgelenk. Üblich sind 0–10 mm dahinter. Messung prüfen.`,'ausgang');
  const d=v('drop'), ham=Number((s.check&&s.check.hamstring)||0); if(d!=null&&ham>=20&&d>60) add('warn','Hohe Überhöhung trotz eingeschränkter Beweglichkeit',`Finger-Boden-Abstand ${fmtNum(ham)} cm, Überhöhung ${fmtNum(d)} mm. Das passt oft nicht zusammen: Rücken und Nacken werden belastet.`,'anpassung');
  if(s.check&&s.check.legLenL&&s.check.legLenR&&I){ const avg=(Number(s.check.legLenL)+Number(s.check.legLenR))/2; if(avg<I*0.95||avg>I*1.2) add('info','Beinlänge und Schrittlänge weichen ab',`Beinlänge im Körpercheck ${fmtNum(avg)} cm, Schrittlänge ${fmtNum(I)} cm. Beinlänge wird meist vom Hüftknochen gemessen und ist etwas länger – bei großer Abweichung beide Messungen prüfen.`,'koerper'); }
  const stem=v('stemLength'); if(stem&&(stem<50&&!['MTB','E-Bike'].includes(b.type))) add('info','Sehr kurzer Vorbau','Unter 50 mm lenkt ein Rennrad oder Gravelbike sehr nervös. Rahmen eventuell zu groß.','ergebnis');
  const crank=v('crankLength'); if(crank&&I){ const t=I<78?165:I<84?170:I<90?172.5:175; if(Math.abs(crank-t)>=5) add('info','Kurbellänge',`${fmtNum(crank)} mm. Nach Schrittlänge wären etwa ${fmtNum(t)} mm üblich. Nur bei Beschwerden (Knie, Hüfte) ändern.`,'ergebnis'); }

}
function checksHtml(s,compact){

}

function trendChart(series){
  const keys=['saddleHeight','reach','drop','saddleSetback'];
  const pts=[]; series.forEach(s=>{pts.push({d:s.date,label:'vorher',s,rec:s.before});if(Object.keys(s.after).length)pts.push({d:s.date,label:'nachher',s,rec:s.after});});
  return `<div class="grid g2">${keys.map(k=>{
    const vals=pts.map(p=>p.rec[k]?p.rec[k].value:null).filter(v=>v!=null); if(!vals.length) return '';
    const min=Math.min(...vals),max=Math.max(...vals),span=Math.max(max-min,4),lo=min-span*.25,hi=max+span*.25;
    const W=300,H=130,L=40,R=10,T=14,Bm=28; const x=i=>L+(pts.length===1?0:i*(W-L-R)/(pts.length-1)); const y=v=>T+(hi-v)/(hi-lo)*(H-T-Bm);
    let path='',dots=''; pts.forEach((p,i)=>{const v=p.rec[k]?p.rec[k].value:null; if(v==null) return; path+=(path?'L':'M')+x(i)+','+y(v); dots+=`<circle cx="${x(i)}" cy="${y(v)}" r="${i===pts.length-1?4.5:3}" fill="${i===pts.length-1?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="1.6"/>`;});
    const last=vals[vals.length-1];
    return `<div><div class="row" style="justify-content:space-between"><span class="label">${MK[k].label}</span><span class="num">${fmtNum(last)} ${MK[k].unit}</span></div><div class="svgwrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${MK[k].label} über die Sitzungen">
      ${[lo+ (hi-lo)*.2, (lo+hi)/2, hi-(hi-lo)*.2].map(g=>`<line x1="${L}" x2="${W-R}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="${L-6}" y="${y(g)+3}" text-anchor="end" fill="var(--faint)" font-size="9" font-family="IBM Plex Mono, monospace">${fmtNum(g,0)}</text>`).join('')}
      <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="1.8"/>${dots}
      ${pts.map((p,i)=>`<text x="${x(i)}" y="${H-12}" text-anchor="middle" fill="var(--faint)" font-size="8.5" font-family="IBM Plex Mono, monospace">${fmtDate(p.d).slice(0,5)}</text><text x="${x(i)}" y="${H-2}" text-anchor="middle" fill="var(--faint)" font-size="8">${p.label}</text>`).join('')}
    </svg></div></div>`;}).join('')}</div><p class="faint" style="font-size:12px;margin-top:8px">Jede Sitzung erscheint mit Ausgangs- und Endwert. Frühere Werte bleiben erhalten.</p>`;
}

function bodyVal(c,k){
  const v=c.body[k];

  const H=Number(c.body.height);

}

}

function simInputs(s,side){

const clamp1=x=>Math.max(-1,Math.min(1,x));

function kin(P,a){
  const h=P.h.v, sb=P.sb.v, crank=P.crank.v, reach=P.reach.v, drop=P.drop.v;

  const sy=Math.sqrt(Math.max(h*h-sb*sb,1));
  const hip=[-sb-90,sy+30], hand=[-sb+reach,sy-drop];
  const pedal=[Math.cos(a)*crank,Math.sin(a)*crank];

  const dx=ankle[0]-hip[0], dy=ankle[1]-hip[1], d=Math.hypot(dx,dy), over=d>thigh+shank;
  const dd=Math.min(d,thigh+shank-0.5); const base=Math.atan2(dy,dx);

  const ah=Math.acos(clamp1((thigh*thigh+dd*dd-shank*shank)/(2*thigh*dd)));
  const knee=[hip[0]+thigh*Math.cos(base+ah),hip[1]+thigh*Math.sin(base+ah)];
  const kneeAng=deg(Math.acos(clamp1((thigh*thigh+shank*shank-dd*dd)/(2*thigh*shank))));

function cycle(P){

}
function simCaptureInto(s,side,withFit){

  return {n,r};
}

let motion={raf:0,playing:false,t:0,last:0};
function motionStep(ts){
  const cv=document.getElementById('motionCanvas'); if(!cv){cancelAnimationFrame(motion.raf);motion.playing=false;return;}
  const sp=Number((document.getElementById('motionSpeed')||{}).value||1);
  if(motion.playing){ if(motion.last) motion.t+=(ts-motion.last)/1000*sp*1.4; motion.last=ts; }
  drawMotion(cv);
  if(motion.playing) motion.raf=requestAnimationFrame(motionStep);
}
function drawMotion(cv){
  const s=sess(ui.motionSess); if(!s) return; const P=simInputs(s,ui.motionSide);
  const ctx=cv.getContext('2d'), W=cv.width, H=cv.height; ctx.clearRect(0,0,W,H);
  const sc=0.27, ox=270, oy=370; const Pt=(x,y)=>[ox+x*sc,oy-y*sc];
  ctx.strokeStyle='#22252b'; ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  const a=-motion.t*2*Math.PI; const k=kin(P,a);
  const line=(p,q,col,w)=>{const [x1,y1]=Pt(...p),[x2,y2]=Pt(...q);ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();};
  const dot=(p,col,r)=>{const [x,y]=Pt(...p);ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();};
  const sb=P.sb.v, rear=[-410,70], front=[600,70];
  ctx.strokeStyle='#3a3f48'; ctx.lineWidth=3; [rear,front].forEach(w=>{const [x,y]=Pt(...w);ctx.beginPath();ctx.arc(x,y,340*sc,0,Math.PI*2);ctx.stroke();});
  const seatTop=[-sb,k.sy-60], head=[k.hand[0]-60,k.hand[1]-60];
  line([0,0],seatTop,'#3a3f48',5); line([0,0],head,'#3a3f48',5); line(seatTop,head,'#3a3f48',4); line([0,0],rear,'#3a3f48',4); line(seatTop,rear,'#3a3f48',3); line(head,front,'#3a3f48',4);
  line([-sb-130,k.sy],[-sb+10,k.sy],'#6c727d',7); line(head,k.hand,'#6c727d',4);
  line([0,0],k.pedal,'#9ba1ab',4); dot([0,0],'#ecebe8',5);
  line(k.hip,k.shoulder,'#ecebe8',7); line(k.shoulder,k.hand,'#cfcdc8',5);
  line(k.hip,k.knee,'#ff7a1a',8); line(k.knee,k.ankle,'#ff7a1a',7); line(k.ankle,[k.pedal[0]+60,k.pedal[1]],'#ff7a1a',5);
  const tv=[k.shoulder[0]-k.hip[0],k.shoulder[1]-k.hip[1]], tl=Math.hypot(...tv);
  const [hx,hy]=Pt(k.shoulder[0]+tv[0]/tl*90+40,k.shoulder[1]+tv[1]/tl*90); ctx.fillStyle='#ecebe8'; ctx.beginPath(); ctx.arc(hx,hy,14,0,Math.PI*2); ctx.fill();
  [k.hip,k.knee,k.ankle,k.shoulder].forEach(p=>dot(p,'#fff',4));
  const [kx,ky]=Pt(...k.knee); ctx.fillStyle='#ff7a1a'; ctx.font='600 15px IBM Plex Mono, monospace'; ctx.fillText(k.kneeAng.toFixed(0)+'°',kx+12,ky-6);
  ctx.fillStyle='#6c727d'; ctx.font='12px IBM Plex Sans, sans-serif';
  ctx.fillText(`SIMULATION · ${P.c.name} · ${ui.motionSide==='after'?'Nachher':'Vorher'} · Sattelhöhe ${fmtNum(P.h.v)} mm · Schrittlänge ${fmtNum(P.inseam.v)} cm`,14,H-14);
  const crankDeg=((-a*180/Math.PI)%360+360)%360;
  motion.cur={knee:Math.round(k.kneeAng),hip:Math.round(k.hipAng),crank:Math.round(crankDeg)};
  const box=document.getElementById('motionVals');
  if(box) box.innerHTML=`<dt>Kurbelwinkel</dt><dd class="num">${Math.round(crankDeg)}°</dd><dt>Kniewinkel jetzt</dt><dd class="num">${Math.round(k.kneeAng)}°</dd><dt>Hüftwinkel jetzt</dt><dd class="num">${Math.round(k.hipAng)}°</dd>`;
}

/* --- KI-Assistent --- */
function aiSummary(s){ const c=cust(s.customerId),b=bike(s.bikeId); const big=s.changes.slice().sort((x,y)=>Math.abs(y.to-y.from)-Math.abs(x.to-x.from)).slice(0,3);
  return `${c.name} kam am ${fmtDate(s.date)} zum ${s.type} mit dem ${b.brand} ${b.model}. Ziel: ${s.anamnesis.goal||'nicht dokumentiert'}. ${s.anamnesis.complaints?`Angegebene Beschwerden: ${s.anamnesis.complaints}. `:''}${s.changes.length?`Es wurden ${s.changes.length} Einstellungen geändert, die größten: ${big.map(ch=>`${MK[ch.key].label} ${fmtNum(ch.from)} → ${fmtNum(ch.to)} ${MK[ch.key].unit}`).join('; ')}.`:'Es wurden noch keine Änderungen dokumentiert.'} ${s.feedback.length?`Letzte Rückmeldung: „${s.feedback[s.feedback.length-1].text}“ (subjektiv).`:''}`; }
function aiMissing(s){ const q=quality(s); return q.length?q.map(x=>'• '+x[1]).join('\n'):'Keine fehlenden Pflichtangaben gefunden.'; }
function aiCompare(s){ const prev=S.sessions.filter(x=>x.customerId===s.customerId&&x.bikeId===s.bikeId&&x.date<s.date).sort((a,b)=>b.date.localeCompare(a.date))[0];
  if(!prev) return 'Keine frühere Sitzung mit demselben Fahrrad vorhanden.';
  const rows=compareRows({...prev.before,...prev.after},{...s.before,...s.after}).filter(r=>r.d!==null&&Math.abs(r.d)>0.001);
  return `Verglichen mit ${prev.type} vom ${fmtDate(prev.date)}:\n`+(rows.length?rows.map(r=>`• ${r.m.label}: ${r.d>0?'+':''}${fmtNum(r.d)} ${r.m.unit}${r.methodDiff?' (Methode abweichend, nur eingeschränkt vergleichbar)':''}`).join('\n'):'• Keine Unterschiede in den Endwerten.')+'\nOb die Änderungen die Rückmeldung verursacht haben, lässt sich daraus nicht ableiten.'; }
function aiNext(s){ const t=[]; const q=quality(s);
  if(q.some(x=>/Einwilligung/.test(x[1]))) t.push('Einwilligung einholen, bevor weitere Angaben gespeichert werden.');
  if(q.some(x=>/Ausgangswert fehlt/.test(x[1]))) t.push('Fehlende Ausgangswerte messen, bevor weitere Änderungen erfolgen.');
  if(q.some(x=>/unkalibriert/.test(x[1]))) t.push('Kniewinkel mit kalibrierter Aufnahme oder Goniometer prüfen.');
  if(!s.followUps.some(f=>f.status==='offen')&&s.status==='abgeschlossen') t.push('Nachkontrolle in 30 Tagen anlegen.');
  if(s.anamnesis.complaints) t.push('Bei der Nachkontrolle gezielt nach den angegebenen Beschwerden fragen und Antwort dokumentieren.');
  return t.length?t.map(x=>'• '+x).join('\n'):'Keine offenen Schritte erkannt.'; }
function aiMessage(s){ const c=cust(s.customerId); const fu=s.followUps.find(f=>f.status==='offen');
  return `Hallo ${c.name.split(' ')[0]},\n\nvielen Dank für Ihren Termin am ${fmtDate(s.date)}. Wir haben ${s.changes.length} Einstellungen an Ihrem Fahrrad angepasst. Den Bericht finden Sie im Kundenportal.\n\nBitte fahren Sie die neue Position einige Wochen und notieren Sie, wie sie sich anfühlt.${fu?` Ihre Nachkontrolle ist am ${fmtDate(fu.due)} geplant.`:''}\n\nViele Grüße\n${s.fitter}`; }
const AI = [['summary','Sitzung zusammenfassen',aiSummary],['missing','Fehlende Daten finden',aiMissing],['compare','Mit Vorsitzung vergleichen',aiCompare],['next','Nächste Schritte vorschlagen',aiNext],['message','Kundennachricht entwerfen',aiMessage]];

function createSession(d){
  const id=uid('s');
  const prev=S.sessions.filter(s=>s.bikeId===d.bid&&(Object.keys(s.after).length||Object.keys(s.before).length)).sort((a,b)=>b.date.localeCompare(a.date))[0];
  const before={}; if(d.copy&&prev){ const end={...prev.before,...prev.after}; Object.entries(end).forEach(([k,m])=>before[k]={...m,source:m.source,method:m.method}); }
  S.sessions.push({id,customerId:d.cid,bikeId:d.bid,date:d.date,time:d.time||'',type:d.type,status:'geplant',fitter:d.fitter,version:1,anamnesis:{goal:'',complaints:'',training:'',experience:'',previous:prev?`${prev.type} vom ${fmtDate(prev.date)}`:'',limits:'',comfort:''},before,after:{},changes:[],notes:'',feedback:[],followUps:[],check:{},comp:[]});
  applyMaker(S.sessions[S.sessions.length-1]);
  audit(`Sitzung angelegt: ${cust(d.cid).name}, ${d.type} am ${fmtDate(d.date)}${prev&&d.copy?' (Ausgangswerte übernommen)':''}`,id);
  return id;
}

    s.changes.push({key:k,from,to:v,reason,time:nowStamp()}); if(s.status!=='abgeschlossen') s.status='in Arbeit'; else s.version++;
    if(data.get('follow')&&from!=null){ const end={...s.before}; Object.assign(end,s.after); sideEffects(s,k,v-from).filter(e=>e.delta!=null&&MK[e.key]&&!e.comp&&['saddleSetback','reach','drop','saddleHeight'].includes(e.key)&&e.key!==k).forEach(e=>{ const base=s.after[e.key]||s.before[e.key]; if(!base) return; const nv=Math.round((Number(base.value)+e.delta)*10)/10; s.after[e.key]={key:e.key,value:nv,method:'Berechnet',source:'berechnet',unc:3,time:nowStamp()}; s.changes.push({key:e.key,from:Number(base.value),to:nv,reason:`Folge von ${MK[k].label} ${v-from>0?'+':''}${fmtNum(Math.round((v-from)*10)/10)} ${MK[k].unit} (berechnet)`,time:nowStamp()}); }); }
    audit(`${MK[k].label}: ${fmtNum(from)} → ${fmtNum(v)} ${MK[k].unit}${s.status==='abgeschlossen'?` (neue Version ${s.version})`:''}`,s.id); save(); render(); toast(from==null?'Änderung dokumentiert – kein Ausgangswert vorhanden':'Änderung dokumentiert'); },
  newSession(f,data){ S.lastFitter=String(data.get('fitter')||'').trim()||S.lastFitter; const id=createSession({cid:data.get('cid'),bid:data.get('bid'),date:data.get('date'),time:data.get('time'),type:data.get('type'),fitter:data.get('fitter'),copy:data.get('copy')==='on'}); save(); closeDrawer(); ui.sess=id; ui.sessTab='anamnese'; go('sitzung'); toast('Sitzung angelegt'); },

  cleatTransfer(f,data){ const s=sess(data.get('sid')); const fore=parseFloat(data.get('fore')); const rot=data.get('rot');
    s.before.cleatFore=s.before.cleatFore||{...mv('cleatFore',fore,'CleatLab (Prototyp, nicht validiert)','manuell eingegeben',null),time:nowStamp()};

    if(rot!==''){ s.after.cleatRotR={...mv('cleatRotR',Number(rot),'CleatLab (Prototyp, nicht validiert)','manuell eingegeben',null),time:nowStamp()}; }
    audit(`CleatLab-Werte übergeben (${ui.cleatSys}, nicht validiert)`,s.id); save(); toast(`An Sitzung von ${cust(s.customerId).name} übergeben`); render(); },
  message(f,data){ const t=String(data.get('text')).trim(); if(!t) return; (S.messages[f.dataset.id]=S.messages[f.dataset.id]||[]).push({from:'Kunde',time:nowStamp(),text:t}); save(); render(); toast('Nachricht gespeichert (kein echter Versand)'); },
  customer(f,data){ const id=uid('c'); const num=k=>{const v=data.get(k);return v===''||v===null?null:Number(v);}; const c={id,name:data.get('name').trim(),email:data.get('email'),phone:data.get('phone'),since:today(),discipline:data.get('discipline'),consent:data.get('consent')==='on',body:{height:num('height'),inseam:num('inseam'),torso:num('torso'),arm:num('arm'),shoulder:num('shoulder'),footL:num('footR'),footR:num('footR'),sitBone:null},flex:{hamstring:data.get('hamstring'),hip:'',ankle:''},tags:['Neu'],est:[]};
    if(data.get('est')==='on') estimateBody(c); S.customers.push(c); audit(`Kunde angelegt: ${c.name}`); save(); render(); customerDrawer(id); toast('Kunde angelegt – jetzt Fahrrad anlegen'); },
  bike(f,data){ const id=uid('b'); const cid=f.dataset.cid; const gid=data.get('geo'), gs=data.get('geoSize'); S.bikes.push({id,customerId:cid,name:data.get('model'),brand:data.get('brand'),model:data.get('model'),geo:gid&&gs?{id:gid,size:gs}:null,size:gid&&gs?gs:data.get('size'),year:new Date().getFullYear(),type:data.get('type'),cockpit:data.get('cockpit')||'stem',frameNo:data.get('frameNo')||'–',pedal:data.get('pedal'),saddle:'–',km:0}); audit(`Fahrrad angelegt: ${data.get('brand')} ${data.get('model')}`); save(); customerDrawer(cid); render(); toast('Fahrrad angelegt'); },
  woPos(f,data){ const w=S.workshop.find(x=>x.id===f.dataset.id); const price=Number(data.get('price')), qty=Number(data.get('qty')); if(!(price>=0)||!(qty>0)){toast('Menge und Preis prüfen',true);return;} w.positions.push({t:data.get('t'),kind:data.get('kind'),qty,price}); if(w.status==='Angenommen') w.status='Kostenvoranschlag'; w.log.push({time:nowStamp(),text:`Position hinzugefügt: ${data.get('t')}`}); save(); woDrawer(w.id); render(); },
  newWO(f,data){ const b=bike(data.get('bid')); const n=Math.max(...S.workshop.map(w=>Number(w.id.split('-')[1])))+1; const id='WO-'+n; S.workshop.unshift({id,customerId:b.customerId,bikeId:b.id,title:data.get('title'),status:'Angenommen',created:today(),due:data.get('due'),mechanic:data.get('mechanic'),positions:[],log:[{time:nowStamp(),text:'Auftrag angenommen'}],approval:null}); audit(`Werkstattauftrag ${id} angelegt`); save(); render(); woDrawer(id); toast(`${id} angelegt`); },
  item(f,data){ const sku=f.dataset.sku; const rec={sku:data.get('sku').trim(),name:data.get('name').trim(),cat:data.get('cat'),loc:data.get('loc'),stock:Number(data.get('stock')),min:Number(data.get('min')),price:Number(data.get('price'))};

document.addEventListener('click',e=>{
  const nav=e.target.closest('[data-nav]'); if(nav){ e.preventDefault(); closeDrawer(); go(nav.dataset.nav); return; }

  const f=e.target.closest('[data-form]'); if(!f) return; e.preventDefault();

  try{ FORMS[f.dataset.form](f,new FormData(f)); }catch(err){ console.error(err); toast('Speichern fehlgeschlagen: '+err.message,true); }
});
