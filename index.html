<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FitFrame</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: freundliche Werkbank – helle Karten auf warmem Grund, 5 Hauptbereiche, Fitting als geführter Ablauf in Schritten */
:root{
  --bg:#f6f5f2; --surface:#ffffff; --surface-2:#f2f0eb; --line:#e7e3dc; --fg:#1c1f22; --muted:#5c626a; --faint:#8b9097;
  --accent:#e8620f; --accent-ink:#ffffff; --accent-strong:#b54a08; --accent-soft:#fdf0e6; --accent-line:#f5c7a4;
  --ok:#1a8754; --ok-soft:#e5f4ec; --warn:#9a6a05; --warn-soft:#fcf3dc; --bad:#c23b3b; --bad-soft:#fbe8e8; --info:#2665a8; --info-soft:#e6eef9;
  --il-bg:#f4f2ee; --il-grid:rgba(28,31,34,.045); --il-frame:#4a5058; --il-tire:#2b2f34; --il-body:#2c3136; --il-soft:#d8d3ca;
  --glass:rgba(255,255,255,.88); --shadow:0 1px 2px rgba(28,31,34,.04),0 6px 20px rgba(28,31,34,.06); --shadow-lg:0 12px 40px rgba(28,31,34,.14);
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px; --side:248px; --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111214; --surface:#1a1c1f; --surface-2:#232629; --line:#2e3236; --fg:#eeece8; --muted:#a6abb2; --faint:#757b83;
  --accent:#ff7d2e; --accent-ink:#1a0c02; --accent-strong:#ff9d5c; --accent-soft:rgba(255,125,46,.13); --accent-line:rgba(255,125,46,.42);
  --ok:#4fca93; --ok-soft:rgba(79,202,147,.13); --warn:#ebc14d; --warn-soft:rgba(235,193,77,.13); --bad:#f27777; --bad-soft:rgba(242,119,119,.13); --info:#70b3f0; --info-soft:rgba(112,179,240,.13);
  --il-bg:#1d2023; --il-grid:rgba(255,255,255,.04); --il-frame:#9aa1aa; --il-tire:#cfd3d8; --il-body:#e6e4df; --il-soft:#3a3f45;
  --glass:rgba(26,28,31,.9); --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-lg:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111214; --surface:#1a1c1f; --surface-2:#232629; --line:#2e3236; --fg:#eeece8; --muted:#a6abb2; --faint:#757b83;
  --accent:#ff7d2e; --accent-ink:#1a0c02; --accent-strong:#ff9d5c; --accent-soft:rgba(255,125,46,.13); --accent-line:rgba(255,125,46,.42);
  --ok:#4fca93; --ok-soft:rgba(79,202,147,.13); --warn:#ebc14d; --warn-soft:rgba(235,193,77,.13); --bad:#f27777; --bad-soft:rgba(242,119,119,.13); --info:#70b3f0; --info-soft:rgba(112,179,240,.13);
  --il-bg:#1d2023; --il-grid:rgba(255,255,255,.04); --il-frame:#9aa1aa; --il-tire:#cfd3d8; --il-body:#e6e4df; --il-soft:#3a3f45;
  --glass:rgba(26,28,31,.9); --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-lg:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-strong)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;line-height:1.15}
h2{font-size:20px;line-height:1.25}
h3{font-size:16px;font-weight:650}
p{margin:0}
.label{font-size:12px;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .faint{color:var(--faint)}

.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:20px 14px 24px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:20px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand svg{flex:none}
.brand b{font-size:21px;font-weight:800;letter-spacing:.02em}
.brand small{display:block;font-size:11.5px;color:var(--muted);margin-top:-2px}
.navgroup{display:flex;flex-direction:column;gap:3px}
.navgroup .label{padding:0 10px 4px}
.navbtn{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:9px 10px;color:var(--muted);cursor:pointer;font-size:14.5px;font-weight:500}
.navbtn:hover{background:var(--surface-2);color:var(--fg)}
.navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--fg);font-weight:650}
.navbtn[aria-current="page"] svg{color:var(--accent)}
.navbtn svg{width:19px;height:19px;flex:none}
.navbtn.small{font-size:13.5px;padding:6px 10px}
.navbtn.small svg{width:16px;height:16px}
.navbtn .cnt{margin-left:auto;font-size:12px;font-weight:600;color:var(--accent-strong);background:var(--accent-soft);border-radius:99px;padding:0 8px}
.demo-note{margin-top:auto;font-size:12px;color:var(--faint);border-top:1px solid var(--line);padding:12px 8px 0;display:flex;flex-direction:column;gap:8px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.topbar .crumb{font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .spacer{flex:1}
.demo-pill{font-size:12px;font-weight:600;color:var(--accent-strong);background:var(--accent-soft);border-radius:99px;padding:4px 10px;white-space:nowrap}
.content{padding-block:24px 48px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;max-width:1180px;width:100%}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.pagehead p{color:var(--muted);max-width:62ch;margin-top:6px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;box-shadow:var(--shadow)}
.panel-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-b{padding:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g-main{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.g2,.g3{grid-template-columns:minmax(0,1fr)}.li{flex-wrap:wrap}.li .grow{flex:1 0 calc(100% - 110px)}}

.kpi{padding:16px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-size:30px;font-weight:750;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .s{font-size:13px;color:var(--muted)}

/* Startkacheln */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;cursor:pointer;box-shadow:var(--shadow);min-width:0}
.tile:hover{border-color:var(--accent-line)}
.tile .ti{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-strong)}
.tile .ti svg{width:22px;height:22px}
.tile b{font-size:16px;font-weight:650}
.tile span{font-size:13px;color:var(--muted)}
.tile.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile.main .ti{background:rgba(255,255,255,.22);color:var(--accent-ink)}
.tile.main span{color:var(--accent-ink);opacity:.85}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-size:14px;font-weight:600;white-space:nowrap;min-height:40px}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:none;border-color:transparent}
.btn.sm{padding:5px 11px;font-size:13px;min-height:32px;border-radius:8px}
.btn.danger{color:var(--bad)}
.btn svg{width:16px;height:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.input,select.input,textarea.input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0;font-size:16px;min-height:42px}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{min-height:80px;resize:vertical}
.form{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.form .wide{grid-column:1/-1}
.search{max-width:340px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{background:none;border:0;padding:6px 13px;cursor:pointer;color:var(--muted);font-size:13.5px;font-weight:600;border-radius:8px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

/* Schritte */
.steps{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.step{display:flex;align-items:center;gap:8px;background:none;border:1px solid transparent;border-radius:99px;padding:6px 12px 6px 6px;cursor:pointer;color:var(--muted);white-space:nowrap;font-weight:600;font-size:14px}
.step i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-size:13px;color:var(--muted)}
.step.done i{background:var(--ok-soft);color:var(--ok)}
.step[aria-current="step"]{background:var(--accent-soft);color:var(--fg);border-color:var(--accent-line)}
.step[aria-current="step"] i{background:var(--accent);color:var(--accent-ink)}
.stepnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding:12px 0;margin-top:4px;position:sticky;bottom:0;background:var(--surface);z-index:5}
#view section.panel{scroll-margin-top:140px}
.stepbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 61px);z-index:15;background:var(--surface);border-radius:var(--r) var(--r) 0 0}
@media (max-width:860px){.stepnav{bottom:calc(66px + env(safe-area-inset-bottom,0px))}.stepbar{top:calc(env(safe-area-inset-top,0px) + 61px)}}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
.up{color:var(--accent-strong)} .down{color:var(--info)}
@media (max-width:640px){
  table.rcard thead{display:none}
  table.rcard,table.rcard tbody,table.rcard tr,table.rcard td{display:block;width:100%}
  table.rcard tr{border:1px solid var(--line);border-radius:12px;margin:0 0 10px;padding:6px 12px;background:var(--surface)}
  table.rcard td{border:0;padding:6px 0;display:flex;justify-content:space-between;gap:12px;text-align:right}
  table.rcard td::before{content:attr(data-l);color:var(--muted);font-size:13px;text-align:left;flex:none;max-width:45%}
  table.rcard td:first-child{text-align:left;font-weight:600;display:block}
  table.rcard td:first-child::before{display:none}
  table.rcard td:empty{display:none}
  .tw:has(table.rcard){padding:10px}
}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap;line-height:1.45}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.nodot::before{display:none}
.c-ok{color:var(--ok);background:var(--ok-soft)}
.c-warn{color:var(--warn);background:var(--warn-soft)}
.c-bad{color:var(--bad);background:var(--bad-soft)}
.c-info{color:var(--info);background:var(--info-soft)}
.c-acc{color:var(--accent-strong);background:var(--accent-soft)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--faint);background:none;border:0;padding:2px 4px;cursor:help;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%}
.st-i::before{background:var(--ok)} .st-s::before{background:var(--info)} .st-k::before{background:var(--faint)} .st-x::before{background:var(--warn)}
.src{font-size:12px;color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:640px){#today .li,.list .li.appt{flex-wrap:wrap}#today .li .grow{flex:1 0 calc(100% - 120px)}#today .li .avatar{display:none}#today .li .sub{white-space:normal}}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.camcard{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:14px;border:1px dashed var(--accent-line);background:var(--accent-soft)}
.camcard .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--surface);color:var(--accent-strong);flex:none}
.camcard .ico svg{width:22px;height:22px}
.camcard b{display:block;font-size:15.5px}
.sesshead{display:flex;align-items:center;gap:12px}
.sesshead h1{font-size:22px}
.sesshead p{color:var(--muted);font-size:14px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stepnav{flex-wrap:nowrap!important;align-items:center}
.step{padding:5px 10px 5px 5px;font-size:13.5px}
.step i{width:24px;height:24px}
.steps{justify-content:space-between}
@media (max-width:480px){.step:not([aria-current]) .lbl{display:none}.step:not([aria-current]){padding:4px}.hide-sm{display:none}.step{gap:5px;padding:4px 8px 4px 4px;font-size:12.5px}.step i{width:22px;height:22px;font-size:12px}.steps{gap:2px}.panel-h.stepbar{padding:8px 6px!important}}
.wiz .illus{max-width:340px}
.wiz .illus svg{max-height:170px}
.cmp{display:flex;flex-direction:column}
.cmp .li{padding:10px 0;gap:10px}
.cmp .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.wiz{display:flex;flex-direction:column;gap:16px}
.wiz-top{display:flex;align-items:center;gap:12px}
.wiz-bar{flex:1;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.wiz-bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}
.wiz-count{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
.wiz h2{font-size:24px}
.wiz .lead{font-size:15.5px;color:var(--muted);max-width:52ch;margin-top:4px}
.wiz .illus{max-width:440px;margin:0}
ol.how{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.wiz .wside{display:flex;flex-direction:column;gap:6px}
.bigchips{display:flex;flex-wrap:wrap;gap:8px}
.bigchips .chipbtn{min-height:44px;padding:9px 16px;font-size:15px}
.wiz .input.num{font-size:20px;min-height:50px;max-width:220px}
.ovl{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.ovl .li{padding:12px 4px;gap:12px}
.st-ico{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:13px;font-weight:700}
.st-ico.done{background:var(--ok-soft);color:var(--ok)} .st-ico.open{background:var(--surface-2);color:var(--faint)} .st-ico.warn{background:var(--warn-soft);color:var(--warn)}
.ovl .t{hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere}
.ovl .val{font-size:13.5px;color:var(--muted);text-align:right;max-width:40%;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.onlyline{font-size:15px;color:var(--muted)}
.statusbox{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:12px;background:var(--surface-2)}
.statusbox.ok{background:var(--ok-soft)} .statusbox.warn{background:var(--warn-soft)} .statusbox.bad{background:var(--bad-soft)}
.statusbox b{display:block;font-size:16px}
.btn.big{min-height:52px;font-size:16px;width:100%}
.sugg{display:flex;flex-direction:column;gap:10px}
.sugg .card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.sugg .card .grow{flex:1;min-width:0}
.tabsbar{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px;overflow-x:auto;scrollbar-width:none}
.tabsbar button{flex:1;border:0;background:none;padding:9px 12px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabsbar button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.chg{display:flex;flex-direction:column}
.chg .li{padding:10px 0}
.hint{font-size:12.5px;color:var(--muted);line-height:1.4}
.hint.out{color:var(--bad);font-weight:600}
.illus{background-color:var(--il-bg);background-image:linear-gradient(var(--il-grid) 1px,transparent 1px),linear-gradient(90deg,var(--il-grid) 1px,transparent 1px);background-size:16px 16px;border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0 6px;max-width:400px}
.illus svg{width:100%;height:auto;display:block;overflow:visible}
.illus line,.illus path{stroke-linecap:round;stroke-linejoin:round}
.illus circle,.illus ellipse{fill:none}
.il-b{stroke:var(--il-frame);fill:none} .il-f{stroke:var(--il-soft);fill:none;stroke-width:2} rect.il-f{fill:var(--surface);stroke:var(--il-soft)} .il-tire{stroke:var(--il-tire);fill:none;stroke-width:5} .il-shadow{fill:var(--il-soft);opacity:.55;stroke:none}
.il-p{stroke:var(--il-body);fill:none} .il-h{stroke:var(--accent);fill:none} .il-d{stroke:var(--faint);stroke-dasharray:4 4;stroke-width:1.5}
.il-head{fill:var(--accent);stroke:none}
.illus circle.il-fill.il-b{fill:var(--il-frame)} .illus circle.il-fill.il-p{fill:var(--il-body)} .illus circle.il-fill.il-h{fill:var(--accent)}
.il-t{fill:var(--fg);font:650 12px var(--f-body)} .il-s{fill:var(--muted);font:500 11px var(--f-body)} .il-t,.il-s{paint-order:stroke;stroke:var(--il-bg);stroke-width:4px;stroke-linejoin:round}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13.5px;font-weight:500;cursor:pointer;color:var(--fg);min-height:34px}
.chipbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-strong);font-weight:600}
tr.best td{background:var(--ok-soft)}

.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--info-soft);font-size:14px}
.notice.warn{background:var(--warn-soft)}
.notice.acc{background:var(--accent-soft)}
.notice svg{flex:none;width:18px;height:18px;margin-top:2px}
.notice.warn svg{color:var(--warn)} .notice svg{color:var(--info)} .notice.acc svg{color:var(--accent-strong)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600}
.li .sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.li.click{cursor:pointer}.li.click:hover{background:var(--surface-2)}
.time{font-family:var(--f-mono);font-size:14px;font-weight:500;color:var(--accent-strong);min-width:48px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;color:var(--accent-strong)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty svg{width:28px;height:28px;color:var(--faint)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:14px}
.dl dt{color:var(--muted)} .dl dd{margin:0}
.bar{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.stack{display:flex;flex-direction:column;gap:14px}
hr{border:0;border-top:1px solid var(--line);margin:0}
details.more summary{cursor:pointer;color:var(--muted);font-weight:600;list-style:none;padding:4px 0}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"▸ "}
details.more[open] summary::before{content:"▾ "}

.scrim{position:fixed;inset:0;background:rgba(20,22,25,.4);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:51;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);box-shadow:-10px 0 40px rgba(0,0,0,.12)}
.drawer-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.drawer-h h2{flex:1;min-width:0}
.drawer-b{overflow:auto;padding:18px;display:flex;flex-direction:column;gap:18px}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:18px;height:18px}
.iconbtn.menu-btn{display:none}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--fg);color:var(--bg);padding:11px 15px;border-radius:12px;font-size:14px;max-width:340px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.err{background:var(--bad);color:#fff}

.report{background:#ffffff;color:#1b1c1e;border:1px solid var(--line);border-radius:12px;padding:26px 24px;font-size:14px;line-height:1.55}
.report h2,.report h3{color:#1b1c1e}
.report .rh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid #ee6a14;padding-bottom:10px;margin-bottom:14px}
.report table td,.report table th{border-color:#e2dfd8;color:#1b1c1e}
.report th{color:#5c5f66}
.report .sec{margin-top:16px;display:flex;flex-direction:column;gap:6px}
.report .fine{font-size:12px;color:#6a6d74}

.bottomnav{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);height:auto;z-index:55;transform:translateX(-102%);transition:transform .2s ease;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .iconbtn.menu-btn{display:grid}
  .content{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .bottomnav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);padding:5px 0;cursor:pointer}
  .bottomnav button svg{width:23px;height:23px}
  .bottomnav button[aria-current="page"]{color:var(--accent-strong)}
  h1{font-size:25px}
  .toasts{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  .crumb{display:none}
}
@media print{
  body{background:#fff!important}
  body *{visibility:hidden!important}
  .report,.report *{visibility:visible!important}
  .report{position:absolute;left:0;top:0;width:100%;border:0!important;padding:0!important}
  .drawer,.drawer-b{position:static!important;overflow:visible!important;box-shadow:none!important}
}
@keyframes ffIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ffNext{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes ffPrev{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes ffPop{0%{transform:scale(.85)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes ffUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes ffSlide{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes ffFade{from{opacity:0}to{opacity:1}}
@keyframes ffDraw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:no-preference){
  .anim-in{animation:ffIn .26s var(--ease)}
  .anim-next{animation:ffNext .28s var(--ease)}
  .anim-prev{animation:ffPrev .28s var(--ease)}
  .anim-next .illus .il-h,.anim-prev .illus .il-h{stroke-dasharray:420;stroke-dashoffset:420;animation:ffDraw .8s .15s var(--ease) forwards}
  .anim-next .illus .il-head,.anim-prev .illus .il-head{opacity:0;animation:ffFade .3s .7s forwards}
  .toast{animation:ffUp .22s var(--ease)}
  .drawer{animation:ffSlide .26s var(--ease)}
  .scrim{animation:ffFade .2s}
  .chipbtn.pop{animation:ffPop .26s var(--ease)}
  .btn,.chipbtn,.tile,.step,.navbtn,.li.click{transition:transform .12s,background-color .15s,border-color .15s,box-shadow .2s,color .15s}
  .btn:active,.chipbtn:active{transform:scale(.97)}
  .tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
  .wiz-bar i{transition:width .45s var(--ease)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
canvas{max-width:100%;display:block}
.svgwrap svg{width:100%;height:auto;display:block}
.cal{display:grid;grid-template-columns:110px repeat(5,minmax(70px,1fr));gap:5px;min-width:520px;font-size:13px}
.cal .cell{background:var(--surface-2);border-radius:8px;padding:7px;min-height:44px}
.cal .over{outline:2px solid var(--bad)}

function rangeFor(def,c){

function measureRange(k,c,b){

  switch(k){
    case 'saddleHeight': return ins?{lo:Math.round(ins*10*0.85),hi:Math.round(ins*10*0.92),unit:'mm',basis:`etwa 85–92 % der Schrittlänge (${fmtNum(ins)} cm${c.body.inseam?'':', geschätzt'})`}:{need:'Schrittlänge'};

    case 'crankLength': return {lo:150,hi:180,unit:'mm',basis:'erhältliche Kurbellängen'};

function drawScan(){
  const cv=document.getElementById('scanCanvas'); const img=scanImg[scan.view]; if(!cv||!img||!img.naturalWidth) return;
  const sc=Math.min(1,900/img.naturalWidth); cv.width=Math.round(img.naturalWidth*sc); cv.height=Math.round(img.naturalHeight*sc);
  const ctx=cv.getContext('2d'); ctx.drawImage(img,0,0,cv.width,cv.height);
  const P=scan.pts[scan.view], r=Math.max(6,cv.width/110); ctx.lineWidth=Math.max(3,cv.width/260); ctx.strokeStyle='#ff7d2e'; ctx.font=`600 ${Math.round(r*2.2)}px Figtree, sans-serif`;
  const L=(a,b)=>{ if(P[a]&&P[b]){ ctx.beginPath(); ctx.moveTo(...P[a]); ctx.lineTo(...P[b]); ctx.stroke(); } };
  if(scan.view==='front'){ L('shL','shR'); L('hipL','hipR'); L('hipL','knL'); L('knL','anL'); L('hipR','knR'); L('knR','anR'); L('shL','hipL'); L('shR','hipR'); }
  else { L('sh','hip'); L('hip','kn'); L('kn','an'); L('sh','wr'); }
  if(P.top&&P.floor){ ctx.setLineDash([8,8]); ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.beginPath(); ctx.moveTo(P.top[0],P.top[1]); ctx.lineTo(P.top[0],P.floor[1]); ctx.stroke(); ctx.setLineDash([]); ctx.strokeStyle='#ff7d2e'; }
  SCAN[scan.view].pts.forEach(([k,l])=>{ const p=P[k]; if(!p) return; ctx.fillStyle='#ff7d2e'; ctx.beginPath(); ctx.arc(p[0],p[1],r,0,Math.PI*2); ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle='#fff'; ctx.stroke(); ctx.lineWidth=Math.max(3,cv.width/260); ctx.strokeStyle='#ff7d2e';
    ctx.fillStyle='#fff'; ctx.strokeStyle='rgba(0,0,0,.65)'; ctx.lineWidth=4; ctx.strokeText(l,p[0]+r*1.6,p[1]+r*.6); ctx.fillText(l,p[0]+r*1.6,p[1]+r*.6); ctx.strokeStyle='#ff7d2e'; ctx.lineWidth=Math.max(3,cv.width/260); });
}
function wireScan(){
  const cv=document.getElementById('scanCanvas'); if(!cv) return; drawScan();
  cv.addEventListener('pointerdown',e=>{ const rc=cv.getBoundingClientRect(); const x=(e.clientX-rc.left)*cv.width/rc.width, y=(e.clientY-rc.top)*cv.height/rc.height;
    const P=scan.pts[scan.view]; const next=SCAN[scan.view].pts.find(([k])=>!P[k]); if(!next) return; P[next[0]]=[x,y]; scanDrawer(); });
}

function readiness(f,s){

  checkFindings(s).filter(f=>f.cat==='fitting'&&f.lvl!=='ok').forEach(f=>add(null,f.title,'Aus dem Körpercheck.',f.text));

function fitPosition(s){
  const e={...s.before,...s.after}; const g=k=>e[k]?Number(e[k].value):null;
  const h=g('saddleHeight'), sb=g('saddleSetback'), r=g('reach'), d=g('drop');
  if(h==null||sb==null||r==null||d==null) return null;
  const xs=sb+70; const Hs=Math.sqrt(Math.max(h*h-xs*xs,0));
  const bx=-sb+Math.sqrt(Math.max(r*r-d*d,0)), by=Hs-d;
  return {bx,by,h,sb,r,d};
}
function sizeAdvice(s,g){
  const P=fitPosition(s); if(!P) return null; const mtb=g.type==='MTB';
  const res=g.rows.map(row=>{ const x=geoRowObj(row); if(x.stack==null||x.reach==null||x.headAngle==null) return {size:x.size,ok:false,why:'Werte fehlen'};
    const HA=x.headAngle*Math.PI/180, th=(90-x.headAngle-6)*Math.PI/180;
    const ux=-Math.cos(HA), uy=Math.sin(HA), vx=Math.cos(th), vy=Math.sin(th);
    const dx=P.bx-x.reach, dy=P.by-x.stack; const det=ux*vy-uy*vx;
    const Sp=(dx*vy-dy*vx)/det, L=(ux*dy-uy*dx)/det; const spacer=Sp-30;
    const [lo,hi,mid]=mtb?[35,80,50]:[70,130,100];
    const fits=L>=lo&&L<=hi&&spacer>=0&&spacer<=40; const near=L>=lo-15&&L<=hi+15&&spacer>=-10&&spacer<=55;
    return {size:x.size,stem:Math.round(L),spacer:Math.round(spacer),fits,near,score:Math.abs(L-mid)/10+Math.abs(spacer-15)/10};
  });
  const best=res.filter(x=>x.fits).sort((a,b)=>a.score-b.score)[0];
  return {P,res,best};
}

/* ---------- Quality (FitQuality) ---------- */
function quality(s){
  const out=[];
  const c=cust(s.customerId);
  if(!c.consent) out.push(['bad','Einwilligung zur Datenverarbeitung fehlt','Vor Erfassung von Beschwerden einholen']);
  else if(c.consentInfo&&!c.consentInfo.health&&(s.anamnesis.complaints||Object.keys(s.check||{}).length)) out.push(['warn','Gesundheitsangaben gespeichert, aber keine Zustimmung dafür','Einwilligung ergänzen oder Angaben entfernen']);
  if(!s.anamnesis.goal) out.push(['warn','Fitting-Ziel nicht dokumentiert','Anamnese']);
  if(s.status!=='geplant'){
    REQUIRED.forEach(k=>{ if(!s.before[k]) out.push(['warn',`Ausgangswert fehlt: ${MK[k].label}`,'Ausgangsposition']); });
    if(s.status==='abgeschlossen') REQUIRED.forEach(k=>{ if(!s.after[k]) out.push(['warn',`Endwert fehlt: ${MK[k].label}`,'Anpassungen']); });
  }
  ['before','after'].forEach(side=>Object.values(s[side]).forEach(m=>{
    if(m.source==='geschätzt') out.push(['info',`${MK[m.key].label} (${side==='before'?'vorher':'nachher'}) ist geschätzt, keine reproduzierbare Messung`,m.method]);
    if(m.source==='gemessen' && (m.unc===null||m.unc===undefined) && !/Herstellerangabe/.test(m.method)) out.push(['info',`Messunsicherheit fehlt: ${MK[m.key].label}`,m.method]);
    if(/unkalibriert/.test(m.method)) out.push(['warn',`${MK[m.key].label}: Video nicht kalibriert, Winkel nur als Orientierung`,m.method]);
  }));
  Object.keys(s.after).forEach(k=>{ const b=s.before[k], a=s.after[k]; if(b && a && b.method!==a.method) out.push(['warn',`${MK[k].label}: Vorher und nachher mit unterschiedlicher Methode gemessen`,`${b.method} → ${a.method}`]); });
  if(s.status!=='geplant'&&!Object.keys(s.check||{}).length) out.push(['warn','Körpercheck nicht durchgeführt','Schritt Körpercheck']);
  checkFindings(s).filter(x=>x.cat==='arzt').forEach(x=>out.push(['bad',`${x.title}: Fachperson hinzuziehen`,'Körpercheck']));
  BODY.forEach(([k,l])=>{ const rg=rangeFor(BODY_RANGE[k],c); const v=c.body[k]; if(rg&&rg.lo!=null&&v!=null&&v!==''&&(v<rg.lo||v>rg.hi)) out.push(['warn',`${l} ${fmtNum(v)} liegt außerhalb von ${fmtNum(rg.lo)}–${fmtNum(rg.hi)} ${rg.unit}: nachmessen`,'Körpermaße']); });
  ['before','after'].forEach(side=>Object.values(s[side]).forEach(m=>{ const rg=measureRange(m.key,c,bike(s.bikeId)); if(rg&&rg.lo!=null&&(m.value<rg.lo||m.value>rg.hi)) out.push(['warn',`${MK[m.key].label} ${fmtNum(m.value)} ${MK[m.key].unit} liegt außerhalb von ${fmtNum(rg.lo)}–${fmtNum(rg.hi)}: nachmessen`,side==='before'?'Ausgangsposition':'Anpassungen']); }));
  Object.entries(s.check||{}).forEach(([k,v])=>{ const base=k.replace(/[LR]$/,''); const rg=rangeFor(CHECK_RANGE[CHECK_RANGE[k]?k:base],c); if(rg&&rg.lo!=null&&typeof v==='number'&&(v<rg.lo||v>rg.hi)) out.push(['warn',`Körpercheck: ${fmtNum(v)} ${rg.unit} liegt außerhalb von ${fmtNum(rg.lo)}–${fmtNum(rg.hi)}: nachmessen`,'Körpercheck']); });
  const body=c.body; const missing=BODY.filter(([k])=>body[k]===null||body[k]===undefined||body[k]==='').map(b=>b[1]);
  if(missing.length) out.push(['info',`Körpermaße unvollständig: ${missing.join(', ')}`,'Kundenprofil']);
  if((c.est||[]).length) out.push(['info',`Körpermaße geschätzt, nicht gemessen: ${c.est.map(k=>BODY.find(b=>b[0]===k)[1]).join(', ')}`,'Kundenprofil']);
  return out;
}
function qScore(s){
  if(s.status==='geplant') return null;
  const q=quality(s); const pen=q.reduce((a,[l])=>a+(l==='bad'?20:l==='warn'?8:2),0);
  return Math.max(0,100-pen);
}

const STEPS=[['anamnese','Ziel'],['koerper','Körper'],['ausgang','Messen'],['anpassung','Anpassen'],['ergebnis','Ergebnis']];
function stepDone(s,c,k){
  if(k==='anamnese') return !!s.anamnesis.goal;
  if(k==='koerper') return Object.keys(s.check||{}).length>=5 && c.body.inseam!=null && c.body.inseam!=='';
  if(k==='ausgang') return REQUIRED.every(x=>s.before[x]);
  if(k==='anpassung') return s.changes.length>0;
  return s.status==='abgeschlossen';
}

// Grobe Durchschnittsverhältnisse zur Körpergröße. Demo-Annahmen, keine validierten Werte.
const RATIO={inseam:0.47,torso:0.30,arm:0.36,shoulder:0.225,footL:1.5,footR:1.5};
const BODY_DEFAULT={height:175,inseam:82,torso:56,arm:60,shoulder:40,footL:265,footR:265,sitBone:null};
const estVal=(H,k)=>k.startsWith('foot')?Math.round(H*RATIO[k]):Math.round(H*RATIO[k]*2)/2;
function bodyVal(c,k){
  const v=c.body[k];
  if(v!==null&&v!==undefined&&v!=='') return {v:Number(v),src:(c.est||[]).includes(k)?'geschätzt':'eingetragen'};
  const H=Number(c.body.height);
  if(H&&RATIO[k]) return {v:estVal(H,k),src:'aus Körpergröße'};
  return {v:BODY_DEFAULT[k],src:'Standardwert'};
}
function estimateBody(c){
  const H=Number(c.body.height); if(!H) return -1; c.est=c.est||[]; let n=0;
  Object.keys(RATIO).forEach(k=>{ if(c.body[k]===null||c.body[k]===undefined||c.body[k]===''){ c.body[k]=estVal(H,k); if(!c.est.includes(k)) c.est.push(k); n++; } });
  return n;
}
const FITBASE={Rennrad:{sb:55,r:.45,dr:60},Gravel:{sb:50,r:.43,dr:40},Triathlon:{sb:-15,r:.47,dr:90},MTB:{sb:35,r:.47,dr:15},'E-Bike':{sb:65,r:.40,dr:-40},Trekking:{sb:60,r:.41,dr:-30}};
function simFit(c,b){
  const ins=bodyVal(c,'inseam').v, tor=bodyVal(c,'torso').v, arm=bodyVal(c,'arm').v, foot=bodyVal(c,'footR').v;
  const k=FITBASE[b.type]||{sb:55,r:.44,dr:50}; const stiff=/eingeschränkt/.test(c.flex.hamstring||'');
  return {saddleHeight:Math.round(ins*10*0.883-(stiff?5:0)),saddleSetback:Math.round(k.sb+(ins-80)*1.5),saddleTilt:b.type==='Triathlon'?-2:0,
    reach:Math.round((tor+arm)*10*k.r),drop:Math.round(k.dr-(stiff?15:0)),crankLength:ins<78?165:ins<84?170:ins<90?172.5:175,
    cleatFore:foot>270?7:5,cleatRotL:0,cleatRotR:0};
}
function simInputs(s,side){
  const c=cust(s.customerId), b=bike(s.bikeId), fit=simFit(c,b);
  const rec=side==='after'?{...s.before,...s.after}:s.before;
  const get=k=>rec[k]?{v:Number(rec[k].value),src:'aus Sitzung'}:{v:fit[k],src:'berechnet'};
  return {c,b,h:get('saddleHeight'),sb:get('saddleSetback'),reach:get('reach'),drop:get('drop'),crank:get('crankLength'),
    height:bodyVal(c,'height'),inseam:bodyVal(c,'inseam'),torso:bodyVal(c,'torso'),arm:bodyVal(c,'arm')};
}
const clamp1=x=>Math.max(-1,Math.min(1,x));
const deg=r=>r*180/Math.PI;
function kin(P,a){
  const h=P.h.v, sb=P.sb.v, crank=P.crank.v, reach=P.reach.v, drop=P.drop.v;
  const thigh=P.inseam.v*10*0.52, shank=P.inseam.v*10*0.52;
  const sy=Math.sqrt(Math.max(h*h-sb*sb,1));
  const hip=[-sb-90,sy+30], hand=[-sb+reach,sy-drop];
  const pedal=[Math.cos(a)*crank,Math.sin(a)*crank];
  let ankle=[pedal[0]-40,pedal[1]+110];
  const dx=ankle[0]-hip[0], dy=ankle[1]-hip[1], d=Math.hypot(dx,dy), over=d>thigh+shank;
  const dd=Math.min(d,thigh+shank-0.5); const base=Math.atan2(dy,dx);
  if(over) ankle=[hip[0]+Math.cos(base)*dd,hip[1]+Math.sin(base)*dd];
  const ah=Math.acos(clamp1((thigh*thigh+dd*dd-shank*shank)/(2*thigh*dd)));
  const knee=[hip[0]+thigh*Math.cos(base+ah),hip[1]+thigh*Math.sin(base+ah)];
  const kneeAng=deg(Math.acos(clamp1((thigh*thigh+shank*shank-dd*dd)/(2*thigh*shank))));
  const T=P.torso.v*10, A=P.arm.v*10*0.92, hx=hand[0]-hip[0], hy=hand[1]-hip[1], D=Math.hypot(hx,hy), ux=hx/D, uy=hy/D;
  let shoulder;
  if(D>=T+A) shoulder=[hip[0]+ux*T,hip[1]+uy*T];
  else { const aa=(T*T-A*A+D*D)/(2*D), hh=Math.sqrt(Math.max(T*T-aa*aa,0)); shoulder=[hip[0]+aa*ux-hh*uy,hip[1]+aa*uy+hh*ux]; }
  const tv=[shoulder[0]-hip[0],shoulder[1]-hip[1]], kv=[knee[0]-hip[0],knee[1]-hip[1]];
  const hipAng=deg(Math.acos(clamp1((tv[0]*kv[0]+tv[1]*kv[1])/(Math.hypot(...tv)*Math.hypot(...kv)))));
  const torsoAng=deg(Math.atan2(tv[1],tv[0]));
  return {hip,hand,pedal,ankle,knee,shoulder,sy,kneeAng,hipAng,torsoAng,over,stretched:D>=T+A};
}
function cycle(P){
  let kMax=0,kMin=999,hMin=999,over=false,k;
  for(let d=0;d<360;d+=3){ k=kin(P,d*Math.PI/180); kMax=Math.max(kMax,k.kneeAng); kMin=Math.min(kMin,k.kneeAng); hMin=Math.min(hMin,k.hipAng); over=over||k.over; }
  return {kneeMax:Math.round(kMax),kneeMin:Math.round(kMin),hipMin:Math.round(hMin),torso:Math.round(k.torsoAng),over,stretched:k.stretched};
}
function simCaptureInto(s,side,withFit){
  const c=cust(s.customerId), b=bike(s.bikeId); const fit=simFit(c,b); let n=0; const tgt=s[side];
  if(withFit) Object.entries(fit).forEach(([k,v])=>{ if(!s.before[k]){ s.before[k]={...mv(k,v,'Simulation aus Körpermaßen','berechnet',null),time:nowStamp()}; n++; } });
  const r=cycle(simInputs(s,side));
  [['kneeBDC',r.kneeMax],['hipAngle',r.hipMin],['torsoAngle',r.torso]].forEach(([k,v])=>{ tgt[k]={...mv(k,v,'Simulation (Motion)','geschätzt',null),time:nowStamp()}; n++; });
  return {n,r};
}

const vid={src:null,kind:null,mode:'knee',pts:[],t:0};
let vidEl=null, imgEl=null;
function vidMedia(){
  if(!vidEl){ vidEl=document.createElement('video'); vidEl.muted=true; vidEl.playsInline=true; vidEl.setAttribute('playsinline',''); vidEl.preload='auto'; vidEl.style.cssText='position:fixed;left:-9999px;width:2px;height:2px;opacity:0'; document.body.appendChild(vidEl); vidEl.addEventListener('seeked',drawVid); vidEl.addEventListener('loadeddata',()=>{ try{ vidEl.currentTime=Math.min(0.05,vidEl.duration||0); }catch(e){} drawVid(); }); }

function vidAngle(){

function drawVid(){

let motion={raf:0,playing:false,t:0,last:0};
function motionStep(ts){
  const cv=document.getElementById('motionCanvas'); if(!cv){cancelAnimationFrame(motion.raf);motion.playing=false;return;}
  const sp=Number((document.getElementById('motionSpeed')||{}).value||1);
  if(motion.playing){ if(motion.last) motion.t+=(ts-motion.last)/1000*sp*1.4; motion.last=ts; }

  if(motion.playing) motion.raf=requestAnimationFrame(motionStep);
}
function drawMotion(cv){
  const s=sess(ui.motionSess); if(!s) return; const P=simInputs(s,ui.motionSide);
  const ctx=cv.getContext('2d'), W=cv.width, H=cv.height; ctx.clearRect(0,0,W,H);
  const sc=0.27, ox=270, oy=370; const Pt=(x,y)=>[ox+x*sc,oy-y*sc];
  ctx.strokeStyle='#22252b'; ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  const a=-motion.t*2*Math.PI; const k=kin(P,a);
  const line=(p,q,col,w)=>{const [x1,y1]=Pt(...p),[x2,y2]=Pt(...q);ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();};
  const dot=(p,col,r)=>{const [x,y]=Pt(...p);ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();};
  const sb=P.sb.v, rear=[-410,70], front=[600,70];
  ctx.strokeStyle='#3a3f48'; ctx.lineWidth=3; [rear,front].forEach(w=>{const [x,y]=Pt(...w);ctx.beginPath();ctx.arc(x,y,340*sc,0,Math.PI*2);ctx.stroke();});
  const seatTop=[-sb,k.sy-60], head=[k.hand[0]-60,k.hand[1]-60];
  line([0,0],seatTop,'#3a3f48',5); line([0,0],head,'#3a3f48',5); line(seatTop,head,'#3a3f48',4); line([0,0],rear,'#3a3f48',4); line(seatTop,rear,'#3a3f48',3); line(head,front,'#3a3f48',4);
  line([-sb-130,k.sy],[-sb+10,k.sy],'#6c727d',7); line(head,k.hand,'#6c727d',4);
  line([0,0],k.pedal,'#9ba1ab',4); dot([0,0],'#ecebe8',5);
  line(k.hip,k.shoulder,'#ecebe8',7); line(k.shoulder,k.hand,'#cfcdc8',5);
  line(k.hip,k.knee,'#ff7a1a',8); line(k.knee,k.ankle,'#ff7a1a',7); line(k.ankle,[k.pedal[0]+60,k.pedal[1]],'#ff7a1a',5);
  const tv=[k.shoulder[0]-k.hip[0],k.shoulder[1]-k.hip[1]], tl=Math.hypot(...tv);

  const [kx,ky]=Pt(...k.knee); ctx.fillStyle='#ff7a1a'; ctx.font='600 15px IBM Plex Mono, monospace'; ctx.fillText(k.kneeAng.toFixed(0)+'°',kx+12,ky-6);
  ctx.fillStyle='#6c727d'; ctx.font='12px IBM Plex Sans, sans-serif';

  const crankDeg=((-a*180/Math.PI)%360+360)%360;
  motion.cur={knee:Math.round(k.kneeAng),hip:Math.round(k.hipAng),crank:Math.round(crankDeg)};

}

/* --- KI-Assistent --- */
function aiSummary(s){ const c=cust(s.customerId),b=bike(s.bikeId); const big=s.changes.slice().sort((x,y)=>Math.abs(y.to-y.from)-Math.abs(x.to-x.from)).slice(0,3);
  return `${c.name} kam am ${fmtDate(s.date)} zum ${s.type} mit dem ${b.brand} ${b.model}. Ziel: ${s.anamnesis.goal||'nicht dokumentiert'}. ${s.anamnesis.complaints?`Angegebene Beschwerden: ${s.anamnesis.complaints}. `:''}${s.changes.length?`Es wurden ${s.changes.length} Einstellungen geändert, die größten: ${big.map(ch=>`${MK[ch.key].label} ${fmtNum(ch.from)} → ${fmtNum(ch.to)} ${MK[ch.key].unit}`).join('; ')}.`:'Es wurden noch keine Änderungen dokumentiert.'} ${s.feedback.length?`Letzte Rückmeldung: „${s.feedback[s.feedback.length-1].text}“ (subjektiv).`:''}`; }
function aiMissing(s){ const q=quality(s); return q.length?q.map(x=>'• '+x[1]).join('\n'):'Keine fehlenden Pflichtangaben gefunden.'; }
function aiCompare(s){ const prev=S.sessions.filter(x=>x.customerId===s.customerId&&x.bikeId===s.bikeId&&x.date<s.date).sort((a,b)=>b.date.localeCompare(a.date))[0];
  if(!prev) return 'Keine frühere Sitzung mit demselben Fahrrad vorhanden.';
  const rows=compareRows({...prev.before,...prev.after},{...s.before,...s.after}).filter(r=>r.d!==null&&Math.abs(r.d)>0.001);
  return `Verglichen mit ${prev.type} vom ${fmtDate(prev.date)}:\n`+(rows.length?rows.map(r=>`• ${r.m.label}: ${r.d>0?'+':''}${fmtNum(r.d)} ${r.m.unit}${r.methodDiff?' (Methode abweichend, nur eingeschränkt vergleichbar)':''}`).join('\n'):'• Keine Unterschiede in den Endwerten.')+'\nOb die Änderungen die Rückmeldung verursacht haben, lässt sich daraus nicht ableiten.'; }
function aiNext(s){ const t=[]; const q=quality(s);
  if(q.some(x=>/Einwilligung/.test(x[1]))) t.push('Einwilligung einholen, bevor weitere Angaben gespeichert werden.');
  if(q.some(x=>/Ausgangswert fehlt/.test(x[1]))) t.push('Fehlende Ausgangswerte messen, bevor weitere Änderungen erfolgen.');
  if(q.some(x=>/unkalibriert/.test(x[1]))) t.push('Kniewinkel mit kalibrierter Aufnahme oder Goniometer prüfen.');
  if(!s.followUps.some(f=>f.status==='offen')&&s.status==='abgeschlossen') t.push('Nachkontrolle in 30 Tagen anlegen.');
  if(s.anamnesis.complaints) t.push('Bei der Nachkontrolle gezielt nach den angegebenen Beschwerden fragen und Antwort dokumentieren.');
  return t.length?t.map(x=>'• '+x).join('\n'):'Keine offenen Schritte erkannt.'; }
function aiMessage(s){ const c=cust(s.customerId); const fu=s.followUps.find(f=>f.status==='offen');
  return `Hallo ${c.name.split(' ')[0]},\n\nvielen Dank für Ihren Termin am ${fmtDate(s.date)}. Wir haben ${s.changes.length} Einstellungen an Ihrem Fahrrad angepasst. Den Bericht finden Sie im Kundenportal.\n\nBitte fahren Sie die neue Position einige Wochen und notieren Sie, wie sie sich anfühlt.${fu?` Ihre Nachkontrolle ist am ${fmtDate(fu.due)} geplant.`:''}\n\nViele Grüße\n${s.fitter}`; }
const AI = [['summary','Sitzung zusammenfassen',aiSummary],['missing','Fehlende Daten finden',aiMissing],['compare','Mit Vorsitzung vergleichen',aiCompare],['next','Nächste Schritte vorschlagen',aiNext],['message','Kundennachricht entwerfen',aiMessage]];

function createSession(d){
  const id=uid('s');
  const prev=S.sessions.filter(s=>s.bikeId===d.bid&&(Object.keys(s.after).length||Object.keys(s.before).length)).sort((a,b)=>b.date.localeCompare(a.date))[0];
  const before={}; if(d.copy&&prev){ const end={...prev.before,...prev.after}; Object.entries(end).forEach(([k,m])=>before[k]={...m,source:m.source,method:m.method}); }
  S.sessions.push({id,customerId:d.cid,bikeId:d.bid,date:d.date,time:d.time||'',type:d.type,status:'geplant',fitter:d.fitter,version:1,anamnesis:{goal:'',complaints:'',training:'',experience:'',previous:prev?`${prev.type} vom ${fmtDate(prev.date)}`:'',limits:'',comfort:''},before,after:{},changes:[],notes:'',feedback:[],followUps:[],check:{},comp:[]});

  audit(`Sitzung angelegt: ${cust(d.cid).name}, ${d.type} am ${fmtDate(d.date)}${prev&&d.copy?' (Ausgangswerte übernommen)':''}`,id);
  return id;
}

function importJson(t){
  let d; try{ d=JSON.parse(t); }catch(e){ toast('Das ist keine gültige FitFrame-Sicherung',true); return; }
  if(d&&d.data) d=d.data; if(!d||!Array.isArray(d.customers)){ toast('Das ist keine gültige FitFrame-Sicherung',true); return; }
  const n=mergeData(d); S.customers.forEach(c=>{ c.est=c.est||[]; }); S.sessions.forEach(x=>{ x.check=x.check||{}; x.comp=x.comp||[]; });
  audit(`Sicherung geladen: ${n.customers} Kunden, ${n.bikes} Fahrräder, ${n.sessions} Fittings ergänzt`); save(); render();
  toast(`Ergänzt: ${n.customers} Kunden, ${n.bikes} Fahrräder, ${n.sessions} Fittings`);
}

    else { s.check=s.check||{}; (it.side?['L','R']:['']).forEach(sd=>{ const v=data.get(it.k+sd); if(v===null||v==='') delete s.check[it.k+sd]; else s.check[it.k+sd]=it.type==='num'?Number(v):v; });
      const ch=s.check;
      if(it.k==='hamstring'&&ch.hamstring!==undefined) c.flex.hamstring=ch.hamstring>10?`eingeschränkt (Finger-Boden ${ch.hamstring} cm)`:`unauffällig (Finger-Boden ${ch.hamstring} cm)`;
      if(it.k==='hipFlex') c.flex.hip=[ch.hipFlexL&&'links '+ch.hipFlexL,ch.hipFlexR&&'rechts '+ch.hipFlexR].filter(Boolean).join(', ');
      if(it.k==='ankle') c.flex.ankle=`Knie-zur-Wand L ${ch.ankleL??'–'} cm, R ${ch.ankleR??'–'} cm`;
      if(it.k==='sitBone'&&ch.sitBone){ c.body.sitBone=ch.sitBone; c.est=(c.est||[]).filter(x=>x!=='sitBone'); }
      audit(`Körpercheck: ${it.label} gespeichert`,s.id); }
    if(s.status==='geplant'||s.status==='eingetroffen') s.status='in Arbeit';
    save(); ui.wIdx=i+1<items.length?i+1:null; render(); window.scrollTo({top:0});
    if(ui.wIdx==null){ const n=checkFindings(s).filter(x=>x.lvl!=='ok').length; toast(n?`Körpercheck fertig – ${n} Punkte zum Beachten`:'Körpercheck fertig – keine Auffälligkeiten'); } },
  consent(f,data){ const c=cust(f.dataset.id); if(String(data.get('name')).trim().toLowerCase()!==c.name.trim().toLowerCase()){ toast(`Bitte den Namen „${c.name}“ genau eintragen`,true); return; }
    c.consent=true; c.consentInfo={date:nowStamp(),health:data.get('health')==='on',version:'Muster 1'}; audit(`Einwilligung erfasst: ${c.name}${c.consentInfo.health?' inkl. Gesundheitsangaben':''}`); save(); closeDrawer(); render(); toast('Einwilligung gespeichert'); },
  bikeGeo(f,data){ const b=bike(f.dataset.id); const g=geoById(data.get('geo')); if(!g||!data.get('geoSize')){ toast('Bitte Modell und Größe wählen',true); return; } b.geo={id:g.id,size:data.get('geoSize')}; b.size=b.geo.size; S.sessions.filter(x=>x.bikeId===b.id&&x.status!=='abgeschlossen').forEach(applyMaker); audit(`Geometrie zugeordnet: ${b.brand} ${b.model} → ${g.brand} ${g.model} ${b.geo.size}`); save(); bikeDrawer(b.id); render(); toast('Geometrie zugeordnet'); },
  newGeo(f,data){ const id=uid('g'); S.geoCustom.push({id,brand:data.get('brand').trim(),model:data.get('model').trim(),year:data.get('year')?Number(data.get('year')):null,type:data.get('type'),src:data.get('src')||'',rows:[]}); audit(`Geometrie-Modell angelegt: ${data.get('brand')} ${data.get('model')}`); save(); render(); geoDrawer(id); },
  geoRow(f,data){ const g=S.geoCustom.find(x=>x.id===f.dataset.id); const row=GCOLS.map(c=>{ if(c==='size') return data.get('size').trim(); const v=data.get(c); return v===null||v===''?null:Number(v); }); g.rows=g.rows.filter(r=>String(r[0])!==row[0]); g.rows.push(row); save(); geoDrawer(g.id); render(); toast(`Größe ${row[0]} gespeichert`); },
  check(f,data){ const s=sess(f.dataset.id); const c=cust(s.customerId); const ch={};
    CHECKS.forEach(t=>(t.side?['L','R']:['']).forEach(sd=>{ const v=data.get(t.k+sd); if(v!==null&&v!=='') ch[t.k+sd]=t.type==='num'?Number(v):v; }));
    s.check=ch;
    if(ch.hamstring!==undefined) c.flex.hamstring=ch.hamstring>10?`eingeschränkt (Finger-Boden ${ch.hamstring} cm)`:`unauffällig (Finger-Boden ${ch.hamstring} cm)`;
    if(ch.hipFlexL||ch.hipFlexR) c.flex.hip=[ch.hipFlexL&&'links '+ch.hipFlexL,ch.hipFlexR&&'rechts '+ch.hipFlexR].filter(Boolean).join(', ');
    if(ch.ankleL||ch.ankleR) c.flex.ankle=`Knie-zur-Wand L ${ch.ankleL??'–'} cm, R ${ch.ankleR??'–'} cm`;
    if(ch.sitBone){ c.body.sitBone=ch.sitBone; c.est=(c.est||[]).filter(x=>x!=='sitBone'); }
    if(s.status==='geplant'||s.status==='eingetroffen') s.status='in Arbeit';
    const n=checkFindings(s).filter(x=>x.lvl!=='ok').length; audit(`Körpercheck gespeichert: ${Object.keys(ch).length} Ergebnisse, ${n} Auffälligkeiten`,s.id); save(); render(); window.scrollTo({top:0,behavior:'smooth'}); toast(n?`${n} Punkte gefunden – siehe Ergebnis`:'Keine Auffälligkeiten gefunden'); },
  body(f,data){ const c=cust(f.dataset.id); c.est=c.est||[]; BODY.forEach(([k])=>{ const v=data.get(k); const nv=v===''?null:Number(v); if(nv!==c.body[k]) c.est=c.est.filter(x=>x!==k); c.body[k]=nv; }); ['hamstring','hip','ankle'].forEach(k=>c.flex[k]=data.get(k)); audit(`Körpermaße aktualisiert: ${c.name}`); save(); toast('Körpermaße gespeichert'); if(f.dataset.ctx!=='session') customerDrawer(c.id); render(); },
  anamnesis(f,data){ const s=sess(f.dataset.id); Object.keys(s.anamnesis).forEach(k=>{ if(data.has(k)) s.anamnesis[k]=data.get(k).trim(); }); s.notes=data.get('notes'); audit('Anamnese gespeichert',s.id); save(); render(); toast('Anamnese gespeichert'); },
  measure(f,data){ const s=sess(f.dataset.id); const k=data.get('key'); const v=parseFloat(String(data.get('value')).replace(',','.')); if(isNaN(v)){toast('Bitte einen Zahlenwert eingeben',true);return;}
    const old=s.before[k]; const unc=data.get('unc'); ui.editMaker=null; s.before[k]={key:k,value:v,method:data.get('method'),source:(old&&old.source==='vom Hersteller'&&Number(old.value)===v)?'vom Hersteller':data.get('method')==='Herstellerangabe'?'manuell eingegeben':data.get('source'),unc:unc===''?null:Number(unc),time:nowStamp()};
    if(s.status==='geplant'||s.status==='eingetroffen') s.status='in Arbeit';
    { const rg=measureRange(k,cust(s.customerId),bike(s.bikeId)); if(rg&&rg.lo!=null&&(v<rg.lo||v>rg.hi)) setTimeout(()=>toast(`${MK[k].label} liegt außerhalb von ${fmtNum(rg.lo)}–${fmtNum(rg.hi)} ${rg.unit} – bitte nachmessen`,true),50); }
    audit(old?`Ausgangswert korrigiert: ${MK[k].label} ${fmtNum(old.value)} → ${fmtNum(v)} ${MK[k].unit}`:`Ausgangswert erfasst: ${MK[k].label} ${fmtNum(v)} ${MK[k].unit}`,s.id); save();
    if(f.dataset.wiz){ const j=Number(f.dataset.i); ui.wIdx=j+1<MEASURE_NOW.length?j+1:null; render(); window.scrollTo({top:0}); if(ui.wIdx==null) toast('Alle Pflichtwerte erfasst'); else setTimeout(()=>{ const nx=document.querySelector('#wizForm input.num'); if(nx&&!nx.value) nx.focus({preventScroll:true}); },50); return; }
    render();
    const nextK=MEASURE_NOW.find(x=>!s.before[x]); const nx=nextK&&document.getElementById('mc_'+nextK);
    if(nx){ nx.closest('section').scrollIntoView({behavior:'smooth',block:'start'}); setTimeout(()=>nx.focus({preventScroll:true}),350); toast(`${MK[k].label} gespeichert – weiter mit ${MK[nextK].label}`); }
    else if(!old&&MEASURE_NOW.includes(k)){ const sn=document.querySelector('.stepnav'); if(sn) sn.scrollIntoView({behavior:'smooth',block:'end'}); toast('Alle 5 Pflichtwerte erfasst – weiter mit „Anpassen“'); }
    else toast(`${MK[k].label} gespeichert`); },
  change(f,data){ ui.prepKey=null; const s=sess(f.dataset.id); const k=data.get('key'); const v=parseFloat(String(data.get('value')).replace(',','.')); const reason=String(data.get('reason')||'').trim();
    if(isNaN(v)){toast('Bitte einen Zahlenwert eingeben',true);return;} if(!reason){toast('Bitte eine Begründung angeben',true);return;}
    const from=s.after[k]?s.after[k].value:(s.before[k]?s.before[k].value:null);
    const unc=data.get('unc'); s.after[k]={key:k,value:v,method:data.get('method'),source:data.get('source'),unc:unc===''?null:Number(unc),time:nowStamp()};
    s.changes.push({key:k,from,to:v,reason,time:nowStamp()}); if(s.status!=='abgeschlossen') s.status='in Arbeit'; else s.version++;
    audit(`${MK[k].label}: ${fmtNum(from)} → ${fmtNum(v)} ${MK[k].unit}${s.status==='abgeschlossen'?` (neue Version ${s.version})`:''}`,s.id); save(); render(); toast(from==null?'Änderung dokumentiert – kein Ausgangswert vorhanden':'Änderung dokumentiert'); },
  newSession(f,data){ const id=createSession({cid:data.get('cid'),bid:data.get('bid'),date:data.get('date'),time:data.get('time'),type:data.get('type'),fitter:data.get('fitter'),copy:data.get('copy')==='on'}); save(); closeDrawer(); ui.sess=id; ui.sessTab='anamnese'; go('sitzung'); toast('Sitzung angelegt'); },
  followup(f,data){ const s=sess(data.get('sid')); const days=Number(data.get('days')); const due=new Date(s.date+'T12:00'); due.setDate(due.getDate()+days); s.followUps.push({days,due:iso(due),status:'offen'}); audit(`Nachkontrolle (${days} Tage) angelegt`,s.id); save(); render(); toast(`Nachkontrolle für ${fmtDate(iso(due))} angelegt`); },
  feedback(f,data){ const s=sess(f.dataset.id); s.feedback.push({date:today(),score:Number(data.get('score')),text:String(data.get('text')).trim()}); if(data.get('done')==='on') s.followUps[Number(f.dataset.i)].status='erledigt'; audit(`Rückmeldung erfasst (${data.get('score')}/10)`,s.id); save(); closeDrawer(); render(); toast('Rückmeldung gespeichert'); },
  cleatTransfer(f,data){ const s=sess(data.get('sid')); const fore=parseFloat(data.get('fore')); const rot=data.get('rot');
    s.before.cleatFore=s.before.cleatFore||{...mv('cleatFore',fore,'CleatLab (Prototyp, nicht validiert)','manuell eingegeben',null),time:nowStamp()};
    if(s.before.cleatFore.value!==fore){ s.after.cleatFore={...mv('cleatFore',fore,'CleatLab (Prototyp, nicht validiert)','manuell eingegeben',null),time:nowStamp()}; }
    if(rot!==''){ s.after.cleatRotR={...mv('cleatRotR',Number(rot),'CleatLab (Prototyp, nicht validiert)','manuell eingegeben',null),time:nowStamp()}; }
    audit(`CleatLab-Werte übergeben (${ui.cleatSys}, nicht validiert)`,s.id); save(); toast(`An Sitzung von ${cust(s.customerId).name} übergeben`); render(); },
  message(f,data){ const t=String(data.get('text')).trim(); if(!t) return; (S.messages[f.dataset.id]=S.messages[f.dataset.id]||[]).push({from:'Kunde',time:nowStamp(),text:t}); save(); render(); toast('Nachricht gespeichert (kein echter Versand)'); },
  customer(f,data){ const id=uid('c'); const num=k=>{const v=data.get(k);return v===''||v===null?null:Number(v);}; const c={id,name:data.get('name').trim(),email:data.get('email'),phone:data.get('phone'),since:today(),discipline:data.get('discipline'),consent:data.get('consent')==='on',body:{height:num('height'),inseam:num('inseam'),torso:num('torso'),arm:num('arm'),shoulder:null,footL:num('footR'),footR:num('footR'),sitBone:null},flex:{hamstring:data.get('hamstring'),hip:'',ankle:''},tags:['Neu'],est:[]};
    if(data.get('est')==='on') estimateBody(c); S.customers.push(c); audit(`Kunde angelegt: ${c.name}`); save(); render(); customerDrawer(id); toast('Kunde angelegt – jetzt Fahrrad anlegen'); },
  bike(f,data){ const id=uid('b'); const cid=f.dataset.cid; const gid=data.get('geo'), gs=data.get('geoSize'); S.bikes.push({id,customerId:cid,name:data.get('model'),brand:data.get('brand'),model:data.get('model'),geo:gid&&gs?{id:gid,size:gs}:null,size:gid&&gs?gs:data.get('size'),year:new Date().getFullYear(),type:data.get('type'),frameNo:data.get('frameNo')||'–',pedal:data.get('pedal'),saddle:'–',km:0}); audit(`Fahrrad angelegt: ${data.get('brand')} ${data.get('model')}`); save(); customerDrawer(cid); render(); toast('Fahrrad angelegt'); },
  woPos(f,data){ const w=S.workshop.find(x=>x.id===f.dataset.id); const price=Number(data.get('price')), qty=Number(data.get('qty')); if(!(price>=0)||!(qty>0)){toast('Menge und Preis prüfen',true);return;} w.positions.push({t:data.get('t'),kind:data.get('kind'),qty,price}); if(w.status==='Angenommen') w.status='Kostenvoranschlag'; w.log.push({time:nowStamp(),text:`Position hinzugefügt: ${data.get('t')}`}); save(); woDrawer(w.id); render(); },
  newWO(f,data){ const b=bike(data.get('bid')); const n=Math.max(...S.workshop.map(w=>Number(w.id.split('-')[1])))+1; const id='WO-'+n; S.workshop.unshift({id,customerId:b.customerId,bikeId:b.id,title:data.get('title'),status:'Angenommen',created:today(),due:data.get('due'),mechanic:data.get('mechanic'),positions:[],log:[{time:nowStamp(),text:'Auftrag angenommen'}],approval:null}); audit(`Werkstattauftrag ${id} angelegt`); save(); render(); woDrawer(id); toast(`${id} angelegt`); },
  item(f,data){ const sku=f.dataset.sku; const rec={sku:data.get('sku').trim(),name:data.get('name').trim(),cat:data.get('cat'),loc:data.get('loc'),stock:Number(data.get('stock')),min:Number(data.get('min')),price:Number(data.get('price'))};
    if(!sku&&S.inventory.some(i=>i.sku===rec.sku)){toast('Diese Artikelnummer gibt es schon',true);return;}
    if(sku){ Object.assign(S.inventory.find(i=>i.sku===sku),rec); audit(`Artikel bearbeitet: ${rec.name}`);} else { S.inventory.push(rec); audit(`Artikel angelegt: ${rec.name}`);} save(); closeDrawer(); render(); toast('Artikel gespeichert'); }
};

const CHG = {
  scanFile(el){ const f=el.files&&el.files[0]; if(!f) return; const url=URL.createObjectURL(f); const img=new Image(); img.onload=()=>{ scanImg[scan.view]=img; scan.src[scan.view]=url; scan.pts[scan.view]={}; scanDrawer(); toast('Foto geladen – tippe zuerst den Scheitel an'); }; img.onerror=()=>toast('Foto konnte nicht geladen werden',true); img.src=url; },
  vidFile(el){ const f=el.files&&el.files[0]; if(!f) return; vidMedia(); if(vid.src) try{ URL.revokeObjectURL(vid.src); }catch(e){}
    vid.src=URL.createObjectURL(f); vid.kind=f.type.startsWith('image')?'image':'video'; vid.pts=[]; vid.t=0;
    if(vid.kind==='image') imgEl.src=vid.src; else { vidEl.src=vid.src; vidEl.load(); } render(); toast(vid.kind==='image'?'Foto geladen – jetzt Punkte antippen':'Video geladen – an die richtige Stelle schieben, dann Punkte antippen'); },
  importFile(el){ const f=el.files&&el.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>importJson(String(r.result)); r.onerror=()=>toast('Datei konnte nicht gelesen werden',true); r.readAsText(f); },
  geoPick(el){ const sel=document.getElementById(el.dataset.size); const wrap=document.getElementById(el.dataset.size+'_wrap'); const g=geoById(el.value);
    if(sel){ sel.innerHTML=geoSizeOptions(el.value,''); } if(wrap) wrap.hidden=!g;
    if(el.dataset.fill&&g){ document.getElementById('nb_b').value=g.brand; document.getElementById('nb_m').value=g.model; document.getElementById('nb_t').value=g.type; const sw=document.getElementById('nb_s_wrap'); if(sw) sw.hidden=true; }
    if(el.dataset.fill&&!g){ const sw=document.getElementById('nb_s_wrap'); if(sw) sw.hidden=false; } },
  advGeo(el){ ui.advGeo=el.value; render(); },
  compDone(el){ const s=sess(el.dataset.id); const cp=s.comp[Number(el.dataset.i)]; cp.status=el.checked?'umgesetzt':'geplant'; audit(`Ausgleich ${cp.status}: ${cp.t}`,s.id); save(); render(); },
  sessStatus(el){ const s=sess(el.dataset.id); const old=s.status; s.status=el.value; if(el.value==='abgeschlossen'&&!s.followUps.length){ const due=new Date(s.date+'T12:00'); due.setDate(due.getDate()+30); s.followUps.push({days:30,due:iso(due),status:'offen'}); toast('Abgeschlossen – Nachkontrolle in 30 Tagen angelegt'); } else toast(`Status: ${el.value}`); audit(`Status ${cust(s.customerId).name}: ${old} → ${el.value}`,s.id); save(); render(); },
  pickSession(el){ ui.wIdx=null; ui.sess=el.value; ui.advGeo=null; vid.pts=[]; render(); },
  onlyChanged(el){ ui.cmpChanged=el.checked; render(); },
  share(el){ S.shared[el.dataset.id]=el.checked; audit(`Bericht ${el.checked?'im Portal freigegeben':'Freigabe entzogen'}`,el.dataset.id); save(); toast(el.checked?'Im Kundenportal sichtbar':'Nicht mehr im Kundenportal sichtbar'); },
  cmpA(el){ ui.cmpA=el.value; render(); }, cmpB(el){ ui.cmpB=el.value; render(); },
  motionSess(el){ ui.motionSess=el.value; motion.range=null; render(); },
  aiSess(el){ ui.aiSess=el.value; ui.aiOut=null; render(); },
  portalCust(el){ ui.portalCust=el.value; render(); },
  invCat(el){ ui.invCat=el.value; render(); },
  saleStatus(el){ const x=S.sales.find(s=>s.id===el.dataset.id); audit(`${x.id}: ${x.status} → ${el.value}`); x.status=el.value; save(); render(); toast('Status gespeichert'); },
  warrStatus(el){ const x=S.warranty.find(s=>s.id===el.dataset.id); audit(`${x.id}: ${x.status} → ${el.value}`); x.status=el.value; save(); toast('Status gespeichert'); },
  nsCust(el){ const sel=document.getElementById('ns_b'); sel.innerHTML=bikesOf(el.value).map(b=>`<option value="${b.id}">${esc(b.brand+' '+b.model)}</option>`).join('')||'<option value="">Kein Fahrrad – bitte zuerst anlegen</option>'; }
};

document.addEventListener('click',e=>{
  const nav=e.target.closest('[data-nav]'); if(nav){ e.preventDefault(); closeDrawer(); go(nav.dataset.nav); return; }
  const a=e.target.closest('[data-act]'); if(a&&ACT[a.dataset.act]){ e.preventDefault(); try{ ACT[a.dataset.act](a); }catch(err){ console.error(err); toast('Aktion fehlgeschlagen: '+err.message,true); } }
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]'); if(!f) return; e.preventDefault();
  if(f.dataset.form==='newSession' && !new FormData(f).get('bid')){ toast('Bitte zuerst ein Fahrrad für diesen Kunden anlegen',true); return; }
  try{ FORMS[f.dataset.form](f,new FormData(f)); }catch(err){ console.error(err); toast('Speichern fehlgeschlagen: '+err.message,true); }
});
document.addEventListener('change',e=>{ const el=e.target.closest('[data-change]'); if(el&&CHG[el.dataset.change]){ try{ CHG[el.dataset.change](el); }catch(err){ console.error(err); toast('Fehler: '+err.message,true);} } });
document.addEventListener('input',e=>{ if(e.target&&e.target.dataset&&e.target.dataset.lo!==undefined) liveRange(e.target); const el=e.target.closest('[data-input]'); if(!el) return; ui[el.dataset.input]=el.value; ui.focus=el.id; render(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeDrawer(); closeMenu(); } });

applyTheme();
const start=(location.hash||'').slice(1);
go(VIEWS[start]?start:'dashboard');
window.__fitframe={scan,scanCalc,SCAN,GEO,IL,measureRange,rangeFor,S:()=>S,ui,go,ACT,VIEWS,quality,sizeAdvice,geoById,sess};
})();
</script>
