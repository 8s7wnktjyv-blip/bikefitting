const frameNorm=v=>String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
async function frameHash(v){ const n=frameNorm(v); const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('fyf:'+n)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }

async function ownerCall(code,action,value){ const r=await fetch(CFG.u+'/rest/v1/rpc/pass_owner',{method:'POST',headers:{apikey:CFG.k,'Content-Type':'application/json'},body:JSON.stringify({p_code:code,p_transfer:OWN,p_action:action,p_value:value||null})}); if(!r.ok) throw new Error('net'); return r.json(); }

const SVC_KEYS=[['chain',/kette/i],['brake',/brems(bel|klotz)|belag|beläge/i],['tire',/reifen|mantel|schlauch|tubeless/i],['bleed',/entlüft|bremsflüss|mineralöl|dot[- ]?\d/i],['milk',/milch|dichtmittel/i],['fork',/gabel/i],['shock',/dämpfer/i],['esw',/software|firmware|update|diagnose|fehlerspeicher/i],['ebat',/akku/i]];
const PART_KEYS=[['chain',/kette(?!nblatt)/i],['cassette',/kassette|ritzel/i],['chainring',/kettenblatt/i],['pads',/brems(bel|klotz)|belag|beläge/i],['rotors',/bremsscheibe/i],['brakes',/bremse(?!n?bel)|bremssattel|bremshebel/i],['tires',/reifen|mantel/i],['wheels',/laufrad|felge/i],['saddle',/sattel(?!stütze)/i],['post',/sattelstütze|dropper/i],['bar',/lenker(?!band)/i],['stem',/vorbau/i],['pedals',/pedal/i],['rd',/schaltwerk/i],['fd',/umwerfer/i],['shifters',/schalthebel|schaltgriff|bremsschalthebel/i],['crankset',/kurbel(?!länge)/i],['bb',/innenlager|tretlager/i],['groupset',/schaltgruppe/i],['fork',/gabel/i],['shock',/dämpfer/i]];
const SHOP_PART_MAP={material:'material',groupset:'groupset',crank:'crank',bar:'bar',stem:'stem',saddleWidth:'saddle',post:'post',cleats:'cleats'};
function shopData(code){ const P=Pof(code), b=P.bike||{}; const E=(P.entries||[]).filter(e=>!e.x&&e.kind!=='Registrierung'&&!/diebstahl/i.test(e.kind||'')); const fixed=new Set(E.filter(e=>e.corrects).map(e=>e.corrects)); const L=E.filter(e=>!fixed.has(e.id));
  const svc={}, parts={}, newParts=[]; let km=dnum(b.km)||0;
  const mark=(k,e)=>{ if(!e.date) return; if(!svc[k]||String(e.date)>svc[k].d) svc[k]={d:String(e.date).slice(0,10),km:e.km??null,src:e.trust==='self'?'Selbstauskunft':(e.shop||'Werkstatt')}; };
  L.forEach(e=>{ const t=`${e.kind||''} ${e.text||''}`; if(e.km!=null) km=Math.max(km,Number(e.km)||0);
    if(/inspektion|jahresservice|wartung|^service/i.test(e.kind||'')||/inspektion|jahresservice|großer service/i.test(e.text||'')){ mark('insp',e); } // nur die Inspektion selbst – Einzelarbeiten zählen nur, wenn sie ausdrücklich im Eintrag stehen
    SVC_KEYS.forEach(([k,re])=>{ if(re.test(t)) mark(k,e); });
    const m=/Neue Teile:\s*(.+)$/i.exec(e.text||''); if(m) m[1].split(/,\s*/).forEach(raw=>{ const v=raw.replace(/^\d+×\s*/,'').trim(); if(!v) return; newParts.push({d:e.date,v,shop:e.shop}); const pk=(PART_KEYS.find(([k,re])=>re.test(v))||[])[0]; if(pk&&(!parts[pk]||String(e.date)>=parts[pk].d)) parts[pk]={v,d:String(e.date).slice(0,10),src:e.shop||'Werkstatt'}; }); });
  (P.checks||[]).forEach(c=>{ if(c.km!=null) km=Math.max(km,Number(c.km)||0); });
  const bp=b.parts||{}, pd=String(P.updated_at||P.created_at||'').slice(0,10)||'0000-00-00'; Object.entries(bp).forEach(([k,v])=>{ const f=SHOP_PART_MAP[k]; if(f&&v&&!parts[f]) parts[f]={v:String(v),d:pd,src:(P.shop&&P.shop.name)||'Werkstatt'}; });
  const bat=(P.checks||[]).filter(c=>c.bat!=null||c.cycles!=null).map(c=>({d:c.date,h:c.bat!=null?String(c.bat):'',c:c.cycles!=null?String(c.cycles):'',src:'Werkstatt-Check'}));
  return {svc,parts,newParts:newParts.sort((a,c)=>String(c.d).localeCompare(String(a.d))),km:km||null,bat}; }
// Ausstattung: Werkstatt-Wert gilt, außer der Besitzer hat das Feld danach selbst geändert
function effParts(code){ const x=X(code), own=x.parts||{}, at=x.partsAt||{}, S=shopData(code), out={}, src={};
  Object.entries(S.parts).forEach(([k,o])=>{ out[k]=o.v; src[k]=o; });
  Object.entries(own).forEach(([k,v])=>{ if(!v) return; if(!S.parts[k]||(at[k]||'0000')>=S.parts[k].d||!at[k]&&!S.parts[k]) { out[k]=v; delete src[k]; } else if(!at[k]&&S.parts[k]){ /* alter Eintrag ohne Datum: Werkstatt ist neuer */ } });
  return {v:out,src}; }

function svcState(code){ const type=bikeType(code), x=X(code), SD=shopData(code).svc, done={}; Object.entries(x.svc||{}).forEach(([k,v])=>{ done[k]={...v,src:v.src||'von dir als erledigt eingetragen'}; }); Object.entries(SD).forEach(([k,v])=>{ if(!done[k]||String(v.d)>String(done[k].d)) done[k]=v; }); const _d=done, km=curKm(code), start=(mine().find(m=>m.code===code)||{}).at||today();
  return svcPlan(type,code).map(it=>{ const d=done[it.k]||{}; const base=d.d||start; const due=addMonths(base,it.m); const days=Math.round((new Date(due)-new Date(today()))/864e5);

    const st=(days<0||(kmLeft!=null&&kmLeft<=0))?'due':(days<=30||(kmLeft!=null&&kmLeft<=it.km*.15))?'soon':'ok';
    return {...it,last:d.d||null,lastKm:d.km??null,src:d.src||'',due,days,kmLeft,st}; }); }

function fitFromPass(code){ const P=Pof(code); const e=(P.entries||[]).filter(x=>/fitting/i.test(x.kind||'')&&/Sitzposition/.test(x.text||'')).sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0]; if(!e) return null;

    const get=()=>{ const o={}; FITK.forEach(([k])=>{ const v=dnum(val(r,'fk_'+k)); if(v!=null) o[k]=v; }); return o; };
    const ms=r.querySelector('#fpSheet'); if(ms) ms.onclick=()=>{ const V=pf.vals, mm=k=>V[k]!=null?f1(V[k],0)+' mm':null, X=pf.ex||{}; const w=docWin(); w.document.write(fyfSheetDoc({shop:pf.shop||'',name:bikeName(code),date:fd(pf.date),v:{sh:mm('saddleHeight'),hood:mm('saddleToHood'),reach:mm('reach'),drop:mm('drop'),sb:mm('saddleSetback')},rows:FITX.map(([k,l])=>[l==='Sattel'?'Sattel Modell':l,X[k]||null]),sec2:[['Vorbaulänge',mm('stemLength')],['Lenkerbreite',mm('barWidth')],['Kurbellänge',V.crankLength!=null?f1(V.crankLength,1)+' mm':null],['Cleat längs',mm('cleatFore')]].filter(x=>x[1]),foot:'Aus deinem Fahrradpass. Werte vom Bikefitting, in mm. Körpermaße stehen nur auf dem Blatt aus dem Laden.'})); w.document.close(); };

       <button class="btn block" id="suSave" type="button" style="margin-top:12px">Setup speichern</button>
       ${(s.log||[]).length?`<div style="margin-top:12px">${s.log.slice().reverse().map((l,i)=>`<div class="e"><div style="display:flex;justify-content:space-between"><b>${fd(l.d)}</b><button class="linkbtn" data-del="${s.log.length-1-i}" type="button">Löschen</button></div><div class="small">Gabel ${esc(l.fp||'–')} psi · Zug ${esc(l.fr||'–')}${l.fc?' · '+esc(l.fc):''}${full?` · Dämpfer ${esc(l.sp||'–')} psi · Zug ${esc(l.sr||'–')}${l.sc?' · '+esc(l.sc):''}`:''}</div>${l.n?`<div class="muted small">${esc(l.n)}</div>`:''}</div>`).join('')}</div>`:''}</div>
      <details class="more"><summary>Zug- und Druckstufe einstellen</summary><div class="small"><p style="margin:0 0 6px"><b>Zugstufe (rot, Rebound):</b> Start in der Mitte. So schnell wie möglich, ohne dass das Rad nach Kanten „kickt“. Gabel und Dämpfer ähnlich schnell.</p><p style="margin:0 0 6px"><b>Druckstufe (blau):</b> Start offen. Bei Wegsacken in Kurven/Bremsen 1–2 Klicks zu.</p><p style="margin:0"><b>Tokens:</b> Nutzt du ständig den ganzen Federweg → Token rein. Nie ganz → Token raus.</p></div></details>

// Richtwert-Tabelle: Hinterrad-Druck in bar bei 85 kg Systemgewicht (Fahrer + Rad), Schlauch, Asphalt bzw. (ab 50 mm) Trail
const TP=[[23,7],[25,6.3],[28,5.4],[30,4.9],[32,4.4],[35,3.8],[38,3.2],[40,2.9],[42,2.7],[45,2.4],[47,2.25],[50,2.05],[55,1.85],[57,1.78],[60,1.68],[64,1.58],[66,1.52],[70,1.42],[76,1.3]];
const tpBase=w=>{ if(w<=TP[0][0]) return TP[0][1]; for(let i=1;i<TP.length;i++){ if(w<=TP[i][0]){ const [a,pa]=TP[i-1],[b,pb]=TP[i]; return pa+(pb-pa)*(w-a)/(b-a); } } return TP[TP.length-1][1]; };
function tireDefaults(type){ const t=type||''; if(/zeitfahr|rennrad/i.test(t)) return {w:28,bk:8}; if(/gravel|cyclocross/i.test(t)) return {w:/cyclo/i.test(t)?33:40,bk:/e-/i.test(t)?14:9}; if(/e-mtb/i.test(t)) return {w:63,bk:24}; if(/mtb/i.test(t)) return {w:61,bk:/fully/i.test(t)?14:12}; if(/lasten/i.test(t)) return {w:55,bk:35}; if(/e-bike|e-renn/i.test(t)) return {w:50,bk:25}; if(/kinder/i.test(t)) return {w:50,bk:9}; if(/falt/i.test(t)) return {w:35,bk:12}; if(/bmx/i.test(t)) return {w:55,bk:11}; return {w:42,bk:16}; }
function tireCalc(o){ const sys=(o.kg||0)+(o.bk||0); if(!sys||!o.w) return null; let p=tpBase(o.w)*Math.pow(sys/85,.92);
  const sf=o.w>=50?{asph:1.1,mix:1.03,grav:1,trail:1,wet:.95}[o.s]:{asph:1,mix:.93,grav:.87,trail:.82,wet:.93}[o.s]; p*=sf||1; if(o.tl) p*=.93;
  let rear=p, front=p*.92; const minP=o.w>=55?1.0:1.3; rear=Math.max(minP,rear); front=Math.max(minP,front); if(o.hk){ rear=Math.min(5,rear); front=Math.min(5,front); } return {rear,front}; }
function toolTire(code){ page('Reifendruck','',(r)=>{ const type=bikeType(code), d=tireDefaults(type), t={w:d.w,bk:d.bk,s:/mtb|enduro|downhill/i.test(type)?'trail':/gravel|cross/i.test(type)?'grav':'asph',...(X(code).tire||{})};
  r.innerHTML=`<div class="card">${inp('tkg','Fahrergewicht mit Ausrüstung (kg)',t.kg,'inputmode="decimal" placeholder="z. B. 80"')}${inp('tbk','Gewicht Rad (kg)',t.bk,'inputmode="decimal"')}${inp('tw','Reifenbreite (mm)',t.w,'inputmode="numeric"')}<p class="muted small" style="margin:4px 0 0">Steht auf dem Reifen, z. B. 40-622 → 40 mm; 2.4" ≈ 61 mm.</p>
   ${sel('ts','Untergrund',[['asph','Asphalt'],['mix','Gemischt'],['grav','Schotter'],['trail','Trail / Wurzeln'],['wet','Nass']],t.s)}
   <label style="display:flex;gap:10px;align-items:center;margin:14px 0 0"><input type="checkbox" id="ttl" ${t.tl?'checked':''} style="width:auto"> Tubeless (ohne Schlauch)</label><label style="display:flex;gap:10px;align-items:center;margin:10px 0 0"><input type="checkbox" id="thk" ${t.hk?'checked':''} style="width:auto"> Hookless-Felge (max. 5 bar)</label></div>
   <div class="card tireout" id="tout"></div><p class="muted small" style="margin:8px 2px">Startwert. Mindest- und Höchstdruck auf Reifen und Felge beachten. Bei Durchschlägen oder schwammigem Fahrgefühl 0,1–0,2 bar mehr.</p>`;
  const upd=()=>{ const o={kg:dnum(val(r,'tkg')),bk:dnum(val(r,'tbk')),w:dnum(val(r,'tw')),s:val(r,'ts'),tl:r.querySelector('#ttl').checked,hk:r.querySelector('#thk').checked}; Xup(code,'tire',o); const c=tireCalc(o);
    r.querySelector('#tout').innerHTML=c?`<div class="tp2"><div><div class="l">Vorne</div><div class="v">${f1(c.front)}<small> bar</small></div><div class="muted small">${Math.round(c.front*14.504)} psi</div></div><div><div class="l">Hinten</div><div class="v">${f1(c.rear)}<small> bar</small></div><div class="muted small">${Math.round(c.rear*14.504)} psi</div></div></div>`:'<p class="muted" style="margin:0">Gewicht eintragen.</p>'; };
  r.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',upd)); r.querySelectorAll('select,input[type=checkbox]').forEach(e=>e.addEventListener('change',upd)); upd(); }); }

function specParse(txt){ const lines=String(txt||'').split(/\r?\n/).map(l=>l.replace(/\t+/g,': ').replace(/[ \u00a0]+/g,' ').trim()).filter(Boolean), out={};

  for(let i=0;i<lines.length;i++){ const l=lines[i]; let m=/^([^:\t]{2,40})[:\t]\s*(.+)$/.exec(l); if(!m) m=/^(.{2,40}?)\s{2,}(.+)$/.exec(l);
    if(m){ const k=lab(m[1].trim()); if(k&&!out[k]&&m[2].trim().length>1){ out[k]=m[2].trim().slice(0,120); continue; } }
    const k=lab(l.replace(/:$/,'')); if(k&&l.replace(/:$/,'').split(' ').length<=4&&!out[k]&&lines[i+1]&&!lab(lines[i+1])){ out[k]=lines[i+1].slice(0,120); i++; } }

/* ===== v.95 FYF Zustandsbericht (Bike Health Score) – nur aus dokumentierten Daten, Unbekanntes bleibt unbekannt ===== */
function healthReport(code){ const P=Pof(code), b=P.bike||{}, mineIt=mine().some(m=>m.code===code), type=bikeType(code)||b.type||'', SD=shopData(code), F=[]; const days=d=>d?Math.round((Date.now()-new Date(d))/864e5):null;
  const E=(P.entries||[]).filter(e=>e.kind!=='Registrierung');
  // 1 Inspektion
  const ins=SD.svc.insp; const di=ins?days(ins.d):null;
  F.push(['Inspektion',ins?(di<=400?'ok':di<=760?'warn':'bad'):'unk',ins?`Letzte Inspektion ${fd(ins.d)} (${ins.src})${di>400?' – älter als ein Jahr':''}.`:'Keine Inspektion dokumentiert.']);
  // 2 Wartungsplan (nur Besitzer, nutzt auch eigene Einträge)
  if(mineIt){ const S=svcSummary(code); F.push(['Wartungsplan',S.due.length>=2?'bad':S.due.length||S.soon.length?'warn':'ok',S.due.length?`Fällig: ${S.due.map(i=>i.t).slice(0,3).join(', ')}.`:S.soon.length?`Bald fällig: ${S.soon.map(i=>i.t).slice(0,3).join(', ')}.`:'Alle Punkte im Plan (Richtwerte).']); }
  // 3 Verschleiß gemessen (Kette, Gebrauchtrad-Check)
  const chk=(P.checks||[]).find(c=>c.chain!=null)||null; const ch=chk?Number(chk.chain):null;
  F.push(['Verschleiß (Kette)',chk?(ch<0.5?'ok':ch<0.75?'warn':'bad'):'unk',chk?`Kettenlängung ${String(ch).replace('.',',')} % gemessen am ${fd(chk.date)}${ch>=0.75?' – tauschen':ch>=0.5?' – bald tauschen':''}.`:'Keine Verschleißmessung dokumentiert.']);
  // 4 Schäden
  const dmg=E.filter(e=>/schaden|unfall|sturz|riss/i.test(e.kind+' '+e.text)).sort((a,c)=>String(c.date).localeCompare(String(a.date)))[0];
  if(dmg){ const fixed=E.some(e=>/reparatur|werkstatt|inspektion/i.test(e.kind)&&String(e.date)>=String(dmg.date)&&e!==dmg); F.push(['Schäden',fixed?'ok':'bad',fixed?`Schaden vom ${fd(dmg.date)} – danach Werkstatt-/Reparatureintrag vorhanden.`:`Schaden vom ${fd(dmg.date)} ohne späteren Reparatureintrag.`]); }
  else F.push(['Schäden','info','Keine Schäden dokumentiert (heißt nicht, dass es keine gab).']);
  // 5 Akku (nur E-Bikes)
  if(isE(type)){ const lg=[...((X(code).eb||{}).log||[]).filter(()=>mineIt),...SD.bat].filter(l=>l.h!==''&&l.h!=null).sort((a,c)=>String(a.d).localeCompare(String(c.d))); const z=lg[lg.length-1]; const h=z?Number(z.h):null;
    F.push(['Akku',z?(h>=80?'ok':h>=60?'warn':'bad'):'unk',z?`Akku-Zustand ${h} % (${fd(z.d)}${z.src?', '+z.src:''}).`:'Kein Akku-Zustand dokumentiert.']); }
  // 6 Nachweise durch Werkstätten
  const ver=E.filter(e=>e.trust==='verified'&&days(e.date)<=760).length;
  F.push(['Werkstatt-Nachweise',ver?'ok':E.length?'warn':'unk',ver?`${ver} von Werkstätten bestätigte Einträge in den letzten 2 Jahren.`:E.length?'Nur Selbstauskünfte – keine Werkstattbestätigung.':'Noch keine Einträge.']);
  const W={ok:100,warn:60,bad:20}, known=F.filter(f=>W[f[1]]!=null); const score=known.length>=2?Math.round(known.reduce((s,f)=>s+W[f[1]],0)/known.length):null;
  return {F,score,known:known.length,total:F.filter(f=>f[1]!=='info').length,stolen:!!P.stolen}; }
function healthHtml(code){ const R=healthReport(code); const lab=s=>s>=85?'Sehr gut gepflegt':s>=65?'Gut gepflegt':s>=45?'Prüfen lassen':'Handlungsbedarf'; const col=s=>s>=85?'var(--ok)':s>=65?'#6aa84f':s>=45?'#e39b2d':'var(--bad)';

const ownGet=code=>{ try{ return localStorage.getItem('fyfpass:own:'+code)||''; }catch(e){ return ''; } };

async function rpc(name,body){ const r=await fetch(CFG.u+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:CFG.k,'Content-Type':'application/json'},body:JSON.stringify(body)}); if(r.status===404) { const e=new Error('missing'); e.missing=true; throw e; } if(!r.ok) throw new Error('net'); return r.json(); }

// ---------- QR-Scanner (Kamera, Foto oder Code tippen) ----------
function codeFromText(t){ t=String(t||'').trim(); let m=/[#&?]c=([A-Za-z0-9]{8})/.exec(t); if(m) return norm(m[1]); m=/\/([A-HJ-NP-Z2-9]{8})\/?$/i.exec(t.replace(/[?#].*$/,'')); if(m&&/^https?:/i.test(t)) return norm(m[1]); const n=norm(t); return /^[A-HJ-NP-Z2-9]{8}$/.test(n)?n:''; }
function loadJsQR(){ return window.jsQR?Promise.resolve():new Promise((ok,no)=>{ const s=document.createElement('script'); s.src=new URL('vendor/jsQR-1.4.0.js',location.href).href; s.onload=()=>window.jsQR?ok():no(); s.onerror=no; document.head.appendChild(s); }); }
async function makeDecoder(){ try{ if('BarcodeDetector' in window){ const f=await BarcodeDetector.getSupportedFormats(); if(f.includes('qr_code')){ const d=new BarcodeDetector({formats:['qr_code']}); return async cv=>{ const r=await d.detect(cv); return r[0]&&r[0].rawValue||''; }; } } }catch(e){}
  await loadJsQR(); return async cv=>{ const g=cv.getContext('2d',{willReadFrequently:true}), im=g.getImageData(0,0,cv.width,cv.height); const r=window.jsQR(im.data,cv.width,cv.height,{inversionAttempts:'attemptBoth'}); return r&&r.data||''; }; }
function frameFromText(t){ t=String(t||'').trim(); if(/^https?:/i.test(t)){ try{ const u=new URL(t); const q=['sn','serial','frame','framenumber','id'].map(k=>u.searchParams.get(k)).find(Boolean); t=q||u.pathname.split('/').filter(Boolean).pop()||''; }catch(e){ return ''; } } const n=frameNorm(t); return n.length>=6&&n.length<=30?n:''; }
async function frameLookup(fr){ const n=frameNorm(fr); let r=null; try{ r=await rpc('pass_find_frame',{p_fh:await frameHash(n)}); }catch(e){ if(!e.missing){ toast('Gerade nicht erreichbar'); return; } }
  if(r&&r.found){ location.hash='c='+r.code+(CF?'&cfg='+CF:''); return; }
  const el=document.createElement('div'); el.className='sheet'; el.innerHTML=`<div><div class="muted small" style="font-weight:700;letter-spacing:.14em">RAHMENNUMMER</div><div style="font:700 20px ui-monospace,Menlo,monospace;letter-spacing:.06em;margin:6px 0 10px">${esc(n)}</div>${r?`<p style="margin:0 0 6px"><b>Zu diesem Rad gibt es noch keinen FYF-Fahrradpass.</b></p><p class="muted small" style="margin:0 0 16px">Also auch keine Diebstahlmeldung in FYF – das ist kein Beweis, dass es nicht gestohlen ist.</p>`:`<p class="muted small" style="margin:0 0 16px">Die Suche nach Rahmennummer ist bald verfügbar.</p>`}<div style="display:grid;gap:10px"><button class="btn block" data-a="reg" type="button">Dieses Rad registrieren</button><button class="btn ghost block" data-a="x" type="button">Schließen</button></div></div>`;
  document.body.appendChild(el); el.onclick=e=>{ if(e.target===el) return el.remove(); const a=e.target.closest('[data-a]'); if(!a) return; el.remove(); if(a.dataset.a==='reg'){ tabs('meine'); regForm(); const f=document.getElementById('rf'); if(f) f.value=n; } }; }
function scanFound(txt,close){ const c=codeFromText(txt); if(!c){ const fr=frameFromText(txt); if(fr){ close(); try{ navigator.vibrate&&navigator.vibrate(40); }catch(e){} frameLookup(fr); return true; } toast('Kein FYF-Code und keine Rahmennummer erkannt'); return false; } close(); try{ navigator.vibrate&&navigator.vibrate(40); }catch(e){} location.hash='c='+c+(CF?'&cfg='+CF:''); return true; }
function qrScan(opt={}){ const el=document.createElement('div'); el.className='scanner'; el.innerHTML=`<video playsinline muted autoplay></video><div class="sc-frame"><i></i><i></i><i></i><i></i></div><div class="sc-top"><button class="btn ghost" data-a="x" type="button">Abbrechen</button></div><div class="sc-bot"><p class="sc-msg">${opt.frame?'QR-Code mit der Rahmennummer (unten am Tretlager) in den Rahmen halten':'FYF-Aufkleber oder Hersteller-QR am Rahmen in den Rahmen halten'}</p><div style="display:flex;gap:10px"><label class="btn ghost" style="flex:1">Foto statt Kamera<input type="file" accept="image/*" capture="environment" hidden></label><button class="btn ghost" data-a="type" type="button" style="flex:1">Code eintippen</button></div></div>`;
  document.body.appendChild(el); const v=el.querySelector('video'), msg=el.querySelector('.sc-msg'); let stream=null, stop=false, dec=null; const cv=document.createElement('canvas');
  const close=()=>{ stop=true; try{ stream&&stream.getTracks().forEach(t=>t.stop()); }catch(e){} el.remove(); };
  const handle=t=>{ if(opt.onText){ const r=opt.onText(t); if(r){ close(); return true; } toast('Keine Rahmennummer erkannt'); return false; } return scanFound(t,close); };
  el.querySelector('[data-a=x]').onclick=close; el.querySelector('[data-a=type]').onclick=()=>{ close(); if(!/pruefen/.test(location.hash)) location.hash=hashLink('pruefen'); setTimeout(()=>{ const i=document.getElementById('c'); if(i) i.focus(); },150); };
  el.querySelector('input[type=file]').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; msg.textContent='Bild wird gelesen …'; try{ dec=dec||await makeDecoder(); const img=await fileToImg(f); const sc=Math.min(1,1400/Math.max(img.width,img.height)); cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc); cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); const t=await dec(cv); if(!t||!handle(t)) msg.textContent='Kein passender QR-Code im Foto erkannt – näher ran oder eintippen.'; }catch(x){ msg.textContent='Scanner gerade nicht verfügbar – bitte Code eintippen.'; } };
  (async()=>{ try{ dec=await makeDecoder(); }catch(e){ msg.textContent='Scanner braucht Internet – bitte Code eintippen oder die Kamera-App nutzen.'; return; }
    if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){ msg.textContent='Kamera hier nicht verfügbar – „Foto statt Kamera“ oder Code eintippen.'; return; }
    try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false}); }catch(e){ msg.textContent='Kein Kamerazugriff. Erlauben in den Einstellungen – oder „Foto statt Kamera“ / Code eintippen.'; return; }
    if(stop){ stream.getTracks().forEach(t=>t.stop()); return; } v.srcObject=stream; try{ await v.play(); }catch(e){}
    let busy=false; const tick=async()=>{ if(stop) return; if(!busy&&v.videoWidth){ busy=true; const s=Math.min(1,720/Math.max(v.videoWidth,v.videoHeight)); cv.width=Math.round(v.videoWidth*s); cv.height=Math.round(v.videoHeight*s); cv.getContext('2d',{willReadFrequently:true}).drawImage(v,0,0,cv.width,cv.height); try{ const t=await dec(cv); if(t&&handle(t)) return; }catch(e){} busy=false; } setTimeout(tick,160); }; tick(); })(); }

// ---------- Pass-Vollständigkeit ----------
function passScore(code){ const x=X(code), p=effParts(code).v, e=x.eb||{}, P=Pof(code), b=P.bike||{}, type=bikeType(code), pf=fitFromPass(code);
  const L=[['photo','Foto vom Rad',!!photoGet(code),'photo'],['frame','Rahmennummer vollständig',!!p.frameFull,'parts'],['look','Farbe & Merkmale',!!(p.color||b.color)&&!!p.marks,'parts'],['receipt','Kaufbeleg',(x.docs||[]).some(d=>/Kaufbeleg Rad/.test(d.name)),'docs'],['km','Kilometerstand',!!(x.km||b.km),'svc'],['parts','Ausstattung (3+ Teile)',Object.keys(p).filter(k=>!['color','marks','frameFull','extra'].includes(k)).length>=3,'parts'],['fit','Sitzposition',!!((x.fit||{}).saddleHeight||pf),'fit'],['own','Besitzer-Code hinterlegt',!!ownGet(code),'own'],['backup','Sicherung (letzte 60 Tage)',(()=>{ const a=LS('fyfpass:backupAt'); return a&&(Date.now()-new Date(a))<60*864e5; })(),'backup']];
  if(isE(type)||e.m) L.push(['ebat','Akku-Seriennummer & Motor',!!(e.bs&&e.m),'eb']);
  const done=L.filter(l=>l[2]).length; return {pct:Math.round(done/L.length*100),L}; }
function scoreHtml(code){ const s=passScore(code); const miss=s.L.filter(l=>!l[2]);
  return `<div class="card score"><div style="display:flex;align-items:center;gap:14px"><div class="ring" style="--p:${s.pct}"><span>${s.pct}%</span></div><div style="flex:1"><b>${s.pct===100?'Pass vollständig':'Pass vollständig machen'}</b><div class="muted small">${s.pct===100?'Bestens vorbereitet für Diebstahl, Service und Verkauf.':'Je vollständiger, desto besser im Diebstahlfall und beim Verkauf.'}</div></div></div>${miss.length?`<div class="miss">${miss.map(l=>`<button class="chip" data-fix="${l[3]}" type="button">+ ${l[1]}</button>`).join('')}</div>`:''}</div>`; }
function bindScore(code){ document.querySelectorAll('[data-fix]').forEach(b=>b.onclick=()=>{ const k=b.dataset.fix; if(k==='photo') return photoMenu(code); if(k==='backup') return backupExport(); if(k==='own'){ const d=document.getElementById('ownd'); if(d){ d.open=true; d.scrollIntoView({behavior:'smooth',block:'start'}); } return; } const fn=TOOLFN[k]; if(fn) fn(code); }); }

// ---------- Sichern / Wiederherstellen ----------
async function backupExport(){ const ls={}; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith('fyfpass:')&&!k.startsWith('fyfpass:own:')&&k!=='fyfpass:intro') ls[k]=localStorage.getItem(k); } }catch(e){}
  const files={}; for(const m of mine()){ for(const d of (X(m.code).docs||[])){ if(!d.img) continue; try{ const bl=await IDB.get('doc:'+d.id); if(bl) files['doc:'+d.id]=await new Promise(ok=>{ const fr=new FileReader(); fr.onload=()=>ok(fr.result); fr.readAsDataURL(bl); }); }catch(e){} } }
  const data={format:'FYF-Garage-Sicherung',version:1,at:new Date().toISOString(),bikes:mine().length,ls,files}; const name='FYF-Garage-'+today()+'.json'; const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  LSset('fyfpass:backupAt',new Date().toISOString());
  try{ const f=new File([blob],name,{type:'application/json'}); if(navigator.canShare&&navigator.canShare({files:[f]})&&(ios()||android())){ await navigator.share({files:[f],title:'FYF Garage-Sicherung'}); toast('Sicherung erstellt'); return true; } }catch(e){ if(e&&e.name==='AbortError') return false; }
  const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); toast('Sicherung gespeichert'); return true; }
function backupImport(){ const i=document.createElement('input'); i.type='file'; i.accept='application/json,.json'; i.onchange=async()=>{ const f=i.files[0]; if(!f) return; let d; try{ d=JSON.parse(await f.text()); }catch(e){ return alert('Das ist keine FYF-Sicherung.'); }
    if(!d||d.format!=='FYF-Garage-Sicherung'||typeof d.ls!=='object') return alert('Das ist keine FYF-Sicherung.');
    if(!confirm(`Sicherung vom ${fd(d.at)} mit ${d.bikes||0} Rad/Rädern einspielen? Daten zu denselben Rädern werden ersetzt.`)) return;
    const cur=mine(); let imp=[]; try{ imp=JSON.parse(d.ls['fyfpass:mine']||'[]'); }catch(e){}
    for(const [k,v] of Object.entries(d.ls)){ if(!k.startsWith('fyfpass:')||k==='fyfpass:mine'||k.startsWith('fyfpass:own:')) continue; try{ localStorage.setItem(k,String(v)); }catch(e){ alert('Speicher voll – nicht alles konnte wiederhergestellt werden.'); break; } }
    LSset('fyfpass:mine',[...cur,...imp.filter(m=>m&&m.code&&!cur.some(c=>c.code===m.code))].slice(0,20));
    for(const [k,v] of Object.entries(d.files||{})){ try{ const bl=await (await fetch(v)).blob(); await IDB.put(k,bl); }catch(e){} }
    toast('Wiederhergestellt'); route(); }; i.click(); }

let GREF=0; async function garageRefresh(){ if(Date.now()-GREF<60000) return; GREF=Date.now(); for(const m of mine()){ try{ let p=null; const ot=ownGet(m.code); if(ot){ const o=await rpc('pass_get_owner',{p_code:m.code,p_transfer:ot}).catch(()=>null); if(o&&!o.error) p=o; } if(!p) p=await rpc('pass_get',{p_code:m.code}); if(p){ const old=cacheGet(m.code); if(!(p.limited&&old&&old.p&&!old.p.limited)) cacheSet(m.code,p); if(LS('fyfpass:seenE:'+m.code)==null&&!p.limited) LSset('fyfpass:seenE:'+m.code,(p.entries||[]).length); const el=document.querySelector(`[data-gc="${m.code}"]`); if(el) el.innerHTML=garageChips(m.code); const st=el&&el.parentNode.querySelector('.status'); if(st){ const [cls,txt]=bikeStatus(m.code); st.className='status '+cls; st.innerHTML='<i></i>'+esc(txt); } } }catch(e){} } }
function garageChips(code){ const c=cacheGet(code), P=(c&&c.p)||{}; const out=[]; const n=(P.entries||[]).length, seen=LS('fyfpass:seenE:'+code);
  if(seen!=null&&n>seen) out.push(`<span class="gchip new">${n-seen} neu</span>`);

  return out.length?`<div class="gchips">${out.join('')}</div>`:''; }

 ['Foto & Hintergrund','<p>Im Rad oben auf <b>Foto</b>: Foto wählen, verschieben und zoomen.</p><p><b>Hintergrund entfernen:</b> In der Fotos-App lange auf das Rad drücken → <b>Kopieren</b> → hier <b>Freigestelltes Rad einfügen</b>. Das Rad steht dann auf hellem Studio-Hintergrund. Am schönsten: Rad genau von der Seite, vor heller Wand.</p>'],
 ['Zustandsbericht','<p>Im Rad zeigt der <b>Zustandsbericht</b> einen Wert von 0–100 – nur aus dem, was wirklich dokumentiert ist: letzte Inspektion, Wartungsplan, gemessener Kettenverschleiß, Schäden, Akku-Zustand und Werkstatt-Nachweise.</p><p>Was nicht dokumentiert ist, steht als <b>unbekannt</b> da und zählt nicht mit. Es ist kein Gutachten – aber Käufer sehen auf einen Blick, wie gepflegt das Rad ist.</p>'],
 ['Service & Erinnerungen','<p><b>Mein Rad → Service</b> zeigt, was wann fällig ist – je nach Radart (Kette, Bremsen, Inspektion, Gabel, Dämpfer, E-Bike-Check …).</p><ul><li>Kilometerstand eintragen → Erinnerung auch nach km.</li><li><b>Erledigt</b> tippen, wenn gemacht.</li><li><b>In Kalender</b> legt eine Erinnerung im Handy-Kalender an.</li><li><b>Termin buchen</b> bei einer FYF-Werkstatt.</li></ul><p>In der Garage steht „Fällig: …“, wenn etwas ansteht.</p>'],
 ['Sitzposition & Bikefitting','<p><b>Sitzposition</b> speichert Sattelhöhe, Sattelversatz, Lenker usw. Nach einem Bikefitting bei FYF stehen die Werte automatisch drin.</p><p><b>Auf anderes Rad übertragen:</b> Zielrad wählen, Kurbellänge eingeben – die Sattelhöhe wird umgerechnet. <b>Werte kopieren</b> z. B. für ein Leihrad.</p>'],
 ['Fahrwerk','<p>Für Räder mit Federgabel/Dämpfer: Gewicht, Fahrstil und Federweg eintragen → <b>SAG-Ziel</b> und <b>Startdruck</b>.</p><p><b>SAG messen:</b> Gummiring runter, vorsichtig aufsitzen, absteigen, Abstand messen, eintragen → die App sagt, ob mehr oder weniger Luft. Gute Einstellungen mit <b>Setup speichern</b> festhalten.</p>'],
 ['Reifendruck','<p>Gewicht, Reifenbreite, Untergrund, Tubeless/Hookless wählen → Druck vorne und hinten in bar und psi. Startwert – Grenzen auf Reifen und Felge beachten.</p>'],
 ['E-Bike & Akku','<p>Motor, Akku, Seriennummern und Ladegerät eintragen. <b>Akku-Zustand</b> (Ladezyklen, %) regelmäßig festhalten – zeigt beim Verkauf, wie fit der Akku ist.</p><p><b>Batteriepass:</b> Ab 18.02.2027 bekommen neue E-Bike-Akkus einen QR-Code mit digitalem Batteriepass. Code scannen, Link kopieren, hier <b>Einfügen</b>.</p>'],
 ['Ausstattung & Belege','<p><b>Ausstattung:</b> Teile, Farbe, besondere Merkmale, volle Rahmennummer – hilft beim Ersatzteilkauf und im Diebstahlfall.</p><p><b>Schnell ausfüllen:</b> Schaltgruppe wählen (z. B. Shimano GRX RX820, 1×) – Schaltwerk, Hebel, Kurbel, Kassette, Kette und Bremsen werden vorausgefüllt. <b>Serienausstattung:</b> Liste auf der Herstellerseite kopieren und einfügen – FYF erkennt die Teile und zeigt die Serie auch nach späteren Umbauten an.</p><p><b>Belege:</b> Kaufbeleg & Rechnungen fotografieren, Garantie-Ende sehen und eine Erinnerung vorher bekommen.</p>'],
 ['Verkaufen','<p><b>Verkaufen</b> erstellt einen fertigen Anzeigentext mit Ausstattung, Wartung, Akku-Zustand und dem Link zum Pass – kopieren oder direkt teilen (z. B. Kleinanzeigen).</p><p>Pass auf „Jeder“ stellen, damit Käufer die Geschichte sehen. Bei der Übergabe: Kaufvertrag (in der App) und unter <b>Besitzer-Einstellungen → Übergabe starten</b> einen Link für den Käufer erstellen. Er bestätigt in seiner App – ohne Werkstatt. Danach gilt nur noch sein neuer Code.</p>'],
 ['Gebrauchtes Rad kaufen','<p>Code scannen oder eintippen → <b>Kauf-Check</b>:</p><ul><li>Diebstahlmeldung und Geschichte ansehen</li><li><b>Rahmennummer vergleichen</b> – passt sie zum Pass?</li><li>Checkliste für Besichtigung und Probefahrt</li><li><b>Kaufvertrag</b> ausfüllen und drucken/als PDF sichern</li></ul>'],
 ['Diebstahl & Fundmeldung','<p><b>Mein Rad → Diebstahl</b> führt Schritt für Schritt: 110, im Pass als gestohlen melden, <b>Anzeige-Blatt</b> mit allen Daten und Fotos, Online-Wache, Versicherung, Kleinanzeigen beobachten.</p><p><b>Fundmeldung:</b> Scannt jemand dein gestohlenes Rad, kann er „Rad gesehen“ melden – mit Ort und freiwillig mit seiner Telefonnummer oder E-Mail. Deine Daten sieht er nie. Du siehst die Meldungen in den Besitzer-Einstellungen und in der Garage.</p><p><b>Teil II verloren?</b> Eine verifizierte FYF-Werkstatt kann nach Prüfung (Rahmennummer am Rad, Ausweis, Kaufbeleg) einen neuen Übergabe-Code ausstellen. Der alte wird ungültig.</p>'],
 ['Werkstätten & Marktplatz','<p><b>Werkstätten</b> zeigt FYF-Partner in deiner Nähe – für Service, Bikefitting und Gebrauchtrad-Check. <b>Marktplatz</b> zeigt Räder mit Fahrradpass von FYF-Werkstätten.</p>'],
 ['Daten, Sicherung & Teilen','<p>Deine Einträge (Service, Belege, Akku …) liegen <b>nur auf deinem Handy</b>. Am einfachsten: in der Garage <b>Konto anlegen</b> – dann wird alles automatisch gesichert. Ohne Konto ab und zu <b>Daten sichern & teilen → Jetzt sichern</b> und die Datei z. B. in iCloud/Google Drive ablegen. Neues Handy: <b>Sicherung wiederherstellen</b>.</p><p><b>Garage teilen</b> schickt deine Räder per Link aufs Handy der Familie.</p><p>Im Pass selbst (für Werkstätten/Käufer sichtbar) stehen nur Rad-Daten und Einträge – nie dein Name.</p>'],
 ['Als App installieren','<ul><li><b>iPhone:</b> in Safari öffnen → Teilen → „Zum Home-Bildschirm“.</li><li><b>Android:</b> Knopf <b>Als App installieren</b> in der Garage oder Chrome-Menü ⋮ → „App installieren“.</li></ul><p>Dann startet „FYF Pass“ wie eine normale App, auch offline.</p>']];
function guide(open){ page('So funktioniert’s','',(r)=>{ r.innerHTML=`<p class="muted" style="margin:-4px 2px 12px">Alles zum FYF-Fahrradpass – tippe auf ein Thema.</p>${GUIDE.map(([t,h],i)=>`<details class="more guide"${open===i?' open':''}><summary>${t}</summary><div class="small">${h}</div></details>`).join('')}<button class="btn ghost block" id="gint" type="button" style="margin-top:14px">Kurze Einführung ansehen</button>`;

/* ===== v.98 Privater Besitzerwechsel: Verkäufer startet, Käufer bestätigt – ohne Werkstatt ===== */
const CERR={FYF_BAD_TRANSFER:'Der Code stimmt nicht.',FYF_STOLEN:'Das Rad ist als gestohlen gemeldet – keine Übergabe möglich.',FYF_CLAIM_EXPIRED:'Der Übergabe-Link ist abgelaufen oder wurde schon benutzt. Bitte den Verkäufer um einen neuen Link.',FYF_RATE:'Zu viele Versuche. Bitte morgen erneut versuchen.',FYF_NOT_FOUND:'Diesen Fahrradpass gibt es nicht.'};
async function claimStart(code,host){ host.innerHTML='<p class="muted small">Erstelle Übergabe-Link …</p>';
  let r; try{ r=await rpc('pass_claim_start',{p_code:code,p_transfer:OWN||ownGet(code)}); }catch(e){ host.innerHTML=`<p class="small bad">${e.missing?'Besitzerwechsel ist bald verfügbar (Datenbank-Update nötig).':'Gerade nicht erreichbar.'}</p>`; return; }
  if(r.error){ host.innerHTML=`<p class="small bad">${esc(CERR[r.error]||'Nicht möglich')}</p>`; return; }
  const url=location.origin+location.pathname+'#claim='+code+'.'+r.token+(CF?'&cfg='+CF:''); let qr=''; try{ await loadQR(); const q=window.qrcode(0,'M'); q.addData(url); q.make(); qr=q.createSvgTag({cellSize:4,margin:1,scalable:true}); }catch(e){}
  host.innerHTML=`<div class="card" style="background:var(--card2);box-shadow:none;margin:8px 0"><b>Übergabe-Link für den Käufer</b><p class="muted small" style="margin:4px 0 8px">Gültig 7 Tage, nur einmal nutzbar. Der Käufer öffnet ihn und bestätigt – danach gehört der Pass ihm und dein Code ist ungültig. Deine Notizen, Belege und Fotos bleiben auf deinem Handy.</p>${qr?`<div class="qrbig" style="width:200px;height:200px;margin:8px auto;padding:8px;border-radius:16px;background:#fff">${qr}</div>`:''}<div style="display:grid;gap:8px;grid-template-columns:1fr 1fr"><button class="btn" data-c="share" type="button">Link senden</button><button class="btn ghost" data-c="copy" type="button">Kopieren</button></div><p style="margin:10px 0 0"><button class="linkbtn" data-c="cancel" type="button">Übergabe abbrechen</button></p></div>`;
  host.querySelector('[data-c=copy]').onclick=()=>copyText(url);
  host.querySelector('[data-c=share]').onclick=async()=>{ try{ if(navigator.share) await navigator.share({title:'Fahrradpass übernehmen',text:'Hier kannst du den FYF-Fahrradpass für das Rad übernehmen:',url}); else copyText(url); }catch(e){} };
  host.querySelector('[data-c=cancel]').onclick=async()=>{ try{ await rpc('pass_claim_cancel',{p_code:code,p_transfer:OWN||ownGet(code)}); }catch(e){} host.innerHTML='<p class="muted small">Übergabe abgebrochen – der Link funktioniert nicht mehr.</p>'; }; }
async function claimSheet(code,token){ const el=document.createElement('div'); el.className='sheet'; el.innerHTML='<div><p class="muted">Lädt …</p></div>'; document.body.appendChild(el);
  const close=()=>{ el.remove(); history.replaceState(null,'',location.pathname+hashLink('meine')); };
  let info; try{ info=await rpc('pass_claim_info',{p_code:code}); }catch(e){ el.firstChild.innerHTML=`<p>${e.missing?'Besitzerwechsel ist bald verfügbar.':'Gerade nicht erreichbar.'}</p><button class="btn block" type="button">Schließen</button>`; el.querySelector('button').onclick=close; return; }
  if(info.error||!info.open||info.stolen){ el.firstChild.innerHTML=`<div style="font-size:20px;font-weight:800">Übernahme nicht möglich</div><p class="muted">${esc(info.error?CERR[info.error]:info.stolen?CERR.FYF_STOLEN:CERR.FYF_CLAIM_EXPIRED)}</p><button class="btn block" type="button">Schließen</button>`; el.querySelector('button').onclick=close; return; }
  el.firstChild.innerHTML=`<div class="muted small" style="font-weight:700;letter-spacing:.14em">FAHRRADPASS ÜBERNEHMEN</div><div style="font-size:22px;font-weight:800;margin:6px 0">${esc(info.name||'Fahrrad')}</div><p class="muted small" style="margin:0 0 12px">Pass ${esc(code)} · bisher ${info.owner_no||1}. Besitzer. Die Geschichte des Rads bleibt erhalten – Daten des Vorbesitzers werden nicht übertragen.</p>
   <label class="chk" style="text-align:left"><input type="checkbox" id="clok"><span>Ich habe das Rad gekauft bzw. übernommen und die Rahmennummer am Rad mit dem Pass verglichen.</span></label>
   <div style="display:flex;gap:10px;margin-top:12px"><button class="btn ghost" data-a="x" type="button" style="flex:1">Abbrechen</button><button class="btn" data-a="ok" type="button" style="flex:1">Übernahme bestätigen</button></div><p id="cle" class="small bad" style="margin:8px 0 0"></p>`;
  el.querySelector('[data-a=x]').onclick=close;
  el.querySelector('[data-a=ok]').onclick=async()=>{ if(!el.querySelector('#clok').checked){ el.querySelector('#cle').textContent='Bitte bestätigen, dass du das Rad übernommen hast.'; return; } let r; try{ r=await rpc('pass_claim',{p_code:code,p_token:token}); }catch(e){ el.querySelector('#cle').textContent='Gerade nicht erreichbar.'; return; }
    if(r.error){ el.querySelector('#cle').textContent=CERR[r.error]||'Nicht möglich'; return; }
    ownSet(code,r.transfer); mineAdd(code,info.name||'Fahrrad'); const tr=r.transfer.replace(/(.{4})(?=.)/g,'$1-');
    el.firstChild.innerHTML=`<svg class="okcheck" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30"/><path d="M19 33l9 9 17-19"/></svg><div style="font-size:22px;font-weight:800">Das Rad gehört jetzt dir</div><p class="muted small" style="margin:6px 0 10px">Du bist ${r.owner_no}. Besitzer. Dein neuer Übergabe-Code (Teil II) – nur jetzt sichtbar, auf diesem Handy gemerkt. Bitte Foto oder Screenshot machen:</p><div style="font:700 22px ui-monospace,Menlo,monospace;letter-spacing:.06em;border:2px dashed var(--line);border-radius:12px;padding:10px">${esc(tr)}</div><button class="btn block" type="button" style="margin-top:14px">Zu meinem Rad</button>`;
    el.querySelector('button').onclick=()=>{ el.remove(); location.hash='c='+code+(CF?'&cfg='+CF:''); }; }; }

/* ===== v.99 Dienstrad / Leasing: Inspektion jedes Jahr, Leasingende, Termin bei FYF-Werkstatt ===== */
const LEASE_PROV=['JobRad','BusinessBike','Bikeleasing-Service','Lease a Bike','Company Bike','Linexo','Eurorad','mein-dienstrad','Deutsche Dienstrad','bike2business','Anderer Anbieter'];
const LEASE_SEARCH={'JobRad':'https://www.jobrad.org/haendlersuche','BusinessBike':'https://www.businessbike.de/fahrrad-finden/','Bikeleasing-Service':'https://bikeleasing.de/haendler-finden','Lease a Bike':'https://www.lease-a-bike.de/haendlersuche','Company Bike':'https://support.company-bike.com/hc/de/articles/23013813800476','Linexo':'https://www.linexo.de/werkstattsuche','Eurorad':'https://www.eurorad.de/haendlersuche/','mein-dienstrad':'https://lp.mein-dienstrad.de/fachhaendlersuche','Deutsche Dienstrad':'https://www.deutsche-dienstrad.de/haendlersuche','bike2business':'https://www.bike2business.net/haendler.php'};
// Werte der Werkstatt (aus dem Pass) + eigene Eingaben; eigene Eingaben gehen vor
function leaseOf(code){ const sh=Pof(code).lease||null, own=X(code).lease||null; if(!sh&&!own) return null;
  const o={...(sh||{}),...Object.fromEntries(Object.entries(own||{}).filter(([k,v])=>v!==''&&v!=null))}; if(!o.provider) return null; o.fromShop=!!sh; o.shopName=((Pof(code).shop||{}).name)||''; return o; }
function leaseState(code){ const l=leaseOf(code); if(!l) return null; const S=shopData(code).svc.insp, own=(X(code).svc||{}).insp;
  const last=[l.lastInsp,S&&S.d,own&&own.d].filter(Boolean).sort().pop()||'';
  const months=Number(l.months)||36, end=l.end||(l.start?addMonths(l.start,months):'');
  let next=''; if(last) next=addMonths(last,12); else if(l.start){ next=addMonths(l.start,12); }
  const days=d=>d?Math.round((new Date(d)-new Date(today()))/864e5):null; const dn=days(next), de=days(end);
  const st=(dn==null||(end&&next>end))?'ok':dn<0?'due':dn<=30?'soon':'ok', est=de==null?'ok':de<0?'ok':de<=60?'soon':'ok';
  return {...l,last,next,end,dn,de,st,est,ended:de!=null&&de<0}; }
function leaseItems(code){ const s=leaseState(code); if(!s||s.ended) return []; const out=[];
  if(s.next&&!(s.end&&s.next>s.end)) out.push({t:`Dienstrad-Inspektion (${s.provider})`,due:s.next,next:s.next,days:s.dn,st:s.st,lease:true});
  if(s.end&&s.est==='soon') out.push({t:`Leasingende (${s.provider}): übernehmen oder zurückgeben`,due:s.end,next:s.end,days:s.de,st:'soon',lease:true});
  return out; }
{ const SS9=svcSummary; svcSummary=function(code){ const r=SS9(code); try{ const li=leaseItems(code); r.due=r.due.concat(li.filter(i=>i.st==='due')); r.soon=r.soon.concat(li.filter(i=>i.st==='soon')); r.lease=li; }catch(e){} return r; }; }
function leaseCard(code,compact){ const s=leaseState(code); if(!s) return compact?'':`<div class="card"><b>Dienstrad / Leasing?</b><p class="muted small" style="margin:2px 0 8px">Ist das Rad über den Arbeitgeber geleast (z. B. JobRad, BusinessBike)? Dann erinnert dich der Pass an die jährliche Inspektion und an das Leasingende.</p><button class="btn ghost block" type="button" data-lease-open>Leasing eintragen</button></div>`;
  const cls=s.st==='due'?'bad':s.st==='soon'?'warn':'muted';
  return `<div class="card svc svc-${s.st}"><div class="small" style="font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ok)">Dienstrad · ${esc(s.provider)}${s.fromShop&&s.shopName?' · von '+esc(s.shopName):''}</div>
   <div class="kv"><span>Nächste Inspektion</span><b class="${cls}">${s.next&&s.end&&s.next>s.end?'keine mehr vor Leasingende':s.next?fd(s.next)+(s.dn<0?' · überfällig':s.dn<=30?' · bald':''):'Übergabedatum fehlt'}</b></div>
   ${s.last?`<div class="kv"><span>Letzte Inspektion</span><b>${fd(s.last)}</b></div>`:''}${s.end?`<div class="kv"><span>Leasingende</span><b class="${s.est==='soon'?'warn':''}">${fd(s.end)}</b></div>`:''}${s.pack?`<div class="kv"><span>Service-Paket</span><b>${esc(s.pack)}</b></div>`:''}
   <div style="display:grid;gap:8px;margin-top:10px"><a class="btn" href="finder.html#pass=${code}&want=service&lease=${encodeURIComponent(s.provider)}${CF?'&cfg='+esc(CF):''}">Inspektion bei einer FYF-Werkstatt buchen</a>${LEASE_SEARCH[s.provider]?`<a class="btn ghost" href="${esc(LEASE_SEARCH[s.provider])}" target="_blank" rel="noopener">Alle ${esc(s.provider)}-Partner (offizielle Suche)</a>`:''}${compact?'':`<button class="btn ghost" type="button" data-lease-open>Leasing-Daten ändern</button>`}</div></div>`; }
function toolLease(code){ const name=bikeName(code); page('Dienstrad / Leasing','',(r)=>{ const draw=()=>{ const own=X(code).lease||{}, sh=Pof(code).lease||{}, s=leaseState(code), v=k=>own[k]??sh[k]??'';
    r.innerHTML=`${s?leaseCard(code,true):''}
     <div class="card"><b>Leasing-Daten</b><p class="muted small" style="margin:2px 0 4px">Stehen in deinem Überlassungsvertrag oder im Portal deines Anbieters. Die Vertragsnummer bleibt nur auf deinem Handy.</p>
      ${sel('lsP','Leasinganbieter',[['','– kein Dienstrad –'],...LEASE_PROV.map(p=>[p,p])],v('provider'))}
      ${inp('lsS','Übergabe des Rads (Leasingbeginn)',v('start'),'type="date"')}

      ${sel('lsV','Service-Paket',[['unbekannt','weiß ich nicht'],['Inspektion enthalten','Inspektion enthalten'],['Vollservice','Vollservice / Verschleiß enthalten'],['ohne Service','ohne Service']],v('pack')||'unbekannt')}

// ---------- v.187 Zustands-Check mit Fragen (Gebrauchtrad): Probefahrt & Sichtprüfung → regelbasiertes Urteil, ohne Preise ----------
// Funktioniert mit Pass (Kauf-Check) und ohne (Rad prüfen). Antworten bleiben nur auf dem Gerät. Ersetzt keine Werkstatt-Prüfung.
const CQ=[
 ['frame','Rahmen & Gabel','Risse, Dellen oder abgeplatzter Lack an Rohr-Verbindungen? Bei Carbon genau hinsehen und leicht abklopfen (dumpfer Klang = Vorsicht).',[['Nichts zu sehen',0],['Nur Kratzer im Lack',1],['Riss, Delle oder dumpfer Klang',3]],'Rahmen/Gabel in einer Werkstatt prüfen lassen – bei Riss nicht fahren'],
 ['hs','Steuersatz','Vorderbremse ziehen und das Rad vor und zurück schieben. Klackt es oder hat der Lenker Spiel? Lenkt er sich rau oder rastet in der Mitte ein?',[['Kein Spiel, lenkt sauber',0],['Leichtes Spiel',1],['Deutliches Spiel oder rastet ein',2]],'Steuersatz einstellen oder Lager tauschen'],
 ['bb','Tretlager & Kurbel','Kurbeln seitlich wackeln und kräftig antreten. Spiel oder Knacken?',[['Fest und leise',0],['Leises Knacken',1],['Spiel oder lautes Knacken',2]],'Tretlager reinigen/fetten oder tauschen'],
 ['drive','Kette & Ritzel','Springt die Kette unter Last? Ist sie rostig, oder lässt sie sich vorn vom Kettenblatt abheben?',[['Läuft sauber',0],['Etwas rostig oder trocken',1],['Springt oder lässt sich abheben',2]],'Kette, meist auch Kassette und Kettenblatt, tauschen'],
 ['shift','Schaltung','Alle Gänge durchschalten. Schaltet sie sauber, ohne Rattern? Ist das Schaltwerk gerade?',[['Alle Gänge sauber',0],['Rattert in einzelnen Gängen',1],['Springt oder Schaltwerk verbogen',2]],'Schaltung einstellen, Schaltauge richten oder tauschen'],
 ['brake','Bremsen','Fester Druckpunkt? Kein Schleifen oder Quietschen? Beläge noch dicker als etwa 1,5 mm?',[['Bremst kräftig, leise',0],['Quietscht oder Beläge dünn',1],['Weicher Druckpunkt oder schwach',2]],'Beläge tauschen bzw. Bremse entlüften'],
 ['wheel','Laufräder','Räder drehen: Laufen sie rund, ohne Seitenschlag? Sind die Speichen fest und die Naben ohne Spiel?',[['Rund und fest',0],['Leichter Schlag',1],['Starker Schlag, lose Speichen oder Spiel',2]],'Laufrad zentrieren, Nabe einstellen oder Laufrad tauschen'],
 ['tire','Reifen','Gibt es genug Profil? Keine Risse an der Flanke, keine Beulen?',[['Gut',0],['Abgefahren',1],['Risse oder Beulen',2]],'Reifen tauschen'],
 ['sus','Federung','Gabel und Dämpfer einfedern. Klackt oder schmatzt es? Gibt es Ölspuren oder Riefen am Standrohr? Sackt sie durch?',[['Unauffällig',0],['Leichte Geräusche oder Ölfilm',1],['Ölspuren, Riefen, Klacken oder sackt durch',2],['Keine Federung',-1]],'Federungs-Service (Dichtungen, Öl) oder Reparatur'],
 ['pivot','Hinterbau-Lager','Nur bei Fullys: Das Hinterrad seitlich bewegen und einfedern. Gibt es Spiel oder Knarzen?',[['Kein Spiel',0],['Leises Knarzen',1],['Spürbares Spiel',2],['Kein Fully',-1]],'Hinterbau-Lager tauschen'],
 ['ebike','E-Bike-Antrieb & Akku','Zeigt das Display Fehler? Gibt es Geräusche im Motor? Lass dir einen Akku-Bericht aus der Hersteller-App oder von einer Werkstatt zeigen.',[['Alles unauffällig, Bericht gezeigt',0],['Kein Bericht',1],['Fehlermeldung, Motorgeräusch oder Akku schwach',3],['Kein E-Bike',-1]],'Akku- und Motor-Diagnose in der Werkstatt'],
 ['noise','Probefahrt allgemein','Knarzt es an Lenker, Vorbau oder Sattelstütze? Schleift etwas? Fährt das Rad freihändig geradeaus?',[['Ruhig und läuft gerade',0],['Leises Knarzen',1],['Zieht zur Seite oder lautes Geräusch',2]],'Kontaktstellen reinigen/fetten, bei Schiefzug Rahmen/Gabel prüfen']];
const CQ_LV=['ok','klein','mittel','kritisch'];
function cqEval(A){ let mi=0,ma=0,cr=0,un=0,open=0; const todo=[]; CQ.forEach(([k,t,,O,w])=>{ const a=A[k]; if(a==null){ open++; return; } if(a==='?'){ un++; todo.push({t,w:'Unklar – in der Werkstatt prüfen lassen',lv:1}); return; } const v=O[a]?O[a][1]:0; if(v<=0) return; if(v===1) mi++; if(v===2) ma++; if(v===3) cr++; todo.push({t,w,lv:v}); });
  const score=Math.max(0,Math.min(100,100-mi*6-ma*15-cr*40-un*4)); let c,txt,sub;
  if(cr){ c='bad'; txt='Nicht ohne Werkstatt-Prüfung kaufen'; sub='Mindestens ein kritischer Punkt.'; }
  else if(ma){ c='warn'; txt='Reparaturen nötig – im Preis berücksichtigen'; sub=`${ma} größere${ma>1?'':'r'} Punkt${ma>1?'e':''}, ${mi} kleine${mi===1?'r':''}.`; }
  else if(mi>=3||un>=3){ c='warn'; txt='Ordentlich, mit kleineren Arbeiten'; sub=`${mi} kleine Punkte${un?`, ${un} unklar`:''}.`; }
  else { c='ok'; txt='Guter Zustand'; sub=mi||un?'Nur Kleinigkeiten.':'Keine Auffälligkeiten.'; }
  return {score,c,txt,sub,todo:todo.sort((a,b)=>b.lv-a.lv),open,n:CQ.length}; }
function condCheck(code,name){ const key='fyfpass:cq:'+(code||'frei'); const A=LS(key)||{};
  page('Zustands-Check','',(r)=>{ const draw=()=>{ const R=cqEval(A); const done=R.n-R.open;
    r.innerHTML=`<div class="cq-head cq-${R.open===R.n?'none':R.c}"><div class="cq-ring" style="--p:${done?R.score:0}"><b>${done?R.score:'–'}</b></div><div><span class="cq-k">${name?esc(name):'Gebrauchtrad'} · ${done} von ${R.n} beantwortet</span><b class="cq-v">${R.open===R.n?'Fragen beantworten':esc(R.txt)}</b><span class="cq-s">${R.open===R.n?'Beim Ansehen und bei der Probefahrt, etwa 10 Minuten.':esc(R.sub)+(R.open?` Noch ${R.open} offen.`:'')}</span></div></div>
     ${R.todo.length?`<div class="card"><b>Was zu tun ist</b><ul class="cq-todo">${R.todo.map(x=>`<li class="lv${x.lv}"><span>${CQ_LV[x.lv]}</span><div><b>${esc(x.t)}</b><small>${esc(x.w)}</small></div></li>`).join('')}</ul><p class="muted small" style="margin:8px 0 0">Gute Argumente für die Preisverhandlung. Was eine Reparatur kostet, sagt dir eine Werkstatt.</p></div>`:''}
     ${CQ.map(([k,t,q,O],i)=>`<div class="card cq-q${A[k]!=null?' cq-done':''}"><span class="cq-n">${i+1}</span><b>${esc(t)}</b><p class="muted small" style="margin:4px 0 10px">${esc(q)}</p><div class="cq-o">${O.map(([l,v],j)=>`<button type="button" class="cq-b${A[k]===j?' on':''}${v>=2?' hi':''}" data-q="${k}" data-a="${j}">${esc(l)}</button>`).join('')}<button type="button" class="cq-b${A[k]==='?'?' on':''}" data-q="${k}" data-a="?">Weiß nicht</button></div></div>`).join('')}
     <button class="btn ghost block" type="button" data-cqreset>Antworten löschen</button>
     <p class="muted small" style="margin:12px 2px">Regelbasierte Selbsteinschätzung, kein Gutachten – wir sind keine Gutachter. Sicherer ist ein Gebrauchtrad-Check in einer FYF-Werkstatt.</p>`;
    r.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{ const k=b.dataset.q, a=b.dataset.a==='?'?'?':Number(b.dataset.a); if(A[k]===a) delete A[k]; else A[k]=a; LSset(key,A); const sc=r.closest('.tpage')||document.scrollingElement; const y=sc.scrollTop; draw(); try{ hit('zustandscheck'); }catch(e){} sc.scrollTop=y; });
    r.querySelector('[data-cqreset]').onclick=()=>{ Object.keys(A).forEach(k=>delete A[k]); LSset(key,A); draw(); }; };
   draw(); }); }
// Einstieg 1: Kauf-Check (mit Pass)
{ const BCq=buyCheck; buyCheck=function(code){ BCq.apply(this,arguments); try{ const pg=[...document.querySelectorAll('.tpage')].pop(), r=pg&&pg.querySelector('.tp-body'); if(!r||r.querySelector('[data-cqgo]')) return; const P=Pof(code); const R=cqEval(LS('fyfpass:cq:'+code)||{});
  const c=document.createElement('button'); c.type='button'; c.className='cq-entry'; c.setAttribute('data-cqgo',''); c.innerHTML=`<span class="cq-ei">?</span><div><b>Zustand per Fragen prüfen</b><span>${R.open<R.n?esc(R.txt)+' · '+(R.n-R.open)+' von '+R.n:'12 Fragen zu Probefahrt, Federung, Geräuschen'}</span></div><span class="ns-go">›</span>`;
  c.onclick=()=>condCheck(code,(P.bike||{}).name); const chk=[...r.querySelectorAll('.card')].find(x=>/^Checkliste/.test((x.querySelector('b')||{}).textContent||'')); if(chk) chk.before(c); else r.appendChild(c); }catch(e){} }; }

{ const AFq=askForm; askForm=function(){ const r=AFq.apply(this,arguments); try{ if(!/pruefen/.test(location.hash)||document.querySelector('[data-cqfree]')) return r; const f=document.querySelector('.pc-feat'); if(!f) return r; const c=document.createElement('button'); c.type='button'; c.className='cq-entry'; c.setAttribute('data-cqfree','');
  c.innerHTML=`<span class="cq-ei">?</span><div><b>Rad ohne Pass? Zustand per Fragen prüfen</b><span>12 Fragen bei Ansicht und Probefahrt → Urteil und Verhandlungs-Argumente</span></div><span class="ns-go">›</span>`; c.onclick=()=>condCheck(null,''); f.insertAdjacentElement('afterend',c); }catch(e){} return r; }; }
