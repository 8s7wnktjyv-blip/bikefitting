<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="description" content="FYF Fahrradpass: Service-Geschichte eines Fahrrads prüfen – Services, neue Teile, Gebrauchtrad-Check und Diebstahl-Meldung.">
<title>FYF Fahrradpass prüfen</title>
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="pass.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FYF Pass">
<meta name="theme-color" content="#1f2a30">
<style>
:root{--bg:#f7f3ee;--card:#fffdf9;--ink:#1d2a30;--muted:#5f6b70;--line:#e5ddd2;--acc:#d9612c;--ok:#1d6b35;--bad:#a23b2a}
@media (prefers-color-scheme:dark){:root{--bg:#14191b;--card:#1c2326;--ink:#e8eef0;--muted:#9aa7ac;--line:#2c3539;--acc:#f07a45;--ok:#6fcf8f;--bad:#ff8a73}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:680px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:27px;margin:4px 0}h2{font-size:18px;margin:0 0 6px}.muted{color:var(--muted)}.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.e{padding:9px 0;border-bottom:1px solid var(--line)}.e:last-child{border:0}
.k{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--line);border-radius:6px;padding:1px 7px;margin-right:6px}
.alarm{background:var(--bad);color:#fff;border-radius:16px;padding:16px;margin:12px 0;font-weight:600}
.ok{color:var(--ok);font-weight:700}.tb{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:4px;border:1px solid var(--line)}.tb.v{background:var(--ok);color:#fff;border-color:var(--ok)}.tb.s{background:transparent}.e.x{opacity:.55}.leg{font-size:12.5px;color:var(--muted);margin:6px 0 0}
form{display:flex;gap:8px;flex-wrap:wrap}input{flex:1 1 200px;font:600 20px ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 18px;background:var(--acc);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
a{color:var(--acc)}
.brand{font-weight:800;letter-spacing:.08em;font-size:13px}
</style>
</head>
<body>
<main id="app"><p class="muted">Lädt …</p></main>
<script>
"use strict";
// Öffentliche Ansicht eines FYF-Fahrradpasses (QR-Aufkleber am Rahmen). Zeigt nur, was der Besitzer freigegeben hat. Keine Daten über den Besitzer.
const DEFAULT={u:'https://tyfilehmrnibtoalwflf.supabase.co',k:'sb_publishable_DUIWZF8H-BD-HaBUMvTg-A_pbpz1mgT'}; // öffentlicher Schlüssel, kein Geheimnis
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=s=>{ if(!s) return ''; const [y,m,d]=String(s).slice(0,10).split('-'); return `${d}.${m}.${y}`; };
const num=v=>Number(v).toLocaleString('de-DE');
const unb64u=s=>decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4))));
const hp=new URLSearchParams((location.hash||'').slice(1)); const CF=hp.get('cfg');
let CFG=DEFAULT; try{ if(CF){ const c=JSON.parse(unb64u(CF)); if(/^https:\/\/[a-z0-9.-]+$|^http:\/\/localhost(:\d+)?$/.test(c.u)&&c.k&&!/^sb_secret_/.test(c.k)) CFG=c; } }catch(e){}
const app=document.getElementById('app');
const norm=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const head=`<p class="brand">FYF · FAHRRADPASS</p>`;
function askForm(err){
  const my=myBikesHtml();
  app.innerHTML=`${head}${my?`<h1>FYF Pass</h1>${my}<h2 style="margin:22px 0 6px">Anderes Rad prüfen</h2>`:'<h1>Geschichte eines Fahrrads prüfen</h1>'}<p class="muted">Vor dem Kauf eines gebrauchten Rads: Code vom FYF-Aufkleber am Rahmen eingeben oder den QR-Code mit der Kamera scannen. Du siehst Services, neue Teile, den Gebrauchtrad-Check der Werkstatt – und ob das Rad als gestohlen gemeldet ist.</p>
   <div class="card"><form id="f"><input id="c" maxlength="9" placeholder="z. B. K7QM3XPA" autocomplete="off" autocapitalize="characters" aria-label="Fahrradpass-Code" required><button>Prüfen</button></form>${err?`<p style="color:var(--bad);margin:8px 0 0">${esc(err)}</p>`:''}</div>
   <div class="card"><h2>Eigenes Rad registrieren – kostenlos</h2><p class="muted small" style="margin:0 0 10px">Dein Rad bekommt einen FYF-Fahrradpass mit QR-Code. Jede FYF-Werkstatt trägt Services ein, du kannst es als gestohlen melden, und beim Verkauf gibst du die Geschichte einfach weiter. Ohne Konto, ohne Namen.</p><button class="btn" id="regb" type="button">Rad registrieren</button></div>
   <p><a href="finder.html${CF?'#cfg='+esc(CF):''}">FYF-Partnerwerkstätten finden</a></p>`;
  document.getElementById('regb').onclick=()=>regForm();
  app.insertAdjacentHTML('beforeend',installHint()); app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ if(confirm('Rad aus „Meine Räder“ auf diesem Gerät entfernen? Der Pass selbst bleibt bestehen.')){ mineDel(b.dataset.del); askForm(''); } });
  document.getElementById('f').onsubmit=e=>{ e.preventDefault(); location.hash='c='+norm(document.getElementById('c').value)+(CF?'&cfg='+CF:''); };
}
async function show0(code){ window.__P=null; window.__OFF=null;
  if(!/^[A-HJ-NP-Z2-9]{8}$/.test(code)) return askForm('Der Code hat 8 Zeichen (ohne 0, O, 1 und I).');
  let p; try{ const r=await fetch(CFG.u+'/rest/v1/rpc/pass_get',{method:'POST',headers:{apikey:CFG.k,'Content-Type':'application/json'},body:JSON.stringify({p_code:code})}); if(!r.ok) throw 0; p=await r.json(); }catch(e){ const c0=cacheGet(code); if(c0){ p=c0.p; window.__OFF=c0.at; } else { app.innerHTML=`${head}<h1>Gerade nicht erreichbar</h1><div class="card">Bitte später noch einmal versuchen.</div>`; return; } }
  if(p&&!window.__OFF&&mine().some(m=>m.code===code)) cacheSet(code,p);
  if(!p) return askForm('Zu diesem Code gibt es keinen Fahrradpass.');
  window.__P=p;
  const b=p.bike||{}, sh=p.shop||{};
  const tel=sh.phone?` · <a href="tel:${esc(String(sh.phone).replace(/[^\d+]/g,''))}">${esc(sh.phone)}</a>`:'';
  const alarm=p.stolen?`<div class="alarm">Dieses Rad ist als gestohlen gemeldet. Bitte nicht kaufen und die Polizei oder die Werkstatt ${esc(sh.name||'')} informieren${sh.phone?' ('+esc(sh.phone)+')':''}.</div>`:'';
  const shopLine=p.self&&!sh.name?`<p class="muted small" style="margin:0">Vom Besitzer selbst registriert – noch von keiner Werkstatt betreut.</p>`:`<p class="muted small" style="margin:0">Pass geführt von <b>${esc(sh.name||'einer FYF-Werkstatt')}</b>${sh.addr?' · '+esc(sh.addr):''}${tel}</p>`;
  const shopBtn=`<p><a class="btn" href="finder.html#pass=${code}${CF?'&cfg='+esc(CF):''}">Service bei einer FYF-Werkstatt buchen</a></p><p><a class="btn ghost" href="index.html#rad=${code}">Ich bin Werkstatt: in FYF öffnen</a> <a class="btn ghost" href="finder.html${CF?'#cfg='+esc(CF):''}">FYF-Partner finden</a></p>`;
  if(p.withdrawn&&p.limited){ app.innerHTML=`${head}<h1>${esc(b.name||'Fahrrad')}</h1>${alarm}<div class="card"><p style="margin:0 0 6px">Dieser Fahrradpass wurde vom Laden zurückgezogen und ist nicht mehr öffentlich.</p>${shopLine}</div>${shopBtn}`; return; }
  if(p.limited){ app.innerHTML=`${head}<h1>${esc(b.name||'Fahrrad')}</h1>${alarm}<div class="card">${p.stolen?'':'<p style="margin:0 0 6px"><b>Keine Diebstahlmeldung in FYF.</b> <span class="muted small">Das ist kein Nachweis – FYF ist mit keinem Polizei-Register verbunden.</span></p>'}<p style="margin:0 0 6px">Für dieses Rad gibt es einen FYF-Fahrradpass. Der Besitzer zeigt die Einträge nur Werkstätten.</p>${shopLine}<p class="muted small" style="margin:8px 0 0">Beim Kauf: Bitte den Verkäufer, den Pass auf „für jeden sichtbar“ stellen zu lassen, oder frag bei der Werkstatt nach.</p></div>${shopBtn}`; return; }
  const TR={verified:['Werkstatt-bestätigt','v'],shop:['Werkstatt (Betrieb noch nicht geprüft)','s'],self:['Selbstauskunft','s']};
  const fixed=new Set((p.entries||[]).filter(e=>e.corrects).map(e=>e.corrects));
  const items=[...(p.svc||[]).map(s=>({d:s.date,km:s.km,k:s.ins?'Inspektion':'Service',t:s.title,parts:s.parts||[],by:sh.name,tr:'shop'})),...(p.ev||[]).map(e=>({d:e.date,km:e.km,k:e.kind||'Eintrag',t:e.text,parts:[],by:sh.name,tr:'shop'})),...(p.entries||[]).map(e=>({d:e.date,km:e.km,k:e.kind,t:e.text,parts:[],by:e.shop,tr:e.trust||'shop',id:e.id,cor:e.corrects,x:fixed.has(e.id)}))].sort((a,x)=>String(x.d).localeCompare(String(a.d))||(x.id||0)-(a.id||0));
  const nv=items.filter(i=>i.tr==='verified').length;
  const shops=[...new Set(items.map(i=>i.by).filter(Boolean))];
  const chk=(p.checks||[])[0];
  app.innerHTML=`${head}<h1>${esc(b.name||'Fahrrad')}</h1>${alarm}
   <div class="card">${p.stolen?'':'<p style="margin:0 0 6px"><b>Keine Diebstahlmeldung in FYF.</b> <span class="muted small">Das ist kein Nachweis – FYF ist mit keinem Polizei-Register verbunden.</span></p>'}<p style="margin:0">${esc([b.type,b.size,b.year&&('Baujahr '+b.year)].filter(Boolean).join(' · '))}</p>${b.frame?`<p class="small" style="margin:4px 0 0">Rahmennummer (gekürzt): <b style="font-family:ui-monospace,monospace">${esc(b.frame)}</b> – mit der Nummer am Rad vergleichen</p>`:''}${b.km!=null?`<p class="small" style="margin:4px 0 0">Kilometerstand laut Werkstatt: <b>${num(b.km)} km</b></p>`:''}
   ${b.color?`<p class="small" style="margin:4px 0 0">Farbe: ${esc(b.color)}</p>`:''}${b.bat?`<p class="small" style="margin:4px 0 0">Akku (gekürzt): <b style="font-family:ui-monospace,monospace">${esc(b.bat)}</b></p>`:''}${b.batPass?`<p class="small" style="margin:4px 0 0"><a href="${esc(b.batPass)}" target="_blank" rel="noopener nofollow">Batteriepass des Herstellers öffnen</a></p>`:''}
   <p class="muted small" style="margin:8px 0 0">${items.length} Einträge von ${shops.length||1} ${shops.length>1?'Werkstätten':'Werkstatt'}, davon ${nv} werkstatt-bestätigt${p.owner_no?` · ${p.owner_no}. Besitzer seit ${fd(p.owner_since)}`:''}${p.created_at?` · Pass seit ${fd(p.created_at)}`:''}</p></div>
   ${chk?`<div class="card"><h2>Gebrauchtrad-Check</h2><p style="margin:0">Am ${fd(chk.date)}: Gesamtzustand <b>${esc(chk.grade)}</b>${chk.km!=null?` · ${num(chk.km)} km`:''}${chk.bat!=null?` · Akku ${num(chk.bat)} %`:''}</p>${chk.note?`<p class="muted small" style="margin:4px 0 0">${esc(chk.note)}</p>`:''}</div>`:''}
   <div class="card"><h2>Service-Geschichte</h2>${items.length?items.map(i=>`<div class="e${i.x?' x':''}"><b>${fd(i.d)}</b>${i.km!=null?` · ${num(i.km)} km`:''}<span class="tb ${TR[i.tr]?TR[i.tr][1]:'s'}">${esc((TR[i.tr]||TR.shop)[0])}</span><div><span class="k">${esc(i.k)}</span>${esc(i.t)}${i.x?' <i>(später korrigiert)</i>':''}</div>${i.parts.length?`<div class="small">Neue Teile: ${esc(i.parts.join(', '))}</div>`:''}<div class="muted small">${esc(i.by||'')}${i.cor?' · Korrektur zu Eintrag '+i.cor:''}${i.id?' · Nr. '+i.id:''}</div></div>`).join(''):'<p class="muted" style="margin:0">Noch keine Einträge.</p>'}
   <p class="leg"><b>Werkstatt-bestätigt</b> = eingetragen von einem durch FYF geprüften Betrieb. Einträge können nachträglich nicht geändert werden, nur durch einen sichtbaren Korrektur-Eintrag ergänzt.</p></div>
   <div class="card">${shopLine}<p class="muted small" style="margin:6px 0 0">Die Einträge stammen von den Werkstätten selbst. Der Pass enthält keine Daten über Besitzer – auch nicht über frühere. Arbeiten außerhalb von FYF-Werkstätten fehlen, wenn sie nicht nachgetragen wurden.</p></div>${shopBtn}`;
}
// ---------- Rad selbst registrieren ----------
const frameNorm=v=>String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
async function frameHash(v){ const n=frameNorm(v); const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('fyf:'+n)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
const mask=v=>{ v=String(v||''); return v.length>6?v.slice(0,3)+'•••'+v.slice(-3):v; };
const fld=(id,l,attrs='')=>`<label for="${id}" class="small" style="display:block;margin:10px 0 4px">${l}</label><input id="${id}" ${attrs} style="width:100%;font:inherit;letter-spacing:0;text-transform:none;font-weight:400">`;
function regForm(err){ app.innerHTML=`${head}<h1>Rad registrieren</h1><p class="muted">Kostenlos. Gespeichert werden nur Daten des Rads – kein Name, keine Adresse. Die Rahmennummer wird nur gekürzt angezeigt und für den Diebstahl-Abgleich verschlüsselt verglichen.</p>
  <div class="card"><form id="rg" style="display:block">${fld('rb','Marke *','required maxlength="40" autocomplete="off"')}${fld('rm','Modell *','required maxlength="60" autocomplete="off"')}
   <label for="rt" class="small" style="display:block;margin:10px 0 4px">Art</label><select id="rt" style="width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:inherit">${['Rennrad','Gravel','MTB','E-Bike','Trekking','Stadtrad','Lastenrad','Kinderrad','Sonstiges'].map(x=>`<option>${x}</option>`).join('')}</select>
   ${fld('rs','Rahmengröße','maxlength="12"')}${fld('ry','Baujahr','type="number" min="1950" max="2100" inputmode="numeric"')}${fld('rc','Farbe','maxlength="40"')}
   ${fld('rf','Rahmennummer * (meist unten am Tretlager)','required minlength="4" maxlength="40" autocomplete="off" autocapitalize="characters" style="font-family:ui-monospace,monospace"')}${fld('rk','Kilometerstand','type="number" min="0" inputmode="numeric"')}
   <label style="display:flex;gap:8px;align-items:flex-start;margin:14px 0 0;font-size:14px"><input type="checkbox" id="rx" required style="flex:none;width:auto;margin-top:4px"><span>Das Rad gehört mir. Ich habe die <a href="datenschutz.html" target="_blank">Datenschutzhinweise</a> gelesen.</span></label>
   <div style="display:none"><input id="rw" tabindex="-1" autocomplete="off"></div>
   <p style="margin:14px 0 0"><button>Registrieren</button> <a href="#" id="rgx" class="small" style="margin-left:8px">Abbrechen</a></p>${err?`<p style="color:var(--bad)">${esc(err)}</p>`:''}</form></div>`;
  document.getElementById('rgx').onclick=e=>{ e.preventDefault(); askForm(''); };
  document.getElementById('rg').onsubmit=async e=>{ e.preventDefault(); if(document.getElementById('rw').value) return; const g=id=>document.getElementById(id).value.trim();
    if(frameNorm(g('rf')).length<4) return regForm('Bitte die Rahmennummer eingeben.');
    const bike={name:(g('rb')+' '+g('rm')).trim(),type:g('rt'),size:g('rs'),year:g('ry')?Number(g('ry')):'',color:g('rc'),frame:mask(frameNorm(g('rf'))),km:g('rk')?Number(g('rk')):null};
    let r; try{ const fh=await frameHash(g('rf')); const x=await fetch(CFG.u+'/rest/v1/rpc/pass_register',{method:'POST',headers:{apikey:CFG.k,'Content-Type':'application/json'},body:JSON.stringify({p_payload:{bike,date:new Date().toISOString().slice(0,10)},p_fh:fh})}); if(!x.ok) throw 0; r=await x.json(); }catch(x){ return regForm('Gerade nicht erreichbar. Bitte später erneut versuchen.'); }
    if(!r||r.error) return regForm(r&&r.error==='FYF_FRAME_EXISTS'?'Für diese Rahmennummer gibt es schon einen FYF-Fahrradpass. Hast du das Rad gekauft? Lass dir vom Verkäufer die Karte „Teil II“ geben und gehe damit in eine FYF-Werkstatt.':r&&r.error==='FYF_RATE'?'Heute sind sehr viele Registrierungen eingegangen. Bitte morgen erneut versuchen.':'Bitte die Eingaben prüfen.');
    mineAdd(r.code,bike.name); regDone(r.code,r.transfer,bike); }; }
function loadQR(){ return window.qrcode?Promise.resolve():new Promise((ok,no)=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js'; s.onload=ok; s.onerror=no; document.head.appendChild(s); }); }
async function regDone(code,transfer,bike){ const url=location.origin+location.pathname+'#c='+code+(CF?'&cfg='+CF:''); let qr=''; try{ await loadQR(); const q=window.qrcode(0,'M'); q.addData(url); q.make(); qr=q.createSvgTag({cellSize:4,margin:1,scalable:true}); }catch(e){}
  const tr=transfer.replace(/(.{4})(?=.)/g,'$1-');
  app.innerHTML=`${head}<h1>Registriert</h1><div class="card"><p class="ok" style="margin:0 0 6px">Dein Rad hat jetzt einen FYF-Fahrradpass.</p><p style="margin:0">Pass-Code: <b style="font-family:ui-monospace,monospace;font-size:20px;letter-spacing:.08em">${code}</b></p>
   <p style="margin:12px 0 0"><b>Übergabe-Code (Teil II):</b></p><p style="font:700 20px ui-monospace,monospace;letter-spacing:.06em;border:2px dashed var(--line);border-radius:10px;padding:8px 12px;display:inline-block;margin:6px 0">${tr}</p>
   <p class="small" style="margin:0;color:var(--bad)"><b>Wird nur jetzt angezeigt.</b> Jetzt drucken oder als Foto sichern. Mit diesem Code stellst du den Pass ein, meldest Diebstahl und gibst das Rad beim Verkauf weiter.</p>
   <p style="margin:14px 0 0"><button id="prt">Fahrradschein und Aufkleber drucken</button></p></div>
   <div class="card"><h2>Aufkleber</h2><p class="muted small" style="margin:0">Selbst drucken: auf Papier drucken, ausschneiden und mit klarem Klebeband überkleben – oder mit einem Etikettiergerät. Ein wetterfester FYF-Aufkleber per Post folgt bald. Jede FYF-Werkstatt kann dir auch einen drucken.</p></div>
   <p><a class="btn ghost" href="#c=${code}${CF?'&cfg='+CF:''}">Zum Fahrradpass</a> <a class="btn ghost" href="finder.html#pass=${code}${CF?'&cfg='+CF:''}">Service bei FYF-Werkstatt buchen</a></p>`;
  document.getElementById('prt').onclick=()=>{ const w=window.open('','_blank'); if(!w) return alert('Bitte Pop-ups erlauben');
    const one=`<div class="st"><div class="q">${qr}</div><div><b>FYF Fahrradpass</b><div class="c">${code}</div><div class="m">Scannen: Geschichte des Rads</div></div></div>`;
    w.document.write(`<!doctype html><html lang="de"><meta charset="utf-8"><title>Fahrradschein ${code}</title><style>body{font-family:system-ui,sans-serif;color:#1d2a30;margin:16px}.card{width:85.6mm;height:54mm;border:1px solid #bbb;border-radius:3.2mm;padding:3.5mm;box-sizing:border-box;position:relative;margin:0 0 6mm}.t{font-size:7pt;letter-spacing:.12em;font-weight:800;color:#d9612c}.n{font-size:12pt;font-weight:700;margin:1mm 0}.r{font-size:7.5pt}.qq{position:absolute;right:3mm;top:3mm;width:24mm;height:24mm}.qq svg,.q svg{width:100%;height:100%}.c{font:700 15px ui-monospace,monospace;letter-spacing:.08em}.tr{font:700 13pt ui-monospace,monospace;border:1.5px dashed #1d2a30;border-radius:2mm;padding:1.5mm 2mm;display:inline-block;margin:1.5mm 0}.m{font-size:8px;color:#555}.g{display:grid;grid-template-columns:repeat(auto-fill,60mm);gap:6mm}.st{width:60mm;height:25mm;border:1px dashed #999;border-radius:3mm;display:flex;gap:2.5mm;align-items:center;padding:2mm;box-sizing:border-box}.q{width:21mm;height:21mm;flex:none}b{font-size:10px}button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 16px;background:#1d2a30;color:#fff;margin-bottom:12px}@media print{button{display:none}}</style>
<button onclick="print()">Drucken</button>
<div class="card"><div class="t">FYF FAHRRADSCHEIN · TEIL I</div><div class="n">${esc(bike.name)}</div><div class="qq">${qr}</div><div class="r">Rahmennr. (gekürzt) <b>${esc(bike.frame)}</b><br>${esc([bike.type,bike.size,bike.year,bike.color].filter(Boolean).join(' · '))}</div><div style="position:absolute;left:3.5mm;bottom:3mm"><div class="m">Fahrradpass-Code</div><div class="c" style="font-size:15pt">${code}</div></div></div>
<div class="card"><div class="t">FYF FAHRRADSCHEIN · TEIL II – ÜBERGABE</div><div class="n" style="font-size:10pt">${esc(bike.name)} · ${code}</div><div class="m" style="font-size:6.5pt">Geheimer Übergabe-Code – sicher aufbewahren, nur beim Verkauf weitergeben:</div><div class="tr">${tr}</div><div class="m" style="font-size:6.5pt">Damit stellst du den Pass ein (fyf Fahrradpass-Seite → Besitzer-Bereich) und überträgst ihn beim Verkauf in einer FYF-Werkstatt.</div></div>
<p class="m">Aufkleber (ausschneiden, mit klarem Klebeband überkleben):</p><div class="g">${one.repeat(4)}</div></html>`); w.document.close(); }; }
// Besitzer-Bereich: mit dem Übergabe-Code von Teil II (kein Konto nötig)
let OWN='';
async function ownerCall(code,action,value){ const r=await fetch(CFG.u+'/rest/v1/rpc/pass_owner',{method:'POST',headers:{apikey:CFG.k,'Content-Type':'application/json'},body:JSON.stringify({p_code:code,p_transfer:OWN,p_action:action,p_value:value||null})}); if(!r.ok) throw new Error('net'); return r.json(); }
const OERR={FYF_BAD_TRANSFER:'Der Übergabe-Code stimmt nicht. Er steht auf der Karte „Teil II“ (12 Zeichen).',FYF_RATE:'Zu viele Versuche. Bitte morgen erneut versuchen.',FYF_BAD_DATA:'Bitte die Eingaben prüfen.',FYF_NOT_FOUND:'Pass nicht gefunden.'};
function ownerBox(code,r0){ const P=window.__P||{}; if(P.withdrawn) return; const box=document.createElement('div'); box.className='card'; box.id='own'; app.appendChild(box);
  const lock=()=>{ box.innerHTML=`<h2>Du bist der Besitzer?</h2><p class="muted small" style="margin:0 0 8px">Mit dem Übergabe-Code von deiner Karte „Teil II“ kannst du selbst einstellen, wer den Pass sieht, das Rad als gestohlen melden und eigene Arbeiten eintragen (als „Selbstauskunft“ gekennzeichnet).</p><form id="of"><input id="oc" maxlength="16" placeholder="XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters" aria-label="Übergabe-Code"><button>Öffnen</button></form><p id="oe" style="color:var(--bad);margin:6px 0 0"></p>`;
    box.querySelector('#of').onsubmit=async e=>{ e.preventDefault(); OWN=String(box.querySelector('#oc').value||''); try{ const r=await ownerCall(code,'check'); if(r.error){ OWN=''; box.querySelector('#oe').textContent=OERR[r.error]||'Nicht möglich'; return; } panel(r); }catch(x){ box.querySelector('#oe').textContent='Gerade nicht erreichbar.'; } }; };
  const panel=r=>{ box.innerHTML=`<h2>Besitzer-Bereich</h2><p class="muted small" style="margin:0 0 10px">${r.owner_no?r.owner_no+'. Besitzer · ':''}Änderungen gelten sofort. Deine Werkstatt sieht sie ebenfalls.</p>
     <p style="margin:0 0 6px"><b>Wer sieht den Pass?</b></p><div class="row" style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn ${r.visibility==='public'?'':'ghost'}" data-v="public">Jeder (gut beim Verkauf)</button><button class="btn ${r.visibility==='shops'?'':'ghost'}" data-v="shops">Nur Werkstätten</button></div>
     <p style="margin:14px 0 6px"><b>Diebstahl</b></p>${r.stolen?'<button class="btn" data-s="0">Rad ist wieder da – Meldung aufheben</button>':'<button class="btn" style="background:var(--bad)" data-s="1">Als gestohlen melden</button>'}<p class="muted small" style="margin:6px 0 0">Die Anzeige bei der Polizei musst du selbst erstatten – FYF ist mit keinem Polizei-Register verbunden.</p>
     <p style="margin:14px 0 6px"><b>Eigene Arbeit eintragen</b> <span class="muted small">(erscheint als „Selbstauskunft“)</span></p>
     <form id="oen" style="display:grid;gap:8px"><select id="ok" style="font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:inherit">${['Umbau','Teiletausch','Pflege','Reparatur','Schaden','Kauf'].map(x=>`<option>${x}</option>`).join('')}</select><input id="ot" required minlength="3" maxlength="500" placeholder="Was wurde gemacht? z. B. neuer Sattel" style="font:inherit;letter-spacing:0;text-transform:none;font-weight:400"><input id="okm" type="number" min="0" inputmode="numeric" placeholder="Kilometerstand (optional)" style="font:inherit;letter-spacing:0;font-weight:400"><button>Eintragen</button></form><p id="om" class="muted small" style="margin:6px 0 0"></p>
     <p style="margin:14px 0 6px"><b>Deine Daten</b></p><button class="btn ghost" id="oexp" type="button">Fahrradpass als Datei sichern</button> <button class="btn ghost" type="button" onclick="print()">Drucken / PDF</button>`;
    const act=async(a,v)=>{ try{ const x=await ownerCall(code,a,v); if(x.error){ box.querySelector('#om').textContent=OERR[x.error]||'Nicht möglich'; return; } await show0(code); ownerBox(code,x); const nb=document.getElementById('own'); if(nb) nb.scrollIntoView({block:'start'}); }catch(e){ box.querySelector('#om').textContent='Gerade nicht erreichbar.'; } };
    box.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>act('vis',{v:b.dataset.v}));
    box.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ if(b.dataset.s==='1'&&!confirm('Rad als gestohlen melden? Jeder Scan zeigt dann eine Warnung, und eine Übergabe an einen neuen Besitzer ist gesperrt.')) return; act('stolen',{v:b.dataset.s==='1'}); });
    box.querySelector('#oexp').onclick=()=>{ const P=window.__P||{}; const data={format:'FYF-Fahrradpass',version:1,exported:new Date().toISOString(),code,bike:P.bike,owner_no:P.owner_no,owner_since:P.owner_since,stolen:P.stolen,checks:P.checks||[],entries:(P.entries||[]).map(e=>({nr:e.id,date:e.date,kind:e.kind,text:e.text,km:e.km,by:e.shop,trust:e.trust,corrects:e.corrects||null}))}; const u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})); const a=document.createElement('a'); a.href=u; a.download='FYF-Fahrradpass-'+code+'.json'; document.body.appendChild(a); a.click(); a.remove(); };
    box.querySelector('#oen').onsubmit=e=>{ e.preventDefault(); act('entry',{kind:box.querySelector('#ok').value,text:box.querySelector('#ot').value,km:box.querySelector('#okm').value}); }; };
  if(r0) panel(r0); else lock(); }
async function show(code){ await show0(code); const P=window.__P; if(!P||!/^[A-HJ-NP-Z2-9]{8}$/.test(code)) return;
  const name=(P.bike&&P.bike.name)||'Fahrrad', isMine=mine().some(m=>m.code===code), h1=app.querySelector('h1');
  if(isMine){ mineAdd(code,name); if(h1) h1.insertAdjacentHTML('afterend',await walletCard(code,name)+(P.limited&&!P.withdrawn?`<div class="card small">Dein Pass ist auf „Nur Werkstätten“ gestellt – darum siehst du hier nur die Kurzansicht. Unten im <b>Besitzer-Bereich</b> mit dem Code von Teil II auf „Jeder“ stellen, dann siehst du die ganze Geschichte.</div>`:'')); }
  if(window.__OFF&&h1) h1.insertAdjacentHTML('afterend',`<div class="card small" style="border-color:var(--acc)">Offline – gespeicherter Stand vom ${fd(window.__OFF)}.</div>`);
  const bar=document.createElement('p'); bar.innerHTML=isMine?`<a href="#meine${CF?'&cfg='+CF:''}">← Meine Räder</a>`:`<button class="btn" id="addMine">Zu „Meine Räder“ hinzufügen</button> <span class="muted small">– nur auf diesem Gerät gespeichert</span>`; app.appendChild(bar);
  const am=document.getElementById('addMine'); if(am) am.onclick=()=>{ mineAdd(code,name); cacheSet(code,P); show(code); };
  if(!window.__OFF) ownerBox(code); }
// ---------- App „FYF Pass“: Meine Räder (nur auf diesem Gerät), digitaler Pass mit QR, offline lesbar ----------
const LS=k=>{ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }, LSset=(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
const mine=()=>LS('fyfpass:mine')||[];
const mineAdd=(code,name)=>{ const l=mine().filter(m=>m.code!==code); l.unshift({code,name:String(name||'Fahrrad').slice(0,80),at:new Date().toISOString().slice(0,10)}); LSset('fyfpass:mine',l.slice(0,20)); };
const mineDel=code=>{ LSset('fyfpass:mine',mine().filter(m=>m.code!==code)); try{ localStorage.removeItem('fyfpass:c:'+code); }catch(e){} };
const cacheGet=code=>LS('fyfpass:c:'+code), cacheSet=(code,p)=>LSset('fyfpass:c:'+code,{p,at:new Date().toISOString()});
const standalone=()=>window.navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
const ios=()=>/iPhone|iPad|iPod/.test(navigator.userAgent);
function myBikesHtml(){ const l=mine(); if(!l.length) return '';
  return `<div class="card"><h2>Meine Räder</h2>${l.map(m=>`<div class="e" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><a href="#c=${m.code}${CF?'&cfg='+CF:''}" style="color:inherit;text-decoration:none;flex:1"><b>${esc(m.name)}</b><br><span class="muted small" style="font-family:ui-monospace,monospace">${m.code}</span></a><button class="btn ghost" data-del="${m.code}" aria-label="Entfernen" style="padding:6px 10px">×</button></div>`).join('')}</div>`; }
function installHint(){ if(standalone()) return ''; return `<div class="card"><b>Als App aufs iPhone</b><p class="muted small" style="margin:4px 0 0">${ios()?'In Safari unten auf <b>Teilen</b> (Quadrat mit Pfeil) → <b>Zum Home-Bildschirm</b>. Dann hast du „FYF Pass“ wie eine App.':'Im Browser-Menü <b>App installieren</b> bzw. <b>Zum Startbildschirm</b> wählen.'}</p></div>`; }
async function walletCard(code,name){ const url=location.origin+location.pathname+'#c='+code+(CF?'&cfg='+CF:''); let qr=''; try{ await loadQR(); const q=window.qrcode(0,'M'); q.addData(url); q.make(); qr=q.createSvgTag({cellSize:4,margin:1,scalable:true}); }catch(e){}
  return `<div class="card" style="background:#1f2a30;color:#fff;border:0"><div style="display:flex;gap:14px;align-items:center"><div style="width:96px;height:96px;background:#fff;border-radius:10px;padding:5px;flex:none">${qr||'<span style="color:#555;font-size:11px">QR braucht Internet</span>'}</div><div style="min-width:0"><div style="font-size:11px;letter-spacing:.14em;font-weight:800;color:#f07a45">FYF FAHRRADPASS</div><div style="font-weight:700;font-size:18px;margin:2px 0">${esc(name||'Fahrrad')}</div><div style="font:700 20px ui-monospace,monospace;letter-spacing:.08em">${code}</div><div style="font-size:12px;opacity:.75;margin-top:4px">In der Werkstatt vorzeigen</div></div></div></div>`; }
function route(){ const h=new URLSearchParams((location.hash||'').slice(1)); const c=norm(h.get('c')); if(c) show(c); else askForm(''); }
window.addEventListener('hashchange',route); route();
try{ if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js'); }catch(e){}
</script>
