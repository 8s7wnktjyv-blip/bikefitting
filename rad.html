const num=v=>Number(v).toLocaleString('de-DE');
const unb64u=s=>decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4))));

let CFG=DEFAULT; try{ if(CF){ const c=JSON.parse(unb64u(CF)); if(/^https:\/\/tyfilehmrnibtoalwflf\.supabase\.co$|^http:\/\/localhost(:\d+)?$/.test(c.u)&&c.k&&!/^sb_secret_/.test(c.k)) CFG=c; } }catch(e){}

const INTRO=[
 ['Dein Rad bekommt einen Pass','Registriere dein Fahrrad kostenlos – ohne Konto und ohne Namen. Du bekommst einen Code und einen QR-Aufkleber.','<svg viewBox="0 0 120 120"><circle cx="34" cy="78" r="18" fill="none" stroke="currentColor" stroke-width="4" class="draw"/><circle cx="88" cy="78" r="18" fill="none" stroke="currentColor" stroke-width="4" class="draw"/><path d="M34 78l18-32h22l14 32M52 46l8 32H34M66 36h12" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="draw"/><rect x="56" y="54" width="16" height="16" rx="3" fill="#d9612c"/></svg>'],
 ['QR-Code aufs Rad kleben','Am Rahmen klebt dein QR-Code. Jede FYF-Werkstatt scannt ihn und trägt Service, Reparaturen und neue Teile ein.','<svg viewBox="0 0 120 120"><rect x="25" y="25" width="70" height="70" rx="10" fill="none" stroke="currentColor" stroke-width="4"/><path d="M38 38h14v14H38zM68 38h14v14H68zM38 68h14v14H38zM66 66h6v6h-6zM76 76h6v6h-6zM66 78h4M78 66h4" fill="currentColor"/><rect class="scanline" x="20" y="40" width="80" height="4" rx="2" fill="#d9612c"/></svg>'],

  const el=document.createElement('div'); el.className='intro'; el.setAttribute('role','dialog'); el.setAttribute('aria-label','Einführung FYF Pass'); document.body.appendChild(el);

  const draw=()=>{ const [t,x,svg]=INTRO[i]; el.innerHTML=`<div style="text-align:right"><button class="btn ghost" id="isk" style="padding:6px 12px">Überspringen</button></div><div class="sl fy-in"><div class="ill" style="color:var(--ink)">${svg}</div><h1 style="margin:0">${t}</h1><p class="muted" style="margin:0;font-size:17px">${x}</p></div><div class="dots">${INTRO.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div><button id="inx" style="width:100%;max-width:420px;margin:0 auto;display:block;padding:14px">${i<INTRO.length-1?'Weiter':'Los geht’s'}</button>${i===INTRO.length-1?'<button id="iall" class="btn ghost" style="width:100%;max-width:420px;margin:10px auto 0;display:block;padding:12px">Alle Funktionen erklärt</button>':''}`;
    el.querySelector('#isk').onclick=done; const ia=el.querySelector('#iall'); if(ia) ia.onclick=()=>{ done(); guide(); }; el.querySelector('#inx').onclick=()=>{ if(i<INTRO.length-1){ i++; draw(); } else done(); }; };
  let sx=null; el.addEventListener('touchstart',e=>{ sx=e.touches[0].clientX; },{passive:true}); el.addEventListener('touchend',e=>{ if(sx==null) return; const dx=e.changedTouches[0].clientX-sx; if(dx<-50&&i<INTRO.length-1){ i++; draw(); } else if(dx>50&&i>0){ i--; draw(); } sx=null; });

     <button class="btn block" id="scanb" type="button" style="margin-bottom:6px"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"/></svg>QR-Code scannen</button><p class="muted small" style="text-align:center;margin:8px 0">oder Code eintippen</p>
     <form id="f" style="display:grid;gap:10px"><input id="c" maxlength="30" placeholder="Code oder Rahmennummer" autocomplete="off" autocapitalize="characters" aria-label="Fahrradpass-Code" required style="text-align:center;font:700 22px ui-monospace,Menlo,monospace!important;letter-spacing:.14em"><button class="btn block ghost">Prüfen</button></form>${err?`<p style="color:var(--bad);margin:10px 0 0">${esc(err)}</p>`:''}

  }

async function show0(code){ window.__P=null; window.__OFF=null;
  if(!/^[A-HJ-NP-Z2-9]{8}$/.test(code)) return askForm('Der Code hat 8 Zeichen (ohne 0, O, 1 und I).');
  let p; try{ const ot=ownGet(code); if(ot){ try{ const o=await rpc('pass_get_owner',{p_code:code,p_transfer:ot}); if(o&&!o.error) p=o; else if(o&&o.error==='FYF_BAD_TRANSFER') ownDel(code); }catch(x){ if(!x.missing) throw x; } } if(!p){ const r=await fetch(CFG.u+'/rest/v1/rpc/pass_get',{method:'POST',headers:{apikey:CFG.k,'Content-Type':'application/json'},body:JSON.stringify({p_code:code})}); if(!r.ok) throw 0; p=await r.json(); } }catch(e){ const c0=cacheGet(code); if(c0){ p=c0.p; window.__OFF=c0.at; } else { app.innerHTML=`${head}<h1>Gerade nicht erreichbar</h1><div class="card">Bitte später noch einmal versuchen.</div>`; return; } }
  if(p&&!window.__OFF&&mine().some(m=>m.code===code)) cacheSet(code,p);

  const alarm=p.stolen?`<div class="alarm">Dieses Rad ist als gestohlen gemeldet. Bitte nicht kaufen und die Polizei oder die Werkstatt ${esc(sh.name||'')} informieren${sh.phone?' ('+esc(sh.phone)+')':''}.</div>`:'';
  const shopLine=p.self&&!sh.name?`<p class="muted small" style="margin:0">Vom Besitzer selbst registriert – noch von keiner Werkstatt betreut.</p>`:`<p class="muted small" style="margin:0">Pass geführt von <b>${esc(sh.name||'einer FYF-Werkstatt')}</b>${sh.addr?' · '+esc(sh.addr):''}${tel}</p>`;
  const mineIt=mine().some(m=>m.code===code), svc=`finder.html#pass=${code}&want=service${CF?'&cfg='+esc(CF):''}`;
  const sub=esc([b.type||mineType(code),b.size&&('Gr. '+b.size),b.year].filter(Boolean).join(' · '));
  const statusLine=p.stolen?'<div class="status bad"><i></i>Als gestohlen gemeldet</div>':`<div class="status"><i></i>Keine Diebstahlmeldung in FYF</div>`;
  const heroH=`<div class="hero"><div style="position:relative">${bikePic(mineIt?code:'',b.type||mineType(code))}${mineIt?'<button class="btn photo-btn" id="photo" type="button">Foto</button>':''}</div><div class="meta"><h1 style="margin:0 0 4px;font-size:28px">${esc(b.name||'Fahrrad')}</h1><div class="muted small" style="margin-bottom:8px">${sub}</div>${statusLine}</div></div>`;
  const dropBar=/rennrad|gravel|cyclocross|zeitfahr|triathlon/i.test(b.type||mineType(code)||'')||/drop|rennlenker|gravellenker|aerolenker|basebar/i.test(String(((X(code).parts)||{}).bar||'')+' '+String((b.parts||{}).bar||''));
  const acts=`<div class="actions">${mineIt?`<button class="btn" id="qrShow" type="button">QR zeigen</button>`:`<button class="btn" id="addMine" type="button">In Garage</button>`}<a class="btn ghost" href="${svc}">Service buchen</a></div>${mineIt&&dropBar?`<a class="btn ghost block fitbtn" href="finder.html#pass=${code}&want=fitting${CF?'&cfg='+esc(CF):''}" style="margin:-4px 0 12px"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="2"/><path d="M8 21l2-7 4 1 1 6M10 14l-1-5 5 1 3 3"/></svg>Bikefitting buchen</a>`:''}`+(mineIt&&orderOn()?`<button class="btn block ghost" id="orderBtn" type="button" style="margin:-2px 0 12px">Aufkleber bestellen</button>`:'');
  const infoBox=`<details class="more"><summary>Details zum Rad</summary><div>${b.frame?`<p style="margin:0 0 6px">Rahmennummer (gekürzt): <b style="font-family:ui-monospace,monospace">${esc(b.frame)}</b></p>`:''}${b.color?`<p style="margin:0 0 6px">Farbe: ${esc(b.color)}</p>`:''}${b.bat?`<p style="margin:0 0 6px">Akku (gekürzt): <b style="font-family:ui-monospace,monospace">${esc(b.bat)}</b></p>`:''}${b.batPass?`<p style="margin:0 0 6px"><a href="${esc(b.batPass)}" target="_blank" rel="noopener nofollow">Batteriepass des Herstellers</a></p>`:''}${shopLine}<p class="muted small" style="margin:8px 0 0">Code ${code}${p.created_at?' · Pass seit '+fd(p.created_at):''}. Einträge stammen von den Werkstätten. Keine Daten über Besitzer. Fehlt eine Diebstahlmeldung, ist das kein Beweis.</p><p class="small" style="margin:8px 0 0"><a href="index.html#rad=${code}">Ich bin Werkstatt</a></p></div></details>`;
  const ownHost=`<details class="more" id="ownd"><summary>Besitzer-Einstellungen</summary><div id="ownhost"></div></details>`;
  if(p.withdrawn&&p.limited){ app.innerHTML=`${head}${heroH}${alarm}<div class="card">Dieser Pass wurde vom Laden zurückgezogen.</div>${infoBox}`; return; }
  if(p.limited){ app.innerHTML=`${head}${heroH}${alarm}${acts}<div class="card"><b>Geschichte nur für Werkstätten sichtbar</b><p class="muted small" style="margin:4px 0 0">${mineIt?'Gib unten in den Besitzer-Einstellungen einmal deinen Code von Karte Teil II ein („Auf diesem Gerät merken“) – dann siehst du hier alles, was Werkstatt und Fitting eintragen.':'Beim Kauf den Verkäufer bitten, den Pass freizugeben.'}</p></div>${infoBox}${ownHost}`; return; }
  const TR={verified:['Bestätigt','v'],shop:['Werkstatt','s'],self:['Selbstauskunft','s']};

  const nv=items.filter(i=>i.tr==='verified').length, chk=(p.checks||[])[0];

   <div class="tiles4"><div class="tile"><div class="l">km</div><div class="v">${b.km!=null?num(b.km):'–'}</div></div><div class="tile"><div class="l">Einträge</div><div class="v">${items.length}</div></div><div class="tile"><div class="l">Bestätigt</div><div class="v">${nv}</div></div><div class="tile"><div class="l">Besitzer</div><div class="v">${p.owner_no||1}.</div></div></div>

   <h2>Geschichte</h2><div class="card">${items.length?items.map(i=>`<div class="e${i.x?' x':''}"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(i.k)}</b><span class="muted small">${fd(i.d)}</span></div><div style="margin:2px 0">${esc(i.t)}${i.x?' <i>(korrigiert)</i>':''}</div>${i.parts.length?`<div class="small">Neue Teile: ${esc(i.parts.join(', '))}</div>`:''}<div class="muted small">${esc(i.by||'')}${i.km!=null?' · '+num(i.km)+' km':''}<span class="tb ${TR[i.tr]?TR[i.tr][1]:'s'}">${esc((TR[i.tr]||TR.shop)[0])}</span></div></div>`).join(''):'<p class="muted" style="margin:0">Noch keine Einträge.</p>'}</div>
   ${infoBox}${ownHost}`;

}

const frameNorm=v=>String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
async function frameHash(v){ const n=frameNorm(v); const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('fyf:'+n)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
const mask=v=>{ v=String(v||''); return v.length>6?v.slice(0,3)+'•••'+v.slice(-3):v; };
const fld=(id,l,attrs='')=>`<label for="${id}" class="small" style="display:block;margin:10px 0 4px">${l}</label><input id="${id}" ${attrs} style="width:100%;font:inherit;letter-spacing:0;text-transform:none;font-weight:400">`;
function regForm(err){ app.innerHTML=`${head}<h1>Rad registrieren</h1><p class="muted" style="margin:-6px 0 6px">Kostenlos. Ohne Name und Adresse.</p>
  <div class="card"><form id="rg" style="display:block">${fld('rb','Marke *','required maxlength="40" autocomplete="off"')}${fld('rm','Modell *','required maxlength="60" autocomplete="off"')}
   <label for="rt" class="small" style="display:block;margin:10px 0 4px">Art</label><select id="rt" style="width:100%">${BIKE_CATS.map(([g,l])=>`<optgroup label="${g}">${l.map(x=>`<option>${x}</option>`).join('')}</optgroup>`).join('')}</select><div id="rtPrev" class="bikepic" style="margin-top:10px;border-radius:18px"></div>
   ${fld('rs','Rahmengröße','maxlength="12"')}${fld('ry','Baujahr','type="number" min="1950" max="2100" inputmode="numeric"')}${fld('rc','Farbe','maxlength="40"')}

      if(isNew){ try{ localStorage.removeItem(IMGO+code); localStorage.setItem(IMGO+code,N.alpha?src.toDataURL('image/png'):src.toDataURL('image/jpeg',.8)); }catch(x){ try{ localStorage.removeItem(IMGO+code); }catch(y){} } }
      el.remove(); show(code); } };
  fit(); }
/* ===== v.93 Mein Rad: Service-Erinnerungen, Sitzposition, Fahrwerk, Reifendruck, Ausstattung, Belege, E-Bike & Akku, Verkaufen, Diebstahl-Notfall =====

const X=code=>LS('fyfpass:x:'+code)||{}, Xset=(code,o)=>LSset('fyfpass:x:'+code,o), Xup=(code,k,v)=>{ const o=X(code); o[k]=v; Xset(code,o); return o; };
const today=()=>new Date().toISOString().slice(0,10);
const addMonths=(d,m)=>{ const x=new Date(d+'T09:00:00'); x.setMonth(x.getMonth()+m); return x.toISOString().slice(0,10); };
const dnum=v=>{ const n=parseFloat(String(v??'').replace(',','.')); return isFinite(n)?n:null; };
const f1=(v,d=1)=>Number(v).toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
const isE=t=>/(^|[\s(])e-|e-bike|pedelec|elektro/i.test(t||'');

const bikeName=code=>((Pof(code).bike||{}).name||(mine().find(m=>m.code===code)||{}).name||'Fahrrad');
const passLink=code=>location.origin+location.pathname+'#c='+code;
const curKm=code=>{ const x=X(code), b=Pof(code).bike||{}; let s=0; try{ s=shopData(code).km||0; }catch(e){} return Math.max(dnum(x.km)||0,dnum(b.km)||0,s)||null; };

function icsFile(events,name){ const z=s=>String(s).replace(/[,;\\]/g,m=>'\\'+m).replace(/\n/g,'\\n'), st=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const body=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//FYF//Fahrradpass//DE','CALSCALE:GREGORIAN',...events.flatMap((e,i)=>{ const d=e.date.replace(/-/g,''); return ['BEGIN:VEVENT','UID:fyf-'+d+'-'+i+'-'+Math.random().toString(36).slice(2,8)+'@fyf','DTSTAMP:'+st,'DTSTART;VALUE=DATE:'+d,'SUMMARY:'+z(e.title),'DESCRIPTION:'+z(e.text||''),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+z(e.title),'TRIGGER:PT9H','END:VALARM','END:VEVENT']; }),'END:VCALENDAR'].join('\r\n');
  const u=URL.createObjectURL(new Blob([body],{type:'text/calendar'})); const a=document.createElement('a'); a.href=u; a.download=(name||'FYF-Erinnerung')+'.ics'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); }

// IndexedDB für Belegfotos
const IDB={ db:null, open(){ return this.db?Promise.resolve(this.db):new Promise((ok,no)=>{ const r=indexedDB.open('fyfpass',1); r.onupgradeneeded=()=>r.result.createObjectStore('files'); r.onsuccess=()=>{ this.db=r.result; ok(this.db); }; r.onerror=()=>no(r.error); }); },
  async put(k,v){ const db=await this.open(); return new Promise((ok,no)=>{ const t=db.transaction('files','readwrite'); t.objectStore('files').put(v,k); t.oncomplete=ok; t.onerror=()=>no(t.error); }); },
  async get(k){ const db=await this.open(); return new Promise((ok,no)=>{ const r=db.transaction('files').objectStore('files').get(k); r.onsuccess=()=>ok(r.result); r.onerror=()=>no(r.error); }); },
  async del(k){ const db=await this.open(); return new Promise(ok=>{ const t=db.transaction('files','readwrite'); t.objectStore('files').delete(k); t.oncomplete=ok; t.onerror=ok; }); } };
function shrink(file,max=1400,q=.78){ return fileToImg(file).then(img=>{ const sc=Math.min(1,max/Math.max(img.width,img.height)), cv=document.createElement('canvas'); cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc); const g=cv.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,cv.width,cv.height); g.drawImage(img,0,0,cv.width,cv.height); return new Promise(ok=>cv.toBlob(ok,'image/jpeg',q)); }); }

/* ===== v.94 Daten aus Werkstatt & Fitting automatisch übernehmen (Service erledigt, km, Teile, Ausstattung, Akku) ===== */
const SVC_KEYS=[['chain',/kette/i],['brake',/brems(bel|klotz)|belag|beläge/i],['tire',/reifen|mantel|schlauch|tubeless/i],['bleed',/entlüft|bremsflüss|mineralöl|dot[- ]?\d/i],['milk',/milch|dichtmittel/i],['fork',/gabel/i],['shock',/dämpfer/i],['esw',/software|firmware|update|diagnose|fehlerspeicher/i],['ebat',/akku/i]];
const PART_KEYS=[['chain',/kette(?!nblatt)/i],['cassette',/kassette|ritzel/i],['chainring',/kettenblatt/i],['pads',/brems(bel|klotz)|belag|beläge/i],['rotors',/bremsscheibe/i],['brakes',/bremse(?!n?bel)|bremssattel|bremshebel/i],['tires',/reifen|mantel/i],['wheels',/laufrad|felge/i],['saddle',/sattel(?!stütze)/i],['post',/sattelstütze|dropper/i],['bar',/lenker(?!band)/i],['stem',/vorbau/i],['pedals',/pedal/i],['rd',/schaltwerk/i],['fd',/umwerfer/i],['shifters',/schalthebel|schaltgriff|bremsschalthebel/i],['crankset',/kurbel(?!länge)/i],['bb',/innenlager|tretlager/i],['groupset',/schaltgruppe/i],['fork',/gabel/i],['shock',/dämpfer/i]];
const SHOP_PART_MAP={material:'material',groupset:'groupset',crank:'crank',bar:'bar',stem:'stem',saddleWidth:'saddle',post:'post',cleats:'cleats'};
function shopData(code){ const P=Pof(code), b=P.bike||{}; const E=(P.entries||[]).filter(e=>!e.x&&e.kind!=='Registrierung'&&!/diebstahl/i.test(e.kind||'')); const fixed=new Set(E.filter(e=>e.corrects).map(e=>e.corrects)); const L=E.filter(e=>!fixed.has(e.id));
  const svc={}, parts={}, newParts=[]; let km=dnum(b.km)||0;
  const mark=(k,e)=>{ if(!e.date) return; if(!svc[k]||String(e.date)>svc[k].d) svc[k]={d:String(e.date).slice(0,10),km:e.km??null,src:e.trust==='self'?'Selbstauskunft':(e.shop||'Werkstatt')}; };
  L.forEach(e=>{ const t=`${e.kind||''} ${e.text||''}`; if(e.km!=null) km=Math.max(km,Number(e.km)||0);
    if(/inspektion|jahresservice|wartung|^service/i.test(e.kind||'')||/inspektion|jahresservice|großer service/i.test(e.text||'')){ ['insp','chain','brake','tire'].forEach(k=>mark(k,e)); if(isE(b.type||'')) ['esw','ebat'].forEach(k=>mark(k,e)); }
    SVC_KEYS.forEach(([k,re])=>{ if(re.test(t)) mark(k,e); });
    const m=/Neue Teile:\s*(.+)$/i.exec(e.text||''); if(m) m[1].split(/,\s*/).forEach(raw=>{ const v=raw.replace(/^\d+×\s*/,'').trim(); if(!v) return; newParts.push({d:e.date,v,shop:e.shop}); const pk=(PART_KEYS.find(([k,re])=>re.test(v))||[])[0]; if(pk&&(!parts[pk]||String(e.date)>=parts[pk].d)) parts[pk]={v,d:String(e.date).slice(0,10),src:e.shop||'Werkstatt'}; }); });
  (P.checks||[]).forEach(c=>{ if(c.km!=null) km=Math.max(km,Number(c.km)||0); });
  const bp=b.parts||{}, pd=String(P.updated_at||P.created_at||'').slice(0,10)||'0000-00-00'; Object.entries(bp).forEach(([k,v])=>{ const f=SHOP_PART_MAP[k]; if(f&&v&&!parts[f]) parts[f]={v:String(v),d:pd,src:(P.shop&&P.shop.name)||'Werkstatt'}; });
  const bat=(P.checks||[]).filter(c=>c.bat!=null||c.cycles!=null).map(c=>({d:c.date,h:c.bat!=null?String(c.bat):'',c:c.cycles!=null?String(c.cycles):'',src:'Werkstatt-Check'}));
  return {svc,parts,newParts:newParts.sort((a,c)=>String(c.d).localeCompare(String(a.d))),km:km||null,bat}; }
// Ausstattung: Werkstatt-Wert gilt, außer der Besitzer hat das Feld danach selbst geändert
function effParts(code){ const x=X(code), own=x.parts||{}, at=x.partsAt||{}, S=shopData(code), out={}, src={};
  Object.entries(S.parts).forEach(([k,o])=>{ out[k]=o.v; src[k]=o; });
  Object.entries(own).forEach(([k,v])=>{ if(!v) return; if(!S.parts[k]||(at[k]||'0000')>=S.parts[k].d||!at[k]&&!S.parts[k]) { out[k]=v; delete src[k]; } else if(!at[k]&&S.parts[k]){ /* alter Eintrag ohne Datum: Werkstatt ist neuer */ } });
  return {v:out,src}; }

// ---------- 1) Service & Erinnerungen ----------
function svcPlan(type,code){ const e=isE(type), x=X(code), tl=x.tire&&x.tire.tl, hyd=!/stadtrad|kinder|bmx|falt/i.test(type);
  const L=[['chain','Kette messen & ölen',3,e?750:1000,'Verschleißlehre: ab 0,5 % (11/12-fach) tauschen, sonst leiden Kassette und Kettenblätter.'],
    ['brake','Bremsbeläge prüfen',6,e?800:1500,'Belag unter 1 mm (ohne Trägerplatte) oder quietschend/glasig: tauschen.'],
    ['tire','Reifen prüfen',3,1000,'Profil, Schnitte, Seitenwände. Luftdruck am besten jede Woche.'],
    ['insp','Inspektion in der Werkstatt',12,e?2000:3000,'Einmal im Jahr: Lager, Steuersatz, Züge, Laufräder, Schrauben auf Drehmoment.']];
  if(hyd) L.push(['bleed','Bremsflüssigkeit wechseln',24,0,'Richtwert für hydraulische Scheibenbremsen. Bei schwammigem Druckpunkt früher.']);
  if(tl) L.push(['milk','Tubeless-Milch auffüllen',4,0,'Milch trocknet aus – alle 3–6 Monate nachfüllen.']);
  if(/mtb|fully|hardtail|enduro|downhill|trail/i.test(type)||(x.sus&&x.sus.fork)) L.push(['fork','Gabel: kleiner Service',12,0,'Tauchrohre/Schmieröl. Hersteller-Richtwert meist alle 50 Betriebsstunden – bei viel Fahren öfter.']);
  if(isFully(type)||(x.sus&&x.sus.shock)) L.push(['shock','Dämpfer: Luftkammer-Service',12,0,'Richtwert alle 50 Betriebsstunden bzw. jährlich (Herstellerangabe beachten).']);
  if(e){ L.push(['esw','E-Bike: Software-Update & Diagnose',12,e?2000:0,'In der Fachwerkstatt: Firmware, Fehlerspeicher, Motor- und Akkutest.']); L.push(['ebat','Akku: Kontakte & Ladestand prüfen',6,0,'Kontakte sauber und trocken. Zum Lagern 30–60 % laden, kühl und trocken (nicht unter 0 °C).']); }
  return L.map(([k,t,m,km,h])=>({k,t,m,km,h})); }
function svcState(code){ const type=bikeType(code), x=X(code), SD=shopData(code).svc, done={...(x.svc||{})}; Object.entries(SD).forEach(([k,v])=>{ if(!done[k]||String(v.d)>String(done[k].d)) done[k]=v; }); const _d=done, km=curKm(code), start=(mine().find(m=>m.code===code)||{}).at||today();
  return svcPlan(type,code).map(it=>{ const d=done[it.k]||{}; const base=d.d||start; const due=addMonths(base,it.m); const days=Math.round((new Date(due)-new Date(today()))/864e5);
    let kmLeft=null; if(it.km&&km!=null&&d.km!=null) kmLeft=it.km-(km-d.km);
    const st=(days<0||(kmLeft!=null&&kmLeft<=0))?'due':(days<=30||(kmLeft!=null&&kmLeft<=it.km*.15))?'soon':'ok';
    return {...it,last:d.d||null,lastKm:d.km??null,src:d.src||'',due,days,kmLeft,st}; }); }
function svcSummary(code){ const s=svcState(code), due=s.filter(i=>i.st==='due'), soon=s.filter(i=>i.st==='soon'); return {due,soon,all:s}; }
function toolService(code){ const name=bikeName(code);

    r.innerHTML=`<div class="card" style="display:flex;gap:10px;align-items:flex-end"><div style="flex:1">${inp('sk','Kilometerstand',km??'','type="number" inputmode="numeric" min="0" placeholder="z. B. 2450"')}</div><button class="btn" id="skb" type="button">Speichern</button></div>

     <div style="display:grid;gap:10px;margin-top:14px"><button class="btn" id="calAll" type="button">Alle Erinnerungen in den Kalender</button>${android()?'<p class="muted small" style="margin:-4px 2px 0;text-align:center">Android: Die Datei öffnen und mit deiner Kalender-App importieren.</p>':''}<a class="btn ghost" href="finder.html#pass=${code}&want=service${CF?'&cfg='+esc(CF):''}">Termin bei FYF-Werkstatt buchen</a></div>

/* ===== v.95 FYF Zustandsbericht (Bike Health Score) – nur aus dokumentierten Daten, Unbekanntes bleibt unbekannt ===== */
function healthReport(code){ const P=Pof(code), b=P.bike||{}, mineIt=mine().some(m=>m.code===code), type=bikeType(code)||b.type||'', SD=shopData(code), F=[]; const days=d=>d?Math.round((Date.now()-new Date(d))/864e5):null;
  const E=(P.entries||[]).filter(e=>e.kind!=='Registrierung');
  // 1 Inspektion
  const ins=SD.svc.insp; const di=ins?days(ins.d):null;
  F.push(['Inspektion',ins?(di<=400?'ok':di<=760?'warn':'bad'):'unk',ins?`Letzte Inspektion ${fd(ins.d)} (${ins.src})${di>400?' – älter als ein Jahr':''}.`:'Keine Inspektion dokumentiert.']);
  // 2 Wartungsplan (nur Besitzer, nutzt auch eigene Einträge)
  if(mineIt){ const S=svcSummary(code); F.push(['Wartungsplan',S.due.length>=2?'bad':S.due.length||S.soon.length?'warn':'ok',S.due.length?`Fällig: ${S.due.map(i=>i.t).slice(0,3).join(', ')}.`:S.soon.length?`Bald fällig: ${S.soon.map(i=>i.t).slice(0,3).join(', ')}.`:'Alle Punkte im Plan (Richtwerte).']); }
  // 3 Verschleiß gemessen (Kette, Gebrauchtrad-Check)
  const chk=(P.checks||[]).find(c=>c.chain!=null)||null; const ch=chk?Number(chk.chain):null;
  F.push(['Verschleiß (Kette)',chk?(ch<0.5?'ok':ch<0.75?'warn':'bad'):'unk',chk?`Kettenlängung ${String(ch).replace('.',',')} % gemessen am ${fd(chk.date)}${ch>=0.75?' – tauschen':ch>=0.5?' – bald tauschen':''}.`:'Keine Verschleißmessung dokumentiert.']);
  // 4 Schäden
  const dmg=E.filter(e=>/schaden|unfall|sturz|riss/i.test(e.kind+' '+e.text)).sort((a,c)=>String(c.date).localeCompare(String(a.date)))[0];
  if(dmg){ const fixed=E.some(e=>/reparatur|werkstatt|inspektion/i.test(e.kind)&&String(e.date)>=String(dmg.date)&&e!==dmg); F.push(['Schäden',fixed?'ok':'bad',fixed?`Schaden vom ${fd(dmg.date)} – danach Werkstatt-/Reparatureintrag vorhanden.`:`Schaden vom ${fd(dmg.date)} ohne späteren Reparatureintrag.`]); }
  else F.push(['Schäden','info','Keine Schäden dokumentiert (heißt nicht, dass es keine gab).']);
  // 5 Akku (nur E-Bikes)
  if(isE(type)){ const lg=[...((X(code).eb||{}).log||[]).filter(()=>mineIt),...SD.bat].filter(l=>l.h!==''&&l.h!=null).sort((a,c)=>String(a.d).localeCompare(String(c.d))); const z=lg[lg.length-1]; const h=z?Number(z.h):null;
    F.push(['Akku',z?(h>=80?'ok':h>=60?'warn':'bad'):'unk',z?`Akku-Zustand ${h} % (${fd(z.d)}${z.src?', '+z.src:''}).`:'Kein Akku-Zustand dokumentiert.']); }
  // 6 Nachweise durch Werkstätten
  const ver=E.filter(e=>e.trust==='verified'&&days(e.date)<=760).length;
  F.push(['Werkstatt-Nachweise',ver?'ok':E.length?'warn':'unk',ver?`${ver} von Werkstätten bestätigte Einträge in den letzten 2 Jahren.`:E.length?'Nur Selbstauskünfte – keine Werkstattbestätigung.':'Noch keine Einträge.']);
  const W={ok:100,warn:60,bad:20}, known=F.filter(f=>W[f[1]]!=null); const score=known.length>=2?Math.round(known.reduce((s,f)=>s+W[f[1]],0)/known.length):null;
  return {F,score,known:known.length,total:F.filter(f=>f[1]!=='info').length,stolen:!!P.stolen}; }
function healthHtml(code){ const R=healthReport(code); const lab=s=>s>=85?'Sehr gut gepflegt':s>=65?'Gut gepflegt':s>=45?'Prüfen lassen':'Handlungsbedarf'; const col=s=>s>=85?'var(--ok)':s>=65?'#6aa84f':s>=45?'#e39b2d':'var(--bad)';
  const dot={ok:'ok',warn:'soon',bad:'due',unk:'unk',info:'unk'};
  return `<details class="more health"><summary><span style="display:flex;align-items:center;gap:12px"><span class="hs" style="${R.score!=null&&!R.stolen?'--c:'+col(R.score):''}">${R.stolen?'!':R.score!=null?R.score:'?'}</span><span><b>Zustandsbericht</b><span class="muted small" style="display:block;font-weight:500">${R.stolen?'Als gestohlen gemeldet':R.score!=null?lab(R.score)+` · ${R.known} von ${R.total} Faktoren bekannt`:'Zu wenig dokumentierte Daten'}</span></span></span></summary><div>
   ${R.F.map(([n,s,t])=>`<div class="kv" style="align-items:flex-start"><span style="display:flex;gap:8px;align-items:flex-start"><span class="dot ${dot[s]}"></span><span><b style="font-weight:650">${n}</b><br><span class="muted small">${esc(t)}</span></span></span><b class="small" style="white-space:nowrap">${{ok:'gut',warn:'prüfen',bad:'kritisch',unk:'unbekannt',info:'–'}[s]}</b></div>`).join('')}
   <p class="muted small" style="margin:10px 0 0">Beruht nur auf dokumentierten Einträgen und Messungen im Pass – kein technisches Gutachten. Unbekanntes zählt nicht in den Wert. Wartungsintervalle sind Richtwerte.</p></div></details>`; }

function codeFromText(t){ t=String(t||'').trim(); let m=/[#&?]c=([A-Za-z0-9]{8})/.exec(t); if(m) return norm(m[1]); m=/\/([A-HJ-NP-Z2-9]{8})\/?$/i.exec(t.replace(/[?#].*$/,'')); if(m&&/^https?:/i.test(t)) return norm(m[1]); const n=norm(t); return /^[A-HJ-NP-Z2-9]{8}$/.test(n)?n:''; }

async function makeDecoder(){ try{ if('BarcodeDetector' in window){ const f=await BarcodeDetector.getSupportedFormats(); if(f.includes('qr_code')){ const d=new BarcodeDetector({formats:['qr_code']}); return async cv=>{ const r=await d.detect(cv); return r[0]&&r[0].rawValue||''; }; } } }catch(e){}
  await loadJsQR(); return async cv=>{ const g=cv.getContext('2d',{willReadFrequently:true}), im=g.getImageData(0,0,cv.width,cv.height); const r=window.jsQR(im.data,cv.width,cv.height,{inversionAttempts:'attemptBoth'}); return r&&r.data||''; }; }
function frameFromText(t){ t=String(t||'').trim(); if(/^https?:/i.test(t)){ try{ const u=new URL(t); const q=['sn','serial','frame','framenumber','id'].map(k=>u.searchParams.get(k)).find(Boolean); t=q||u.pathname.split('/').filter(Boolean).pop()||''; }catch(e){ return ''; } } const n=frameNorm(t); return n.length>=6&&n.length<=30?n:''; }

    if(!confirm(`Sicherung vom ${fd(d.at)} mit ${d.bikes||0} Rad/Rädern einspielen? Daten zu denselben Rädern werden ersetzt.`)) return;
    const cur=mine(); let imp=[]; try{ imp=JSON.parse(d.ls['fyfpass:mine']||'[]'); }catch(e){}
    for(const [k,v] of Object.entries(d.ls)){ if(!k.startsWith('fyfpass:')||k==='fyfpass:mine'||k.startsWith('fyfpass:own:')) continue; try{ localStorage.setItem(k,String(v)); }catch(e){ alert('Speicher voll – nicht alles konnte wiederhergestellt werden.'); break; } }
    LSset('fyfpass:mine',[...cur,...imp.filter(m=>m&&m.code&&!cur.some(c=>c.code===m.code))].slice(0,20));
    for(const [k,v] of Object.entries(d.files||{})){ try{ const bl=await (await fetch(v)).blob(); await IDB.put(k,bl); }catch(e){} }
    toast('Wiederhergestellt'); route(); }; i.click(); }

// ---------- Garage teilen ----------
function garageShare(){ const l=mine(); if(!l.length) return; const url=location.origin+location.pathname+'#import='+l.map(m=>m.code).join('.')+(CF?'&cfg='+CF:'');
  const el=document.createElement('div'); el.className='sheet'; el.innerHTML=`<div><div style="font-size:21px;font-weight:800">Garage teilen</div><p class="muted small" style="margin:6px 0 14px">Z. B. mit der Familie. Der Link fügt deine ${l.length} Rad/Räder auf dem anderen Handy hinzu – mit Pass und Geschichte. Notizen, Belege und Einstellungen bleiben auf deinem Handy (dafür „Sichern“ nutzen).</p><div style="display:grid;gap:10px"><button class="btn block" data-a="share" type="button">Link senden</button><button class="btn ghost block" data-a="copy" type="button">Link kopieren</button><button class="btn ghost block" data-a="x" type="button">Abbrechen</button></div></div>`;
  document.body.appendChild(el); el.onclick=async e=>{ if(e.target===el) return el.remove(); const a=e.target.closest('[data-a]'); if(!a) return; if(a.dataset.a==='x') return el.remove(); if(a.dataset.a==='copy'){ copyText(url); return el.remove(); } try{ if(navigator.share) await navigator.share({title:'Meine Räder im FYF Pass',url}); else copyText(url); }catch(x){} el.remove(); }; }
async function importSheet(codes){ codes=[...new Set(codes.map(norm).filter(c=>/^[A-HJ-NP-Z2-9]{8}$/.test(c)))].slice(0,20); if(!codes.length) return; const el=document.createElement('div'); el.className='sheet'; el.innerHTML=`<div><div style="font-size:21px;font-weight:800">Räder hinzufügen?</div><div id="iml" style="text-align:left;margin:12px 0"><p class="muted small">Lädt …</p></div><div style="display:flex;gap:10px"><button class="btn ghost" data-a="x" type="button" style="flex:1">Abbrechen</button><button class="btn" data-a="ok" type="button" style="flex:1">Hinzufügen</button></div></div>`; document.body.appendChild(el);
  const found=[]; for(const c of codes){ try{ const p=await rpc('pass_get',{p_code:c}); if(p) found.push({code:c,name:(p.bike&&p.bike.name)||'Fahrrad',type:p.bike&&p.bike.type,p}); }catch(e){} }
  el.querySelector('#iml').innerHTML=found.length?found.map(f=>`<div class="kv"><span>${esc(f.name)}</span><b>${mine().some(m=>m.code===f.code)?'schon da':f.code}</b></div>`).join(''):'<p class="muted">Keine Räder gefunden.</p>';
  const done=()=>{ el.remove(); history.replaceState(null,'',location.pathname+hashLink('meine')); route(); };
  el.querySelector('[data-a=x]').onclick=done; el.querySelector('[data-a=ok]').onclick=()=>{ found.forEach(f=>{ mineAdd(f.code,f.name,f.type); cacheSet(f.code,f.p); }); toast(found.length+' hinzugefügt'); done(); }; }

// ---------- Garage: Daten-Bereich + neue Fundmeldungen ----------
function dataUi(){ const h=document.getElementById('dataHost'); if(!h) return; const n=mine().length, at=LS('fyfpass:backupAt');
  h.innerHTML=`<details class="more" style="margin-top:18px"><summary>Daten sichern & teilen</summary><div><p class="muted small" style="margin:0 0 10px">Deine Einträge liegen nur auf diesem Handy. ${at?'Letzte Sicherung: '+fd(at)+'.':'Noch keine Sicherung.'} Sicherung z. B. in iCloud Drive oder Google Drive ablegen.</p><div style="display:grid;gap:10px">${n?'<button class="btn block" data-d="save" type="button">Jetzt sichern</button>':''}<button class="btn ghost block" data-d="load" type="button">Sicherung wiederherstellen</button>${n?'<button class="btn ghost block" data-d="share" type="button">Garage teilen (Familie)</button>':''}</div><p class="muted small" style="margin:10px 0 0">Die Sicherung enthält keine Besitzer-Codes – Karte „Teil II“ gut aufbewahren.</p></div></details>`;
  h.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{ const k=b.dataset.d; if(k==='save'){ await backupExport(); dataUi(); } else if(k==='load') backupImport(); else garageShare(); });
  mine().forEach(async m=>{ const c=cacheGet(m.code); if(!(c&&c.p&&c.p.stolen)||!ownGet(m.code)) return; const l=await seenFetch(m.code); if(!l) return; const old=+(LS('fyfpass:seenN:'+m.code)||0); if(l.length>old){ const card=document.querySelector(`.bikecard[href^="#c=${m.code}"] .status`); if(card){ card.className='status bad'; card.innerHTML=`<i></i>${l.length-old} neue Fundmeldung${l.length-old>1?'en':''}!`; } } }); }

// ---------- Anleitung „So funktioniert’s“ ----------
const GUIDE=[
 ['Garage & Rad anlegen','<p>Unter <b>Garage</b> stehen deine Räder. Tippe auf <b>Rad registrieren</b>: Marke, Modell, Art und Rahmennummer eintragen – fertig. Kostenlos, ohne Konto, ohne Namen.</p><p>Danach bekommst du:</p><ul><li>den <b>Pass-Code</b> (8 Zeichen, steht auch auf dem QR-Aufkleber)</li><li>den <b>Übergabe-Code „Teil II“</b> (12 Zeichen) – wird nur einmal angezeigt. Drucken oder fotografieren und sicher aufbewahren. Er beweist, dass das Rad dir gehört.</li></ul><p>Hast du schon einen Code (z. B. von deiner Werkstatt)? <b>Ich habe schon einen Code</b> oder QR scannen.</p>'],
 ['QR-Aufkleber & Code','<p>Der QR-Aufkleber kommt an den Rahmen. Wer ihn scannt, sieht den Pass deines Rads.</p><ul><li><b>Scannen:</b> unter <b>Rad prüfen → QR-Code scannen</b>, mit der normalen Kamera-App oder per Foto.</li><li><b>Eintippen:</b> den 8-stelligen Code unter <b>Rad prüfen</b> eingeben.</li><li><b>Hersteller-QR:</b> Viele Räder (z. B. Canyon) haben unten am Tretlager einen QR-Code mit der Rahmennummer. Scannst du ihn, findet FYF den passenden Pass – auch ohne FYF-Aufkleber. Beim Registrieren füllt er die Rahmennummer aus.</li><li><b>QR zeigen:</b> in deinem Rad zeigt <b>QR zeigen</b> den Code groß – z. B. für die Werkstatt.</li><li><b>Bikefitting buchen:</b> bei Rennrad, Gravel, Cyclocross und Zeitfahrrad (alles mit Rennlenker) gibt es im Rad zusätzlich den Knopf <b>Bikefitting buchen</b> – er zeigt nur FYF-Partner mit Bikefitting.</li></ul><p>Aufkleber selbst drucken und mit klarem Klebeband überkleben oder in einer FYF-Werkstatt machen lassen.</p>'],
 ['Besitzer-Einstellungen (Teil II)','<p>Unten in deinem Rad unter <b>Besitzer-Einstellungen</b> mit dem Code von Teil II:</p><ul><li><b>Wer sieht den Pass?</b> „Nur Werkstätten“ (Standard) oder „Jeder“ – praktisch beim Verkauf.</li><li><b>Als gestohlen melden</b> und wieder aufheben.</li><li><b>Eigene Arbeit eintragen</b> – erscheint als „Selbstauskunft“.</li></ul><p>Mit <b>Auf diesem Gerät merken</b> musst du den Code nur einmal eingeben.</p>'],
 ['Foto & Hintergrund','<p>Im Rad oben auf <b>Foto</b>: Foto wählen, verschieben und zoomen.</p><p><b>Hintergrund entfernen:</b> In der Fotos-App lange auf das Rad drücken → <b>Kopieren</b> → hier <b>Freigestelltes Rad einfügen</b>. Das Rad steht dann auf hellem Studio-Hintergrund. Am schönsten: Rad genau von der Seite, vor heller Wand.</p>'],
 ['Zustandsbericht','<p>Im Rad zeigt der <b>Zustandsbericht</b> einen Wert von 0–100 – nur aus dem, was wirklich dokumentiert ist: letzte Inspektion, Wartungsplan, gemessener Kettenverschleiß, Schäden, Akku-Zustand und Werkstatt-Nachweise.</p><p>Was nicht dokumentiert ist, steht als <b>unbekannt</b> da und zählt nicht mit. Es ist kein Gutachten – aber Käufer sehen auf einen Blick, wie gepflegt das Rad ist.</p>'],
 ['Service & Erinnerungen','<p><b>Mein Rad → Service</b> zeigt, was wann fällig ist – je nach Radart (Kette, Bremsen, Inspektion, Gabel, Dämpfer, E-Bike-Check …).</p><ul><li>Kilometerstand eintragen → Erinnerung auch nach km.</li><li><b>Erledigt</b> tippen, wenn gemacht.</li><li><b>In Kalender</b> legt eine Erinnerung im Handy-Kalender an.</li><li><b>Termin buchen</b> bei einer FYF-Werkstatt.</li></ul><p>In der Garage steht „Fällig: …“, wenn etwas ansteht.</p>'],
 ['Sitzposition & Bikefitting','<p><b>Sitzposition</b> speichert Sattelhöhe, Sattelversatz, Lenker usw. Nach einem Bikefitting bei FYF stehen die Werte automatisch drin.</p><p><b>Auf anderes Rad übertragen:</b> Zielrad wählen, Kurbellänge eingeben – die Sattelhöhe wird umgerechnet. <b>Werte kopieren</b> z. B. für ein Leihrad.</p>'],
 ['Fahrwerk','<p>Für Räder mit Federgabel/Dämpfer: Gewicht, Fahrstil und Federweg eintragen → <b>SAG-Ziel</b> und <b>Startdruck</b>.</p><p><b>SAG messen:</b> Gummiring runter, vorsichtig aufsitzen, absteigen, Abstand messen, eintragen → die App sagt, ob mehr oder weniger Luft. Gute Einstellungen mit <b>Setup speichern</b> festhalten.</p>'],
 ['Reifendruck','<p>Gewicht, Reifenbreite, Untergrund, Tubeless/Hookless wählen → Druck vorne und hinten in bar und psi. Startwert – Grenzen auf Reifen und Felge beachten.</p>'],
 ['E-Bike & Akku','<p>Motor, Akku, Seriennummern und Ladegerät eintragen. <b>Akku-Zustand</b> (Ladezyklen, %) regelmäßig festhalten – zeigt beim Verkauf, wie fit der Akku ist.</p><p><b>Batteriepass:</b> Ab 18.02.2027 bekommen neue E-Bike-Akkus einen QR-Code mit digitalem Batteriepass. Code scannen, Link kopieren, hier <b>Einfügen</b>.</p>'],
 ['Ausstattung & Belege','<p><b>Ausstattung:</b> Teile, Farbe, besondere Merkmale, volle Rahmennummer – hilft beim Ersatzteilkauf und im Diebstahlfall.</p><p><b>Schnell ausfüllen:</b> Schaltgruppe wählen (z. B. Shimano GRX RX820, 1×) – Schaltwerk, Hebel, Kurbel, Kassette, Kette und Bremsen werden vorausgefüllt. <b>Serienausstattung:</b> Liste auf der Herstellerseite kopieren und einfügen – FYF erkennt die Teile und zeigt die Serie auch nach späteren Umbauten an.</p><p><b>Belege:</b> Kaufbeleg & Rechnungen fotografieren, Garantie-Ende sehen und eine Erinnerung vorher bekommen.</p>'],
 ['Verkaufen','<p><b>Verkaufen</b> erstellt einen fertigen Anzeigentext mit Ausstattung, Wartung, Akku-Zustand und dem Link zum Pass – kopieren oder direkt teilen (z. B. Kleinanzeigen).</p><p>Pass auf „Jeder“ stellen, damit Käufer die Geschichte sehen. Bei der Übergabe: Kaufvertrag (in der App), Karte Teil II mitgeben.</p>'],
 ['Gebrauchtes Rad kaufen','<p>Code scannen oder eintippen → <b>Kauf-Check</b>:</p><ul><li>Diebstahlmeldung und Geschichte ansehen</li><li><b>Rahmennummer vergleichen</b> – passt sie zum Pass?</li><li>Checkliste für Besichtigung und Probefahrt</li><li><b>Kaufvertrag</b> ausfüllen und drucken/als PDF sichern</li></ul>'],
 ['Diebstahl & Fundmeldung','<p><b>Mein Rad → Diebstahl</b> führt Schritt für Schritt: 110, im Pass als gestohlen melden, <b>Anzeige-Blatt</b> mit allen Daten und Fotos, Online-Wache, Versicherung, Kleinanzeigen beobachten.</p><p><b>Fundmeldung:</b> Scannt jemand dein gestohlenes Rad, kann er „Rad gesehen“ melden – mit Ort und freiwillig mit seiner Telefonnummer oder E-Mail. Deine Daten sieht er nie. Du siehst die Meldungen in den Besitzer-Einstellungen und in der Garage.</p><p><b>Teil II verloren?</b> Eine verifizierte FYF-Werkstatt kann nach Prüfung (Rahmennummer am Rad, Ausweis, Kaufbeleg) einen neuen Übergabe-Code ausstellen. Der alte wird ungültig.</p>'],
 ['Werkstätten & Marktplatz','<p><b>Werkstätten</b> zeigt FYF-Partner in deiner Nähe – für Service, Bikefitting und Gebrauchtrad-Check. <b>Marktplatz</b> zeigt Räder mit Fahrradpass von FYF-Werkstätten.</p>'],
 ['Daten, Sicherung & Teilen','<p>Deine Einträge (Service, Belege, Akku …) liegen <b>nur auf deinem Handy</b>. Darum ab und zu in der Garage <b>Daten sichern & teilen → Jetzt sichern</b> und die Datei z. B. in iCloud/Google Drive ablegen. Neues Handy: <b>Sicherung wiederherstellen</b>.</p><p><b>Garage teilen</b> schickt deine Räder per Link aufs Handy der Familie.</p><p>Im Pass selbst (für Werkstätten/Käufer sichtbar) stehen nur Rad-Daten und Einträge – nie dein Name.</p>'],
 ['Als App installieren','<ul><li><b>iPhone:</b> in Safari öffnen → Teilen → „Zum Home-Bildschirm“.</li><li><b>Android:</b> Knopf <b>Als App installieren</b> in der Garage oder Chrome-Menü ⋮ → „App installieren“.</li></ul><p>Dann startet „FYF Pass“ wie eine normale App, auch offline.</p>']];
function guide(open){ page('So funktioniert’s','',(r)=>{ r.innerHTML=`<p class="muted" style="margin:-4px 2px 12px">Alles zum FYF-Fahrradpass – tippe auf ein Thema.</p>${GUIDE.map(([t,h],i)=>`<details class="more guide"${open===i?' open':''}><summary>${t}</summary><div class="small">${h}</div></details>`).join('')}<button class="btn ghost block" id="gint" type="button" style="margin-top:14px">Kurze Einführung ansehen</button>`;
  r.querySelector('#gint').onclick=()=>{ document.querySelector('.tpage .tp-back').click(); intro(true); }; }); }
async function qrSheet(code,name){ const url=location.origin+location.pathname+'#c='+code+(CF?'&cfg='+CF:''); let qr=''; try{ await loadQR(); const q=window.qrcode(0,'M'); q.addData(url); q.make(); qr=q.createSvgTag({cellSize:4,margin:1,scalable:true}); }catch(e){}
  const el=document.createElement('div'); el.className='sheet'; el.innerHTML=`<div><div class="muted small" style="font-weight:700;letter-spacing:.14em">FYF FAHRRADPASS</div><div style="font-size:22px;font-weight:800;margin-top:4px">${esc(name)}</div><div class="qrbig">${qr||'<span class="muted small">QR braucht Internet</span>'}</div><div style="font:700 24px ui-monospace,Menlo,monospace;letter-spacing:.14em">${code}</div><p class="muted small" style="margin:6px 0 18px">In der Werkstatt vorzeigen</p><button class="btn block" type="button">Fertig</button></div>`;
  document.body.appendChild(el); el.onclick=e=>{ if(e.target===el||e.target.tagName==='BUTTON') el.remove(); }; }
function orderSheet(code,name){ const ref=encodeURIComponent(code), msg=encodeURIComponent(`Hallo, ich möchte einen FYF-Aufkleber für mein Rad „${name}“ bestellen. Fahrradpass-Code: ${code}`);
  const link=u=>u+(u.includes('?')?'&':'?')+'client_reference_id='+ref;
  const el=document.createElement('div'); el.className='sheet'; el.innerHTML=`<div style="text-align:left"><div class="muted small" style="font-weight:700;letter-spacing:.14em;text-align:center">FYF AUFKLEBER</div><div style="font-size:22px;font-weight:800;margin:4px 0 2px;text-align:center">Wetterfest, klein, für deinen Rahmen</div><p class="muted small" style="text-align:center;margin:0 0 16px">Mit deinem QR-Code ${code} – Versand per Brief.</p>
    <div style="display:grid;gap:10px">${ORDER.one?`<a class="btn block" href="${esc(link(ORDER.one))}" target="_blank" rel="noopener">1 Aufkleber · ${esc(ORDER.price1)}</a>`:''}${ORDER.two?`<a class="btn block ghost" href="${esc(link(ORDER.two))}" target="_blank" rel="noopener">2er-Set · ${esc(ORDER.price2)}</a>`:''}
    ${!ORDER.one&&!ORDER.two&&ORDER.whatsapp?`<a class="btn block" href="https://wa.me/${esc(String(ORDER.whatsapp).replace(/\D/g,''))}?text=${msg}" target="_blank" rel="noopener">Per WhatsApp anfragen</a>`:''}${!ORDER.one&&!ORDER.two&&ORDER.mail?`<a class="btn block ghost" href="mailto:${esc(ORDER.mail)}?subject=${encodeURIComponent('FYF-Aufkleber '+code)}&body=${msg}">Per E-Mail anfragen</a>`:''}</div>
    ${ORDER.one||ORDER.two?`<p class="muted small" style="margin:12px 0 0">Bezahlung sicher über Stripe (Karte, Apple Pay). Bitte im Bestellformular den Code <b>${code}</b> angeben, falls danach gefragt wird.</p>`:''}
    <p class="small" style="margin:12px 0 16px;text-align:center"><a href="kauf.html" target="_blank">Bestellinfos</a> · <a href="impressum.html" target="_blank">Impressum</a> · <a href="datenschutz.html" target="_blank">Datenschutz</a></p><button class="btn block ghost" type="button">Schließen</button></div>`;
  document.body.appendChild(el); el.onclick=e=>{ if(e.target===el||e.target.tagName==='BUTTON') el.remove(); }; }
function thanksSheet(){ const el=document.createElement('div'); el.className='sheet'; el.innerHTML=`<div><svg class="okcheck" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30"/><path d="M19 33l9 9 17-19"/></svg><div style="font-size:22px;font-weight:800">Danke für deine Bestellung!</div><p class="muted" style="margin:6px 0 18px">Dein Aufkleber geht in den nächsten Werktagen per Brief raus.</p><button class="btn block" type="button">Fertig</button></div>`; document.body.appendChild(el); el.onclick=e=>{ if(e.target===el||e.target.tagName==='BUTTON') el.remove(); }; }
function route(){ scrollTo(0,0); document.querySelectorAll('.sheet,.tpage,.scanner').forEach(e=>{ if(e.querySelector('video')&&e.querySelector('video').srcObject) e.querySelector('video').srcObject.getTracks().forEach(t=>t.stop()); e.remove(); }); document.body.style.overflow=''; const h=new URLSearchParams((location.hash||'').slice(1)); const c=norm(h.get('c')); if(h.get('import')){ tabs('meine'); askForm(''); importSheet(String(h.get('import')).split(/[.,]/)); return; } tabs(c?(mine().some(m=>m.code===c)?'meine':'pruefen'):(/pruefen/.test(location.hash)?'pruefen':'meine')); if(c) show(c); else askForm(''); }
window.addEventListener('hashchange',route); route();
if(/(^|[#&])bestellt=1/.test(location.hash)) thanksSheet();
if(!new URLSearchParams((location.hash||'').slice(1)).get('c')) intro();
try{ if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js'); }catch(e){}
</script>
