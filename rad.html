/* ---- Bewegung (abschaltbar über „Bewegung reduzieren“ im iPhone) ---- */

@keyframes fyScan{0%,100%{transform:translateY(0)}50%{transform:translateY(34px)}}
@keyframes fyDraw{to{stroke-dashoffset:0}}
@keyframes fyPulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--acc) 45%,transparent)}60%{box-shadow:0 0 0 10px transparent}}
.fy-in>*{animation:fyIn .45s cubic-bezier(.2,.8,.2,1) both}

.ill .scanline{animation:fyScan 1.6s ease-in-out infinite}.ill .draw{stroke-dasharray:600;stroke-dashoffset:600;animation:fyDraw 1.6s .2s ease forwards}
.okcheck{width:64px;height:64px;margin:4px auto 6px;display:block}.okcheck circle{fill:var(--ok);animation:fyPop .45s both}.okcheck path{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:fyDraw .5s .35s ease forwards}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.ill .draw,.okcheck path{stroke-dashoffset:0}}

<script>
"use strict";
// Öffentliche Ansicht eines FYF-Fahrradpasses (QR-Aufkleber am Rahmen). Zeigt nur, was der Besitzer freigegeben hat. Keine Daten über den Besitzer.
const DEFAULT={u:'https://tyfilehmrnibtoalwflf.supabase.co',k:'sb_publishable_DUIWZF8H-BD-HaBUMvTg-A_pbpz1mgT'}; // öffentlicher Schlüssel, kein Geheimnis
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=s=>{ if(!s) return ''; const [y,m,d]=String(s).slice(0,10).split('-'); return `${d}.${m}.${y}`; };
const num=v=>Number(v).toLocaleString('de-DE');
const unb64u=s=>decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4))));
const hp=new URLSearchParams((location.hash||'').slice(1)); const CF=hp.get('cfg');
let CFG=DEFAULT; try{ if(CF){ const c=JSON.parse(unb64u(CF)); if(/^https:\/\/[a-z0-9.-]+$|^http:\/\/localhost(:\d+)?$/.test(c.u)&&c.k&&!/^sb_secret_/.test(c.k)) CFG=c; } }catch(e){}
const app=document.getElementById('app');
// Einblenden nach jedem Seitenwechsel (Karten nacheinander)
(function(){ const m=document.getElementById('app'); if(!m) return; new MutationObserver(()=>{ if(m.dataset.anim===String(m.childElementCount+(m.firstElementChild&&m.firstElementChild.textContent||'').length)) return; m.classList.remove('fy-in'); void m.offsetWidth; m.classList.add('fy-in'); m.dataset.anim=String(m.childElementCount+(m.firstElementChild&&m.firstElementChild.textContent||'').length); }).observe(m,{childList:true}); m.innerHTML='<div class="skel"></div><div class="skel" style="height:140px"></div><div class="skel"></div>'; })();
// Erste Schritte: kurze Einführung beim ersten Öffnen
const INTRO=[
 ['Dein Rad bekommt einen Pass','Registriere dein Fahrrad kostenlos – ohne Konto und ohne Namen. Du bekommst einen Code und einen QR-Aufkleber.','<svg viewBox="0 0 120 120"><circle cx="34" cy="78" r="18" fill="none" stroke="currentColor" stroke-width="4" class="draw"/><circle cx="88" cy="78" r="18" fill="none" stroke="currentColor" stroke-width="4" class="draw"/><path d="M34 78l18-32h22l14 32M52 46l8 32H34M66 36h12" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="draw"/><rect x="56" y="54" width="16" height="16" rx="3" fill="#d9612c"/></svg>'],
 ['QR-Code aufs Rad kleben','Am Rahmen klebt dein QR-Code. Jede FYF-Werkstatt scannt ihn und trägt Service, Reparaturen und neue Teile ein.','<svg viewBox="0 0 120 120"><rect x="25" y="25" width="70" height="70" rx="10" fill="none" stroke="currentColor" stroke-width="4"/><path d="M38 38h14v14H38zM68 38h14v14H68zM38 68h14v14H38zM66 66h6v6h-6zM76 76h6v6h-6zM66 78h4M78 66h4" fill="currentColor"/><rect class="scanline" x="20" y="40" width="80" height="4" rx="2" fill="#d9612c"/></svg>'],
 ['Sicher bei Diebstahl und Verkauf','Wird es gestohlen, meldest du es mit einem Tipp – jede FYF-Werkstatt wird gewarnt. Beim Verkauf gibst du die ganze Geschichte einfach weiter.','<svg viewBox="0 0 120 120"><path d="M60 18l34 12v26c0 22-14 38-34 46C40 94 26 78 26 56V30z" fill="none" stroke="currentColor" stroke-width="4" class="draw"/><path d="M45 60l11 11 20-22" fill="none" stroke="#1d6b35" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" class="draw"/></svg>'],
 ['Werkstatt finden, Rad kaufen','Unten findest du FYF-Werkstätten mit freien Terminen und den Marktplatz mit Gebrauchträdern, deren Geschichte du nachlesen kannst.','<svg viewBox="0 0 120 120"><path d="M22 52l8-22h60l8 22M26 52v40h68V52M48 92V70h24v22M22 52h76" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round" class="draw"/><circle cx="92" cy="30" r="12" fill="#d9612c"/><path d="M87 30l4 4 7-8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></svg>']];
function intro(force){ let seen=false; try{ seen=localStorage.getItem('fyfpass:intro')==='1'; }catch(e){} if(seen&&!force) return; let i=0;
  const el=document.createElement('div'); el.className='intro'; el.setAttribute('role','dialog'); el.setAttribute('aria-label','Einführung FYF Pass'); document.body.appendChild(el);
  const done=()=>{ try{ localStorage.setItem('fyfpass:intro','1'); }catch(e){} el.style.transition='opacity .25s'; el.style.opacity='0'; setTimeout(()=>el.remove(),260); };
  const draw=()=>{ const [t,x,svg]=INTRO[i]; el.innerHTML=`<div style="text-align:right"><button class="btn ghost" id="isk" style="padding:6px 12px">Überspringen</button></div><div class="sl fy-in"><div class="ill" style="color:var(--ink)">${svg}</div><h1 style="margin:0">${t}</h1><p class="muted" style="margin:0;font-size:17px">${x}</p></div><div class="dots">${INTRO.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div><button id="inx" style="width:100%;max-width:420px;margin:0 auto;display:block;padding:14px">${i<INTRO.length-1?'Weiter':'Los geht’s'}</button>`;
    el.querySelector('#isk').onclick=done; el.querySelector('#inx').onclick=()=>{ if(i<INTRO.length-1){ i++; draw(); } else done(); }; };
  let sx=null; el.addEventListener('touchstart',e=>{ sx=e.touches[0].clientX; },{passive:true}); el.addEventListener('touchend',e=>{ if(sx==null) return; const dx=e.changedTouches[0].clientX-sx; if(dx<-50&&i<INTRO.length-1){ i++; draw(); } else if(dx>50&&i>0){ i--; draw(); } sx=null; });
  draw(); }
const helpBox=(t,body)=>`<details class="help"><summary>${t}</summary><div style="margin-top:6px">${body}</div></details>`;

async function show0(code){ window.__P=null; window.__OFF=null;

  if(p&&!window.__OFF&&mine().some(m=>m.code===code)) cacheSet(code,p);

  const shopLine=p.self&&!sh.name?`<p class="muted small" style="margin:0">Vom Besitzer selbst registriert – noch von keiner Werkstatt betreut.</p>`:`<p class="muted small" style="margin:0">Pass geführt von <b>${esc(sh.name||'einer FYF-Werkstatt')}</b>${sh.addr?' · '+esc(sh.addr):''}${tel}</p>`;
  const mineIt=mine().some(m=>m.code===code), svc=`finder.html#pass=${code}${CF?'&cfg='+esc(CF):''}`;

  const infoBox=`<details class="more"><summary>Details zum Rad</summary><div>${b.frame?`<p style="margin:0 0 6px">Rahmennummer (gekürzt): <b style="font-family:ui-monospace,monospace">${esc(b.frame)}</b></p>`:''}${b.color?`<p style="margin:0 0 6px">Farbe: ${esc(b.color)}</p>`:''}${b.bat?`<p style="margin:0 0 6px">Akku (gekürzt): <b style="font-family:ui-monospace,monospace">${esc(b.bat)}</b></p>`:''}${b.batPass?`<p style="margin:0 0 6px"><a href="${esc(b.batPass)}" target="_blank" rel="noopener nofollow">Batteriepass des Herstellers</a></p>`:''}${shopLine}<p class="muted small" style="margin:8px 0 0">Code ${code}${p.created_at?' · Pass seit '+fd(p.created_at):''}. Einträge stammen von den Werkstätten. Keine Daten über Besitzer. Fehlt eine Diebstahlmeldung, ist das kein Beweis.</p><p class="small" style="margin:8px 0 0"><a href="index.html#rad=${code}">Ich bin Werkstatt</a></p></div></details>`;

  if(p.withdrawn&&p.limited){ app.innerHTML=`${head}${heroH}${alarm}<div class="card">Dieser Pass wurde vom Laden zurückgezogen.</div>${infoBox}`; return; }
  if(p.limited){ app.innerHTML=`${head}${heroH}${alarm}${acts}<div class="card"><b>Geschichte nur für Werkstätten sichtbar</b><p class="muted small" style="margin:4px 0 0">${mineIt?'In den Besitzer-Einstellungen auf „Jeder“ stellen, um sie hier zu sehen.':'Beim Kauf den Verkäufer bitten, den Pass freizugeben.'}</p></div>${infoBox}${ownHost}`; return; }

   <h2>Geschichte</h2><div class="card">${items.length?items.map(i=>`<div class="e${i.x?' x':''}"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(i.k)}</b><span class="muted small">${fd(i.d)}</span></div><div style="margin:2px 0">${esc(i.t)}${i.x?' <i>(korrigiert)</i>':''}</div>${i.parts.length?`<div class="small">Neue Teile: ${esc(i.parts.join(', '))}</div>`:''}<div class="muted small">${esc(i.by||'')}${i.km!=null?' · '+num(i.km)+' km':''}<span class="tb ${TR[i.tr]?TR[i.tr][1]:'s'}">${esc((TR[i.tr]||TR.shop)[0])}</span></div></div>`).join(''):'<p class="muted" style="margin:0">Noch keine Einträge.</p>'}</div>
   ${infoBox}${ownHost}`;

}

const frameNorm=v=>String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
async function frameHash(v){ const n=frameNorm(v); const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('fyf:'+n)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
const mask=v=>{ v=String(v||''); return v.length>6?v.slice(0,3)+'•••'+v.slice(-3):v; };
const fld=(id,l,attrs='')=>`<label for="${id}" class="small" style="display:block;margin:10px 0 4px">${l}</label><input id="${id}" ${attrs} style="width:100%;font:inherit;letter-spacing:0;text-transform:none;font-weight:400">`;

   <label style="display:flex;gap:8px;align-items:flex-start;margin:14px 0 0;font-size:14px"><input type="checkbox" id="rx" required style="flex:none;width:auto;margin-top:4px"><span>Das Rad gehört mir. Ich habe die <a href="datenschutz.html" target="_blank">Datenschutzhinweise</a> gelesen.</span></label>

    let r; try{ const fh=await frameHash(g('rf')); const x=await fetch(CFG.u+'/rest/v1/rpc/pass_register',{method:'POST',headers:{apikey:CFG.k,'Content-Type':'application/json'},body:JSON.stringify({p_payload:{bike,date:new Date().toISOString().slice(0,10)},p_fh:fh})}); if(!x.ok) throw 0; r=await x.json(); }catch(x){ return regForm('Gerade nicht erreichbar. Bitte später erneut versuchen.'); }
    if(!r||r.error) return regForm(r&&r.error==='FYF_FRAME_EXISTS'?'Für diese Rahmennummer gibt es schon einen FYF-Fahrradpass. Hast du das Rad gekauft? Lass dir vom Verkäufer die Karte „Teil II“ geben und gehe damit in eine FYF-Werkstatt.':r&&r.error==='FYF_RATE'?'Heute sind sehr viele Registrierungen eingegangen. Bitte morgen erneut versuchen.':'Bitte die Eingaben prüfen.');

     <p style="margin:14px 0 6px"><b>Diebstahl</b></p>${r.stolen?'<button class="btn" data-s="0">Rad ist wieder da – Meldung aufheben</button>':'<button class="btn" style="background:var(--bad)" data-s="1">Als gestohlen melden</button>'}<p class="muted small" style="margin:6px 0 0">Anzeige bei der Polizei selbst erstatten.</p>
     <p style="margin:14px 0 6px"><b>Eigene Arbeit eintragen</b> <span class="muted small">(erscheint als „Selbstauskunft“)</span></p>
     <form id="oen" style="display:grid;gap:8px"><select id="ok" style="font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:inherit">${['Umbau','Teiletausch','Pflege','Reparatur','Schaden','Kauf'].map(x=>`<option>${x}</option>`).join('')}</select><input id="ot" required minlength="3" maxlength="500" placeholder="Was wurde gemacht? z. B. neuer Sattel" style="font:inherit;letter-spacing:0;text-transform:none;font-weight:400"><input id="okm" type="number" min="0" inputmode="numeric" placeholder="Kilometerstand (optional)" style="font:inherit;letter-spacing:0;font-weight:400"><button>Eintragen</button></form><p id="om" class="muted small" style="margin:6px 0 0"></p>
     <p style="margin:14px 0 6px"><b>Deine Daten</b></p><button class="btn ghost" id="oexp" type="button">Fahrradpass als Datei sichern</button> <button class="btn ghost" type="button" onclick="print()">Drucken / PDF</button>`;
    const act=async(a,v)=>{ try{ const x=await ownerCall(code,a,v); if(x.error){ box.querySelector('#om').textContent=OERR[x.error]||'Nicht möglich'; return; } await show0(code); ownerBox(code,x); const nb=document.getElementById('ownd'); if(nb) nb.scrollIntoView({block:'start'}); }catch(e){ box.querySelector('#om').textContent='Gerade nicht erreichbar.'; } };
    box.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>act('vis',{v:b.dataset.v}));
    box.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ if(b.dataset.s==='1'&&!confirm('Rad als gestohlen melden? Jeder Scan zeigt dann eine Warnung, und eine Übergabe an einen neuen Besitzer ist gesperrt.')) return; act('stolen',{v:b.dataset.s==='1'}); });
    box.querySelector('#oexp').onclick=()=>{ const P=window.__P||{}; const data={format:'FYF-Fahrradpass',version:1,exported:new Date().toISOString(),code,bike:P.bike,owner_no:P.owner_no,owner_since:P.owner_since,stolen:P.stolen,checks:P.checks||[],entries:(P.entries||[]).map(e=>({nr:e.id,date:e.date,kind:e.kind,text:e.text,km:e.km,by:e.shop,trust:e.trust,corrects:e.corrects||null}))}; const u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})); const a=document.createElement('a'); a.href=u; a.download='FYF-Fahrradpass-'+code+'.json'; document.body.appendChild(a); a.click(); a.remove(); };
    box.querySelector('#oen').onsubmit=e=>{ e.preventDefault(); act('entry',{kind:box.querySelector('#ok').value,text:box.querySelector('#ot').value,km:box.querySelector('#okm').value}); }; };
  if(r0) panel(r0); else lock(); }
async function show(code){ await show0(code); const P=window.__P; if(!P||!/^[A-HJ-NP-Z2-9]{8}$/.test(code)) return;
  const name=(P.bike&&P.bike.name)||'Fahrrad', isMine=mine().some(m=>m.code===code);
  if(isMine) mineAdd(code,name);
  if(window.__OFF){ const h=app.querySelector('.hero'); if(h) h.insertAdjacentHTML('afterend',`<div class="card small">Offline – Stand vom ${fd(window.__OFF)}</div>`); }
  const am=document.getElementById('addMine'); if(am) am.onclick=()=>{ mineAdd(code,name); cacheSet(code,P); tabs('meine'); scrollTo(0,0); show(code); };
  const qs=document.getElementById('qrShow'); if(qs) qs.onclick=()=>qrSheet(code,name);
  const pb=document.getElementById('photo'), pi=document.getElementById('photoIn'); if(pb&&pi){ pb.onclick=()=>pi.click(); pi.onchange=()=>{ const f=pi.files&&pi.files[0]; if(f) savePhoto(code,f).then(()=>show(code)); }; }
  if(!window.__OFF&&!P.withdrawn&&document.getElementById('ownhost')) ownerBox(code); }
// ---------- App „FYF Pass“: Meine Räder (nur auf diesem Gerät), digitaler Pass mit QR, offline lesbar ----------
const LS=k=>{ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }, LSset=(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
const mine=()=>LS('fyfpass:mine')||[];
const mineAdd=(code,name)=>{ const l=mine().filter(m=>m.code!==code); l.unshift({code,name:String(name||'Fahrrad').slice(0,80),at:new Date().toISOString().slice(0,10)}); LSset('fyfpass:mine',l.slice(0,20)); };
const mineDel=code=>{ LSset('fyfpass:mine',mine().filter(m=>m.code!==code)); try{ localStorage.removeItem('fyfpass:c:'+code); localStorage.removeItem('fyfpass:img:'+code); }catch(e){} };
const cacheGet=code=>LS('fyfpass:c:'+code), cacheSet=(code,p)=>LSset('fyfpass:c:'+code,{p,at:new Date().toISOString()});
const standalone=()=>window.navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
const ios=()=>/iPhone|iPad|iPod/.test(navigator.userAgent);
function installHint(){ if(standalone()) return ''; return `<div class="card"><b>Als App aufs iPhone</b><p class="muted small" style="margin:4px 0 0">${ios()?'In Safari unten auf <b>Teilen</b> (Quadrat mit Pfeil) → <b>Zum Home-Bildschirm</b>. Dann hast du „FYF Pass“ wie eine App.':'Im Browser-Menü <b>App installieren</b> bzw. <b>Zum Startbildschirm</b> wählen.'}</p></div>`; }
function bikeStatus(code){ const c=cacheGet(code); if(!c||!c.p) return ['','Pass aktiv']; const P=c.p; if(P.stolen) return ['bad','Als gestohlen gemeldet']; if(P.withdrawn) return ['warn','Pass zurückgezogen'];
  const last=(P.entries||[]).filter(e=>e.kind!=='Registrierung').map(e=>e.date).sort().pop(); if(!last) return ['warn','Noch kein Service eingetragen']; const days=Math.round((Date.now()-new Date(last))/864e5); return days>365?['warn',`Letzter Service vor ${Math.round(days/30)} Monaten`]:['',`Gepflegt · Service ${fd(last)}`]; }
// Rad-Zeichnung je Art (eigene Grafik) oder eigenes Foto (nur auf diesem Gerät)
function bikeSvg(type){ const t=String(type||'').toLowerCase(); const mtb=/mtb|mountain/.test(t), eb=/e-bike|pedelec/.test(t), city=/stadt|trekking|city|lasten|kinder/.test(t), grav=/gravel/.test(t);
  const tire=mtb?9:grav?7:eb?7:5, bar=mtb||city||eb?'M128 30l4-12h10':'M128 30l6-14h8q8 0 8 7q0 6-8 7';
  return `<svg viewBox="0 0 220 130" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="52" cy="88" r="32" stroke="#1b1f22" stroke-width="${tire}"/><circle cx="168" cy="88" r="32" stroke="#1b1f22" stroke-width="${tire}"/><circle cx="52" cy="88" r="3" fill="#1b1f22"/><circle cx="168" cy="88" r="3" fill="#1b1f22"/>
   <path d="M52 88L84 40h46l38 48M84 40l24 48H52M108 88l22-48M130 40l-2-10${mtb?'M134 50l30 38':''}" stroke="#1b1f22" stroke-width="5"/><path d="${bar}" stroke="#1b1f22" stroke-width="5"/><path d="M76 30h20" stroke="#e8601c" stroke-width="6"/><path d="M84 40l-4-10" stroke="#1b1f22" stroke-width="4"/>
   ${eb?'<rect x="88" y="52" width="26" height="11" rx="3" transform="rotate(-62 101 57)" fill="#e8601c"/>':''}${city?'<path d="M22 74q30-26 60-6M136 64q32-12 64 12" stroke="#9aa0a4" stroke-width="3"/>':''}<circle cx="108" cy="88" r="6" fill="#e8601c"/></svg>`; }
const photoGet=code=>{ try{ return code?localStorage.getItem('fyfpass:img:'+code):null; }catch(e){ return null; } };
function bikePic(code,type){ const ph=photoGet(code); return `<div class="bikepic">${ph?`<img src="${ph}" alt="Foto des Rads">`:bikeSvg(type)}</div>`; }
function savePhoto(code,file){ return new Promise(ok=>{ const img=new Image(), u=URL.createObjectURL(file); img.onload=()=>{ const W=1000, sc=Math.min(1,W/img.width), cv=document.createElement('canvas'); cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc); cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); let d=cv.toDataURL('image/jpeg',.75); try{ localStorage.setItem('fyfpass:img:'+code,d); }catch(e){ try{ d=cv.toDataURL('image/jpeg',.5); localStorage.setItem('fyfpass:img:'+code,d); }catch(x){ alert('Speicher voll – Foto konnte nicht gespeichert werden.'); } } URL.revokeObjectURL(u); ok(); }; img.onerror=()=>ok(); img.src=u; }); }
async function qrSheet(code,name){ const url=location.origin+location.pathname+'#c='+code+(CF?'&cfg='+CF:''); let qr=''; try{ await loadQR(); const q=window.qrcode(0,'M'); q.addData(url); q.make(); qr=q.createSvgTag({cellSize:4,margin:1,scalable:true}); }catch(e){}
  const el=document.createElement('div'); el.className='sheet'; el.innerHTML=`<div><div class="muted small" style="font-weight:700;letter-spacing:.14em">FYF FAHRRADPASS</div><div style="font-size:22px;font-weight:800;margin-top:4px">${esc(name)}</div><div class="qrbig">${qr||'<span class="muted small">QR braucht Internet</span>'}</div><div style="font:700 24px ui-monospace,Menlo,monospace;letter-spacing:.14em">${code}</div><p class="muted small" style="margin:6px 0 18px">In der Werkstatt vorzeigen</p><button class="btn block" type="button">Fertig</button></div>`;
  document.body.appendChild(el); el.onclick=e=>{ if(e.target===el||e.target.tagName==='BUTTON') el.remove(); }; }
function route(){ scrollTo(0,0); const h=new URLSearchParams((location.hash||'').slice(1)); const c=norm(h.get('c')); tabs(c?(mine().some(m=>m.code===c)?'meine':'pruefen'):(/pruefen/.test(location.hash)?'pruefen':'meine')); if(c) show(c); else askForm(''); }
window.addEventListener('hashchange',route); route();
if(!new URLSearchParams((location.hash||'').slice(1)).get('c')) intro();
try{ if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js'); }catch(e){}
</script>
