@keyframes fyDraw{to{stroke-dashoffset:0}}
@keyframes fyPulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--acc) 45%,transparent)}60%{box-shadow:0 0 0 10px transparent}}
.fy-in>*{animation:fyIn .45s cubic-bezier(.2,.8,.2,1) both}

<script>
"use strict";
// Öffentliche Ansicht eines FYF-Fahrradpasses (QR-Aufkleber am Rahmen). Zeigt nur, was der Besitzer freigegeben hat. Keine Daten über den Besitzer.
const DEFAULT={u:'https://tyfilehmrnibtoalwflf.supabase.co',k:'sb_publishable_DUIWZF8H-BD-HaBUMvTg-A_pbpz1mgT'}; // öffentlicher Schlüssel, kein Geheimnis
// Aufkleber-Bestellung. Leer = Knopf ausgeblendet. Stripe-Bezahl-Links (buy.stripe.com/…) eintragen, sobald Gewerbe, Impressum und Stripe-Konto stehen.
const ORDER=Object.assign({one:'',two:'',price1:'4,90 €',price2:'7,90 €',mail:'',whatsapp:''},window.FYF_ORDER||{});
const orderOn=()=>!!(ORDER.one||ORDER.two||ORDER.mail||ORDER.whatsapp);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=s=>{ if(!s) return ''; const [y,m,d]=String(s).slice(0,10).split('-'); return `${d}.${m}.${y}`; };
const num=v=>Number(v).toLocaleString('de-DE');
const unb64u=s=>decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4))));
const hp=new URLSearchParams((location.hash||'').slice(1)); const CF=hp.get('cfg');
let CFG=DEFAULT; try{ if(CF){ const c=JSON.parse(unb64u(CF)); if(/^https:\/\/[a-z0-9.-]+$|^http:\/\/localhost(:\d+)?$/.test(c.u)&&c.k&&!/^sb_secret_/.test(c.k)) CFG=c; } }catch(e){}
const app=document.getElementById('app');
// Einblenden nach jedem Seitenwechsel (Karten nacheinander)
(function(){ const m=document.getElementById('app'); if(!m) return; new MutationObserver(()=>{ if(m.dataset.anim===String(m.childElementCount+(m.firstElementChild&&m.firstElementChild.textContent||'').length)) return; m.classList.remove('fy-in'); void m.offsetWidth; m.classList.add('fy-in'); m.dataset.anim=String(m.childElementCount+(m.firstElementChild&&m.firstElementChild.textContent||'').length); }).observe(m,{childList:true}); m.innerHTML='<div class="skel"></div><div class="skel" style="height:140px"></div><div class="skel"></div>'; })();
// Erste Schritte: kurze Einführung beim ersten Öffnen
const INTRO=[
 ['Dein Rad bekommt einen Pass','Registriere dein Fahrrad kostenlos – ohne Konto und ohne Namen. Du bekommst einen Code und einen QR-Aufkleber.','<svg viewBox="0 0 120 120"><circle cx="34" cy="78" r="18" fill="none" stroke="currentColor" stroke-width="4" class="draw"/><circle cx="88" cy="78" r="18" fill="none" stroke="currentColor" stroke-width="4" class="draw"/><path d="M34 78l18-32h22l14 32M52 46l8 32H34M66 36h12" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="draw"/><rect x="56" y="54" width="16" height="16" rx="3" fill="#d9612c"/></svg>'],
 ['QR-Code aufs Rad kleben','Am Rahmen klebt dein QR-Code. Jede FYF-Werkstatt scannt ihn und trägt Service, Reparaturen und neue Teile ein.','<svg viewBox="0 0 120 120"><rect x="25" y="25" width="70" height="70" rx="10" fill="none" stroke="currentColor" stroke-width="4"/><path d="M38 38h14v14H38zM68 38h14v14H68zM38 68h14v14H38zM66 66h6v6h-6zM76 76h6v6h-6zM66 78h4M78 66h4" fill="currentColor"/><rect class="scanline" x="20" y="40" width="80" height="4" rx="2" fill="#d9612c"/></svg>'],
 ['Sicher bei Diebstahl und Verkauf','Wird es gestohlen, meldest du es mit einem Tipp – jede FYF-Werkstatt wird gewarnt. Beim Verkauf gibst du die ganze Geschichte einfach weiter.','<svg viewBox="0 0 120 120"><path d="M60 18l34 12v26c0 22-14 38-34 46C40 94 26 78 26 56V30z" fill="none" stroke="currentColor" stroke-width="4" class="draw"/><path d="M45 60l11 11 20-22" fill="none" stroke="#1d6b35" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" class="draw"/></svg>'],
 ['Werkstatt finden, Rad kaufen','Unten findest du FYF-Werkstätten mit freien Terminen und den Marktplatz mit Gebrauchträdern, deren Geschichte du nachlesen kannst.','<svg viewBox="0 0 120 120"><path d="M22 52l8-22h60l8 22M26 52v40h68V52M48 92V70h24v22M22 52h76" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round" class="draw"/><circle cx="92" cy="30" r="12" fill="#d9612c"/><path d="M87 30l4 4 7-8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></svg>']];
function intro(force){ let seen=false; try{ seen=localStorage.getItem('fyfpass:intro')==='1'; }catch(e){} if(seen&&!force) return; let i=0;
  const el=document.createElement('div'); el.className='intro'; el.setAttribute('role','dialog'); el.setAttribute('aria-label','Einführung FYF Pass'); document.body.appendChild(el);
  const done=()=>{ try{ localStorage.setItem('fyfpass:intro','1'); }catch(e){} el.style.transition='opacity .25s'; el.style.opacity='0'; setTimeout(()=>el.remove(),260); };
  const draw=()=>{ const [t,x,svg]=INTRO[i]; el.innerHTML=`<div style="text-align:right"><button class="btn ghost" id="isk" style="padding:6px 12px">Überspringen</button></div><div class="sl fy-in"><div class="ill" style="color:var(--ink)">${svg}</div><h1 style="margin:0">${t}</h1><p class="muted" style="margin:0;font-size:17px">${x}</p></div><div class="dots">${INTRO.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div><button id="inx" style="width:100%;max-width:420px;margin:0 auto;display:block;padding:14px">${i<INTRO.length-1?'Weiter':'Los geht’s'}</button>`;
    el.querySelector('#isk').onclick=done; el.querySelector('#inx').onclick=()=>{ if(i<INTRO.length-1){ i++; draw(); } else done(); }; };

function normImg(img){ const M=1400, sc=Math.min(1,M/Math.max(img.width,img.height)), cv=document.createElement('canvas'); cv.width=Math.max(1,Math.round(img.width*sc)); cv.height=Math.max(1,Math.round(img.height*sc)); const g=cv.getContext('2d'); g.drawImage(img,0,0,cv.width,cv.height);
  let d; try{ d=g.getImageData(0,0,cv.width,cv.height).data; }catch(e){ return {cv,alpha:false,box:null}; }
  let n=0,x0=cv.width,y0=cv.height,x1=-1,y1=-1; for(let y=0;y<cv.height;y++) for(let x=0;x<cv.width;x++){ const a=d[(y*cv.width+x)*4+3]; if(a<250) n++; if(a>24){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
  const alpha=n>cv.width*cv.height*0.02&&x1>x0; return {cv,alpha,box:alpha?[x0,y0,x1-x0+1,y1-y0+1]:null}; }
async function pasteImg(){ if(!(navigator.clipboard&&navigator.clipboard.read)) throw new Error('nope'); const items=await navigator.clipboard.read(); for(const it of items){ const t=it.types.find(x=>x.startsWith('image/')); if(t) return await it.getType(t); } throw new Error('kein Bild'); }
function photoMenu(code){ const has=!!photoGet(code), el=document.createElement('div'); el.className='sheet';
  el.innerHTML=`<div><div style="font-size:20px;font-weight:800;margin-bottom:14px">Foto</div><div style="display:grid;gap:10px"><button class="btn block" data-a="pick" type="button">Foto wählen</button><button class="btn ghost block" data-a="paste" type="button">Freigestelltes Rad einfügen</button>${has?'<button class="btn ghost block" data-a="edit" type="button">Zuschneiden</button><button class="btn ghost block" data-a="del" type="button" style="color:#b3261e">Foto entfernen</button>':''}<details class="more" style="text-align:left"><summary>Hintergrund entfernen – so geht’s</summary><ol class="muted small" style="margin:8px 0 0;padding-left:20px;line-height:1.55"><li>Foto in der iPhone-App <b>Fotos</b> öffnen.</li><li>Lange auf das Rad drücken, bis es leuchtet.</li><li><b>Kopieren</b> tippen.</li><li>Hier <b>Freigestelltes Rad einfügen</b> tippen.</li></ol><p class="muted small" style="margin:6px 0 0">Das Rad steht dann auf weißem Hintergrund. Alternativ: statt Kopieren „Teilen → Bild sichern“ und dann „Foto wählen“.</p></details><button class="btn ghost block" data-a="x" type="button">Abbrechen</button></div><input type="file" accept="image/*" hidden></div>`;
  document.body.appendChild(el); const fi=el.querySelector('input'), close=()=>el.remove();
  el.onclick=async e=>{ if(e.target===el) return close(); const a=e.target.closest('[data-a]'); if(!a) return; const k=a.dataset.a;
    if(k==='x') return close(); if(k==='pick') return fi.click();
    if(k==='del'){ try{ localStorage.removeItem('fyfpass:img:'+code); localStorage.removeItem(IMGO+code); }catch(x){} close(); return show(code); }
    if(k==='edit'){ const src=(()=>{ try{ return localStorage.getItem(IMGO+code)||photoGet(code); }catch(x){ return photoGet(code); } })(); close(); try{ photoEditor(code,await loadImg(src)); }catch(x){} return; }
    if(k==='paste'){ try{ const b=await pasteImg(); close(); photoEditor(code,await fileToImg(b),true); }catch(x){ a.textContent='Kein Bild in der Zwischenablage'; setTimeout(()=>a.textContent='Freigestelltes Rad einfügen',2200); } } };
  fi.onchange=async()=>{ const f=fi.files&&fi.files[0]; if(!f) return; close(); try{ photoEditor(code,await fileToImg(f),true); }catch(x){ alert('Bild konnte nicht geladen werden.'); } }; }
function photoEditor(code,img,isNew){ const N=normImg(img), src=N.cv, W=1200, H=900, el=document.createElement('div'); el.className='sheet';
  el.innerHTML=`<div><div style="font-size:20px;font-weight:800">Zuschneiden</div><p class="muted small" style="margin:4px 0 12px">Verschieben mit dem Finger, zoomen mit zwei Fingern oder dem Regler.</p><canvas class="pedc" width="${W}" height="${H}" style="width:100%;aspect-ratio:4/3;border-radius:20px;touch-action:none;background:#fff;box-shadow:var(--sh);cursor:grab"></canvas><input class="pedz" type="range" min="0" max="1000" value="0" style="width:100%;margin:14px 0 6px" aria-label="Zoom"><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:12px"><button class="btn ghost" style="padding:9px 16px;font-size:14px" data-a="auto" type="button">${N.alpha?'Rad zentrieren':'Ganzes Bild'}</button>${N.alpha?'<span class="muted small" style="align-self:center">✓ Hintergrund weiß</span>':''}</div><div style="display:flex;gap:10px"><button class="btn ghost" data-a="x" type="button" style="flex:1">Abbrechen</button><button class="btn" data-a="ok" type="button" style="flex:1">Übernehmen</button></div></div>`;
  document.body.appendChild(el); const cv=el.querySelector('canvas'), g=cv.getContext('2d'), z=el.querySelector('.pedz');
  const sMin=Math.min(W/src.width,H/src.height)*0.6, sMax=Math.max(W/src.width,H/src.height)*4; let s,ox,oy;
  const fit=()=>{ if(N.box){ const [bx,by,bw,bh]=N.box; s=Math.min(W*0.92/bw,H*0.86/bh); ox=W/2-(bx+bw/2)*s; oy=H*0.53-(by+bh/2)*s; } else { s=Math.max(W/src.width,H/src.height); ox=(W-src.width*s)/2; oy=(H-src.height*s)/2; } s=Math.min(sMax,Math.max(sMin,s)); sync(); draw(); };
  const toZ=v=>Math.log(v/sMin)/Math.log(sMax/sMin)*1000, fromZ=v=>sMin*Math.pow(sMax/sMin,v/1000);
  const sync=()=>{ z.value=String(Math.round(toZ(s))); };
  const draw=()=>{ g.fillStyle='#fff'; g.fillRect(0,0,W,H); g.imageSmoothingQuality='high'; g.drawImage(src,ox,oy,src.width*s,src.height*s); };
  const zoomAt=(ns,cx,cy)=>{ ns=Math.min(sMax,Math.max(sMin,ns)); ox=cx-(cx-ox)*ns/s; oy=cy-(cy-oy)*ns/s; s=ns; draw(); };
  const pt=e=>{ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]; };
  const P=new Map(); let last=null;
  cv.onpointerdown=e=>{ cv.setPointerCapture(e.pointerId); P.set(e.pointerId,pt(e)); last=null; };
  cv.onpointermove=e=>{ if(!P.has(e.pointerId)) return; const prev=P.get(e.pointerId), cur=pt(e); P.set(e.pointerId,cur);
    if(P.size===1){ ox+=cur[0]-prev[0]; oy+=cur[1]-prev[1]; draw(); }
    else if(P.size===2){ const [a,b]=[...P.values()], d=Math.hypot(a[0]-b[0],a[1]-b[1]), m=[(a[0]+b[0])/2,(a[1]+b[1])/2]; if(last){ ox+=m[0]-last.m[0]; oy+=m[1]-last.m[1]; zoomAt(s*d/last.d,m[0],m[1]); sync(); } last={d,m}; } };
  cv.onpointerup=cv.onpointercancel=e=>{ P.delete(e.pointerId); last=null; };
  cv.onwheel=e=>{ e.preventDefault(); const [x,y]=pt(e); zoomAt(s*Math.exp(-e.deltaY*0.0015),x,y); sync(); };
  z.oninput=()=>zoomAt(fromZ(+z.value),W/2,H/2);
  el.onclick=e=>{ const a=e.target.closest('[data-a]'); if(!a) return; const k=a.dataset.a; if(k==='x') return el.remove(); if(k==='auto') return fit();
    if(k==='ok'){ draw(); let ok=false; for(const q of [.8,.6,.45]){ try{ localStorage.setItem('fyfpass:img:'+code,cv.toDataURL('image/jpeg',q)); ok=true; break; }catch(x){} }
      if(!ok){ alert('Speicher voll – Foto konnte nicht gespeichert werden.'); return; }
      if(isNew){ try{ localStorage.removeItem(IMGO+code); localStorage.setItem(IMGO+code,N.alpha?src.toDataURL('image/png'):src.toDataURL('image/jpeg',.8)); }catch(x){ try{ localStorage.removeItem(IMGO+code); }catch(y){} } }
      el.remove(); show(code); } };
  fit(); }
async function qrSheet(code,name){ const url=location.origin+location.pathname+'#c='+code+(CF?'&cfg='+CF:''); let qr=''; try{ await loadQR(); const q=window.qrcode(0,'M'); q.addData(url); q.make(); qr=q.createSvgTag({cellSize:4,margin:1,scalable:true}); }catch(e){}
  const el=document.createElement('div'); el.className='sheet'; el.innerHTML=`<div><div class="muted small" style="font-weight:700;letter-spacing:.14em">FYF FAHRRADPASS</div><div style="font-size:22px;font-weight:800;margin-top:4px">${esc(name)}</div><div class="qrbig">${qr||'<span class="muted small">QR braucht Internet</span>'}</div><div style="font:700 24px ui-monospace,Menlo,monospace;letter-spacing:.14em">${code}</div><p class="muted small" style="margin:6px 0 18px">In der Werkstatt vorzeigen</p><button class="btn block" type="button">Fertig</button></div>`;
  document.body.appendChild(el); el.onclick=e=>{ if(e.target===el||e.target.tagName==='BUTTON') el.remove(); }; }
function orderSheet(code,name){ const ref=encodeURIComponent(code), msg=encodeURIComponent(`Hallo, ich möchte einen FYF-Aufkleber für mein Rad „${name}“ bestellen. Fahrradpass-Code: ${code}`);
  const link=u=>u+(u.includes('?')?'&':'?')+'client_reference_id='+ref;
  const el=document.createElement('div'); el.className='sheet'; el.innerHTML=`<div style="text-align:left"><div class="muted small" style="font-weight:700;letter-spacing:.14em;text-align:center">FYF AUFKLEBER</div><div style="font-size:22px;font-weight:800;margin:4px 0 2px;text-align:center">Wetterfest, klein, für deinen Rahmen</div><p class="muted small" style="text-align:center;margin:0 0 16px">Mit deinem QR-Code ${code} – Versand per Brief.</p>
    <div style="display:grid;gap:10px">${ORDER.one?`<a class="btn block" href="${esc(link(ORDER.one))}" target="_blank" rel="noopener">1 Aufkleber · ${esc(ORDER.price1)}</a>`:''}${ORDER.two?`<a class="btn block ghost" href="${esc(link(ORDER.two))}" target="_blank" rel="noopener">2er-Set · ${esc(ORDER.price2)}</a>`:''}
    ${!ORDER.one&&!ORDER.two&&ORDER.whatsapp?`<a class="btn block" href="https://wa.me/${esc(String(ORDER.whatsapp).replace(/\D/g,''))}?text=${msg}" target="_blank" rel="noopener">Per WhatsApp anfragen</a>`:''}${!ORDER.one&&!ORDER.two&&ORDER.mail?`<a class="btn block ghost" href="mailto:${esc(ORDER.mail)}?subject=${encodeURIComponent('FYF-Aufkleber '+code)}&body=${msg}">Per E-Mail anfragen</a>`:''}</div>
    ${ORDER.one||ORDER.two?`<p class="muted small" style="margin:12px 0 0">Bezahlung sicher über Stripe (Karte, Apple Pay). Bitte im Bestellformular den Code <b>${code}</b> angeben, falls danach gefragt wird.</p>`:''}
    <p class="small" style="margin:12px 0 16px;text-align:center"><a href="kauf.html" target="_blank">Bestellinfos</a> · <a href="impressum.html" target="_blank">Impressum</a> · <a href="datenschutz.html" target="_blank">Datenschutz</a></p><button class="btn block ghost" type="button">Schließen</button></div>`;
  document.body.appendChild(el); el.onclick=e=>{ if(e.target===el||e.target.tagName==='BUTTON') el.remove(); }; }
function thanksSheet(){ const el=document.createElement('div'); el.className='sheet'; el.innerHTML=`<div><svg class="okcheck" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30"/><path d="M19 33l9 9 17-19"/></svg><div style="font-size:22px;font-weight:800">Danke für deine Bestellung!</div><p class="muted" style="margin:6px 0 18px">Dein Aufkleber geht in den nächsten Werktagen per Brief raus.</p><button class="btn block" type="button">Fertig</button></div>`; document.body.appendChild(el); el.onclick=e=>{ if(e.target===el||e.target.tagName==='BUTTON') el.remove(); }; }
function route(){ scrollTo(0,0); const h=new URLSearchParams((location.hash||'').slice(1)); const c=norm(h.get('c')); tabs(c?(mine().some(m=>m.code===c)?'meine':'pruefen'):(/pruefen/.test(location.hash)?'pruefen':'meine')); if(c) show(c); else askForm(''); }
window.addEventListener('hashchange',route); route();
if(/(^|[#&])bestellt=1/.test(location.hash)) thanksSheet();
if(!new URLSearchParams((location.hash||'').slice(1)).get('c')) intro();
try{ if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js'); }catch(e){}
</script>
