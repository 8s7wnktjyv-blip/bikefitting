<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Kostenvoranschlag</title>
<style>
:root{--bg:#f7f3ee;--card:#fffdf9;--ink:#1d2a30;--muted:#5f6b70;--line:#e5ddd2;--acc:#d9612c;--ok:#1d6b35;--bad:#a23b2a}
@media (prefers-color-scheme:dark){:root{--bg:#14191b;--card:#1c2326;--ink:#e8eef0;--muted:#9aa7ac;--line:#2c3539;--acc:#f07a45;--ok:#6fcf8f;--bad:#ff8a73}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:26px;margin:4px 0}.muted{color:var(--muted)}.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
table{width:100%;border-collapse:collapse}td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top}td.r{text-align:right;white-space:nowrap;padding-left:10px}
tr.sum td{border:0;font-weight:700;font-size:18px;padding-top:12px}
label{display:block;font-size:14px;margin:10px 0 4px}
input,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;flex:1 1 160px}
.yes{background:var(--ok);color:#fff}.no{background:transparent;color:var(--ink);border:1px solid var(--line)}
.done{font-size:18px;font-weight:600}
a{color:var(--acc)}
</style>
</head>
<body>
<main id="app"><p class="muted">Lädt …</p></main>
<script>
"use strict";
// Kostenvoranschlag freigeben. Liest und beantwortet genau einen Kostenvoranschlag über seinen geheimen Schlüssel (t).
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=v=>Number(v||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const num=v=>Number(v||0).toLocaleString('de-DE',{maximumFractionDigits:2});
const fd=s=>{ if(!s) return ''; const [y,m,d]=String(s).slice(0,10).split('-'); return `${d}.${m}.${y}`; };
const unb64u=s=>decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4))));
const hp=new URLSearchParams((location.hash||'').slice(1)); const T=hp.get('t')||'';
let CFG=null; try{ const c=JSON.parse(unb64u(hp.get('cfg')||'')); if(/^https:\/\/[a-z0-9.-]+$|^http:\/\/localhost(:\d+)?$/.test(c.u)&&c.k&&!/^sb_secret_/.test(c.k)) CFG=c; }catch(e){}
const api=async(path,body)=>{ const r=await fetch(CFG.u+path,{method:'POST',headers:{apikey:CFG.k,'Content-Type':'application/json'},body:JSON.stringify(body)}); const t=await r.text(); let j=null; try{ j=t?JSON.parse(t):null; }catch(e){} if(!r.ok) throw new Error((j&&(j.message||j.msg))||('Fehler '+r.status)); return j; };
const app=document.getElementById('app');
const msg=(h,t)=>{ app.innerHTML=`<h1>${h}</h1><div class="card">${t}</div>`; };
async function start(){
  if(!CFG||!/^[a-f0-9]{32}$/.test(T)) return msg('Link unvollständig','Bitte den Link aus der Nachricht der Werkstatt vollständig öffnen.');
  let r; try{ r=await api('/rest/v1/rpc/kva_get',{p_token:T}); }catch(e){ return msg('Gerade nicht erreichbar','Bitte später noch einmal öffnen oder die Werkstatt anrufen.'); }
  const k=r&&r[0]; if(!k) return msg('Nicht gefunden','Dieser Kostenvoranschlag ist nicht mehr verfügbar. Vielleicht hat die Werkstatt einen neueren geschickt.');
  const p=k.payload||{}, sh=p.shop||{};
  const contact=`${esc(sh.name||'')}${sh.phone?` · <a href="tel:${esc(String(sh.phone).replace(/[^\d+]/g,''))}">${esc(sh.phone)}</a>`:''}${sh.email?` · <a href="mailto:${esc(sh.email)}">${esc(sh.email)}</a>`:''}`;
  app.innerHTML=`<p class="muted small">${esc(sh.name||'Werkstatt')}${sh.addr?' · '+esc(sh.addr):''}</p><h1>Kostenvoranschlag</h1>
   <p>${p.greet?`Hallo ${esc(p.greet)}, `:''}hier ist der Kostenvoranschlag für ${p.bike?`dein <b>${esc(p.bike)}</b>`:'dein Rad'}${p.wo&&p.wo.title?` (${esc(p.wo.title)})`:''}.</p>
   <div class="card"><table>${(p.items||[]).map(i=>`<tr><td>${esc(i.t)}<br><span class="muted small">${esc(i.kind||'')} · ${num(i.qty)} ${i.kind==='Arbeit'?'Std.':'Stk.'} × ${eur(i.price)}</span></td><td class="r">${eur((Number(i.qty)||0)*(Number(i.price)||0))}</td></tr>`).join('')}
   <tr class="sum"><td>Summe</td><td class="r">${eur(p.total)}</td></tr></table>
   <p class="muted small" style="margin-bottom:0">Alle Beträge inkl. MwSt. Stand ${fd(p.date)}${p.due?` · geplant fertig ${fd(p.due)}`:''}.</p></div>
   <div class="card" id="act"></div><p class="muted small">Fragen? ${contact}</p>`;
  const act=document.getElementById('act');
  if(k.decision) { act.innerHTML=`<p class="done">${k.decision==='freigegeben'?'✓ Freigegeben':'Abgelehnt'} am ${new Date(k.decided_at).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}</p><p class="muted small" style="margin:0">Änderungen bitte direkt mit der Werkstatt klären.</p>`; return; }
  if(k.expired){ act.innerHTML='<p>Dieser Link ist abgelaufen. Bitte die Werkstatt um einen neuen.</p>'; return; }
  act.innerHTML=`<form id="f"><label for="n">Dein Name</label><input id="n" required minlength="2" maxlength="100" autocomplete="name" value="${esc(p.greet||'')}">
   <label for="m">Nachricht an die Werkstatt (optional)</label><textarea id="m" rows="3" maxlength="1000"></textarea>
   <p class="small muted">Mit „Freigeben“ beauftragst du die Arbeiten zu diesem Kostenvoranschlag. Zusätzliche Arbeiten macht die Werkstatt nur nach Rücksprache.</p>
   <div class="row"><button type="submit" class="yes" data-d="freigegeben">Freigeben</button><button type="submit" class="no" data-d="abgelehnt">Ablehnen</button></div><p id="e" class="small"></p></form>`;
  let dec='freigegeben'; act.querySelectorAll('button[data-d]').forEach(b=>b.onclick=()=>{ dec=b.dataset.d; });
  document.getElementById('f').onsubmit=async e=>{ e.preventDefault(); const bs=act.querySelectorAll('button'); bs.forEach(b=>b.disabled=true); document.getElementById('e').textContent='Wird gesendet …';
    try{ await api('/rest/v1/rpc/kva_answer',{p_token:T,p_decision:dec,p_name:document.getElementById('n').value,p_note:document.getElementById('m').value}); start(); }
    catch(err){ const t=String(err.message); document.getElementById('e').textContent=/FYF_ALREADY/.test(t)?'Wurde schon beantwortet.':/FYF_BAD_DATA/.test(t)?'Bitte deinen Namen eintragen.':'Senden hat nicht geklappt. Bitte später noch einmal oder anrufen.'; bs.forEach(b=>b.disabled=false); if(/FYF_ALREADY/.test(t)) start(); } }; }
start();
</script>
</body>
</html>
