<style>
:root{--bg:#f7f3ee;--card:#fffdf9;--ink:#1d2a30;--muted:#5f6b70;--line:#e5ddd2;--acc:#d9612c;--ok:#1d6b35}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}

a{color:var(--acc)}

/* ---- Bewegung (abschaltbar über „Bewegung reduzieren“ im iPhone) ---- */
@keyframes fyIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fyPop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes fyShine{0%{transform:translateX(-120%) skewX(-20deg)}60%,100%{transform:translateX(260%) skewX(-20deg)}}
@keyframes fySkel{0%{background-position:-200px 0}100%{background-position:200px 0}}
@keyframes fyScan{0%,100%{transform:translateY(0)}50%{transform:translateY(34px)}}
@keyframes fyDraw{to{stroke-dashoffset:0}}
@keyframes fyPulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--acc) 45%,transparent)}60%{box-shadow:0 0 0 10px transparent}}
.fy-in>*{animation:fyIn .45s cubic-bezier(.2,.8,.2,1) both}
.fy-in>*:nth-child(2){animation-delay:.05s}.fy-in>*:nth-child(3){animation-delay:.1s}.fy-in>*:nth-child(4){animation-delay:.15s}.fy-in>*:nth-child(5){animation-delay:.2s}.fy-in>*:nth-child(6){animation-delay:.25s}.fy-in>*:nth-child(n+7){animation-delay:.3s}
button,.btn{transition:transform .12s ease,filter .2s ease}button:active,.btn:active{transform:scale(.96)}
.tabs a{transition:color .2s}.tabs a svg{transition:transform .25s cubic-bezier(.2,.8,.2,1)}.tabs a.on svg{transform:translateY(-2px) scale(1.12)}
.tabs a.on::after{content:"";display:block;width:18px;height:3px;border-radius:2px;background:var(--acc);margin-top:1px;animation:fyPop .3s both}
.wallet{position:relative;overflow:hidden}.wallet::after{content:"";position:absolute;top:0;left:0;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);animation:fyShine 3.2s ease-in-out 1s infinite}
.skel{height:84px;border-radius:16px;margin:12px 0;background:linear-gradient(90deg,var(--line) 0,var(--card) 40%,var(--line) 80%);background-size:400px 100%;animation:fySkel 1.1s linear infinite}
.pulse{animation:fyPulse 1.8s ease-out 3}
.steps{display:grid;gap:10px;margin:8px 0 0}.step{display:flex;gap:12px;align-items:flex-start}.step b.n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:14px}
.help{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}.help summary{cursor:pointer;font-weight:600;list-style:none}.help summary::before{content:"? ";display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--line);font-size:12px;margin-right:6px}
.intro{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));animation:fyIn .35s both}
.intro .sl{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;max-width:420px;margin:0 auto}
.intro .ill{width:170px;height:170px}.intro .ill svg{width:100%;height:100%}
.intro .dots{display:flex;gap:6px;justify-content:center;margin:12px 0}.intro .dots i{width:8px;height:8px;border-radius:4px;background:var(--line);transition:width .3s,background .3s}.intro .dots i.on{width:22px;background:var(--acc)}
.ill .scanline{animation:fyScan 1.6s ease-in-out infinite}.ill .draw{stroke-dasharray:600;stroke-dashoffset:600;animation:fyDraw 1.6s .2s ease forwards}
.okcheck{width:64px;height:64px;margin:4px auto 6px;display:block}.okcheck circle{fill:var(--ok);animation:fyPop .45s both}.okcheck path{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:fyDraw .5s .35s ease forwards}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.ill .draw,.okcheck path{stroke-dashoffset:0}}

.ok{color:var(--ok);font-weight:700}

.help{background:transparent;border:0;padding:0;margin:6px 0}.help summary{font-size:14px;color:var(--muted);font-weight:600}.help summary::before{background:var(--card);color:var(--ink)}
.skel{background:linear-gradient(90deg,#ececea 0,#f7f7f5 40%,#ececea 80%);background-size:400px 100%;border-radius:var(--r)}
.intro{background:var(--bg)}.intro .ill{width:220px;height:220px;border-radius:50%;background:var(--card);box-shadow:var(--sh);padding:30px;display:grid;place-items:center;color:var(--ink)!important}
.e{position:relative;padding:12px 0 12px 22px;border:0!important}.e::before{content:"";position:absolute;left:4px;top:19px;width:9px;height:9px;border-radius:50%;background:var(--ink)}.e::after{content:"";position:absolute;left:8px;top:31px;bottom:-12px;width:1px;background:var(--line)}.e:last-child::after{display:none}.e.x{opacity:.5}
/* Garage & Rad */
.garage{display:grid;gap:14px}

details.more{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:4px 18px;margin:12px 0}details.more>summary{list-style:none;cursor:pointer;padding:14px 0;font-weight:650;display:flex;justify-content:space-between}details.more>summary::after{content:"+";font-size:20px;color:var(--muted)}details.more[open]>summary::after{content:"–"}details.more>div{padding:0 0 14px}

<script>
"use strict";
// Öffentliche Händlersuche. Liest nur veröffentlichte Profile und freigegebene Produkte (Supabase, öffentlicher Schlüssel).
// Konfiguration: fest unten in DEFAULT oder über den Link #cfg=... aus der App.
const DEFAULT={u:'https://tyfilehmrnibtoalwflf.supabase.co',k:'sb_publishable_DUIWZF8H-BD-HaBUMvTg-A_pbpz1mgT'}; // öffentlicher Schlüssel, kein Geheimnis
const LEGAL={impressum:'impressum.html',datenschutz:'datenschutz.html'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=v=>Number(v||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const unb64u=s=>decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4))));
const hp=new URLSearchParams((location.hash||'').slice(1));
// Nur der offizielle FYF-Server (und localhost zum Testen) – gefälschte QR-Links können keine fremden Daten unter dieser Adresse anzeigen
let CFG=DEFAULT; try{ if(hp.get('cfg')){ const c=JSON.parse(unb64u(hp.get('cfg'))); if(/^https:\/\/tyfilehmrnibtoalwflf\.supabase\.co$|^http:\/\/localhost(:\d+)?$/.test(c.u)&&c.k&&!/^sb_secret_/.test(c.k)) CFG=c; } }catch(e){}
const api=async(path,opt={})=>{ const r=await fetch(CFG.u+path,{...opt,headers:{apikey:CFG.k,'Content-Type':'application/json',...(opt.headers||{})}}); const t=await r.text(); let j=null; try{ j=t?JSON.parse(t):null; }catch(e){} if(!r.ok) throw new Error((j&&(j.message||j.msg))||('Fehler '+r.status)); return j; };
const app=document.getElementById('app');
// Einblenden nach jedem Seitenwechsel (Karten nacheinander)
(function(){ const m=document.getElementById('app'); if(!m) return; new MutationObserver(()=>{ if(m.dataset.anim===String(m.childElementCount+(m.firstElementChild&&m.firstElementChild.textContent||'').length)) return; m.classList.remove('fy-in'); void m.offsetWidth; m.classList.add('fy-in'); m.dataset.anim=String(m.childElementCount+(m.firstElementChild&&m.firstElementChild.textContent||'').length); }).observe(m,{childList:true}); m.innerHTML='<div class="skel"></div><div class="skel" style="height:140px"></div><div class="skel"></div>'; })();
// Erste Schritte: kurze Einführung beim ersten Öffnen
const INTRO=[
 ['Dein Rad bekommt einen Pass','Registriere dein Fahrrad kostenlos – ohne Konto und ohne Namen. Du bekommst einen Code und einen QR-Aufkleber.','<svg viewBox="0 0 120 120"><circle cx="34" cy="78" r="18" fill="none" stroke="currentColor" stroke-width="4" class="draw"/><circle cx="88" cy="78" r="18" fill="none" stroke="currentColor" stroke-width="4" class="draw"/><path d="M34 78l18-32h22l14 32M52 46l8 32H34M66 36h12" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="draw"/><rect x="56" y="54" width="16" height="16" rx="3" fill="#d9612c"/></svg>'],
 ['QR-Code aufs Rad kleben','Am Rahmen klebt dein QR-Code. Jede FYF-Werkstatt scannt ihn und trägt Service, Reparaturen und neue Teile ein.','<svg viewBox="0 0 120 120"><rect x="25" y="25" width="70" height="70" rx="10" fill="none" stroke="currentColor" stroke-width="4"/><path d="M38 38h14v14H38zM68 38h14v14H68zM38 68h14v14H38zM66 66h6v6h-6zM76 76h6v6h-6zM66 78h4M78 66h4" fill="currentColor"/><rect class="scanline" x="20" y="40" width="80" height="4" rx="2" fill="#d9612c"/></svg>'],
 ['Sicher bei Diebstahl und Verkauf','Wird es gestohlen, meldest du es mit einem Tipp – jede FYF-Werkstatt wird gewarnt. Beim Verkauf gibst du die ganze Geschichte einfach weiter.','<svg viewBox="0 0 120 120"><path d="M60 18l34 12v26c0 22-14 38-34 46C40 94 26 78 26 56V30z" fill="none" stroke="currentColor" stroke-width="4" class="draw"/><path d="M45 60l11 11 20-22" fill="none" stroke="#1d6b35" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" class="draw"/></svg>'],
 ['Werkstatt finden, Rad kaufen','Unten findest du FYF-Werkstätten mit freien Terminen und den Marktplatz mit Gebrauchträdern, deren Geschichte du nachlesen kannst.','<svg viewBox="0 0 120 120"><path d="M22 52l8-22h60l8 22M26 52v40h68V52M48 92V70h24v22M22 52h76" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round" class="draw"/><circle cx="92" cy="30" r="12" fill="#d9612c"/><path d="M87 30l4 4 7-8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></svg>']];
function intro(force){ let seen=false; try{ seen=localStorage.getItem('fyfpass:intro')==='1'; }catch(e){} if(seen&&!force) return; let i=0;
  const el=document.createElement('div'); el.className='intro'; el.setAttribute('role','dialog'); el.setAttribute('aria-label','Einführung FYF Pass'); document.body.appendChild(el);
  const done=()=>{ try{ localStorage.setItem('fyfpass:intro','1'); }catch(e){} el.style.transition='opacity .25s'; el.style.opacity='0'; setTimeout(()=>el.remove(),260); };

  document.getElementById('inq').onsubmit=async e=>{ e.preventDefault(); const f=e.target, b=f.querySelector('button'), m=document.getElementById('msg'); b.disabled=true; m.textContent='Wird gesendet …';
    const sv=(document.getElementById('slotv')||{}).value||'', wd=document.getElementById('wd').value, wt=document.getElementById('wt').value; const pref=sv?new Date(sv.split('|')[0]+'T12:00').toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'})+' '+sv.split('|')[1]+' (freie Zeit)':wd?new Date(wd+'T12:00').toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'})+(wt?' '+wt:''):(wt||'');
    const lv=f.leistung&&f.leistung.value; const base={p_slug:slug,p_topic:f.topic.value,p_name:f.name.value,p_contact:f.contact.value,p_message:(lv?'Leistung: '+lv+'\n':'')+f.message.value,p_product:f.product.value||null,p_hp:f.website.value};
    try{ try{ await api('/rest/v1/rpc/submit_inquiry',{method:'POST',body:JSON.stringify(pref?{...base,p_pref:pref}:base)}); }catch(e1){ if(pref&&/p_pref|function|schema cache/i.test(String(e1.message))) await api('/rest/v1/rpc/submit_inquiry',{method:'POST',body:JSON.stringify({...base,p_message:base.p_message+'\nWunschtermin: '+pref})}); else throw e1; }
      f.innerHTML='<p><b>Danke!</b> Deine Anfrage ist beim Laden angekommen. Er meldet sich bei dir.</p>'; }
    catch(err){ const t=String(err.message); m.textContent=/FYF_RATE/.test(t)?'Zu viele Anfragen. Bitte später noch einmal oder direkt anrufen.':/FYF_BAD_DATA|FYF_TOO_LONG/.test(t)?'Bitte Name, Kontakt und Nachricht prüfen.':'Senden hat nicht geklappt. Bitte später noch einmal oder direkt anrufen.'; b.disabled=false; } }; }
start();
try{ if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js'); }catch(e){}
</script>
